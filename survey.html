<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 배구지수 조사</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .back {
      border: 0;
      background: none;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #2563eb;
    }

    h1 {
      font-size: 30px;
      line-height: 1.3;
      margin: 0 0 10px;
      letter-spacing: -1.3px;
    }

    .description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .school-card {
      background: #eef2ff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 28px;
    }

    .school-label {
      font-size: 13px;
      color: #2563eb;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .school-name {
      font-size: 19px;
      font-weight: 700;
    }

    .school-meta {
      margin-top: 6px;
      font-size: 14px;
      color: #666;
    }

    .question-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.05);
    }

    .question-number {
      font-size: 13px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 8px;
    }

    .question-title {
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      cursor: pointer;
    }

    .option input {
      width: 18px;
      height: 18px;
    }

    .submit-button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .notice {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      line-height: 1.6;
      text-align: center;
    }

    .error,
    .complete {
      background: white;
      border-radius: 18px;
      padding: 32px 22px;
      text-align: center;
      line-height: 1.7;
    }

    .complete h2 {
      margin-top: 0;
      font-size: 24px;
    }

    .button {
      display: block;
      width: 100%;
      text-decoration: none;
      text-align: center;
      border-radius: 12px;
      padding: 15px;
      font-weight: 700;
      margin-top: 12px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #eef2ff;
      color: #2563eb;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="topbar">
      <button class="back" onclick="history.back()">←</button>
      <div class="logo">VOLLEYBALL INDEX</div>
    </div>

    <div id="content">
      학교 정보를 불러오는 중입니다.
    </div>

  </main>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
  
  <script>
    const content = document.getElementById("content");

    let selectedSchool = null;

async function loadSurvey() {

  const params = new URLSearchParams(window.location.search);
  const schoolId = params.get("school");

  if (!schoolId) {
    showError("학교가 선택되지 않았습니다.");
    return;
  }

  try {

    const { data: school, error } = await supabaseClient
      .from("schools")
      .select(`
        school_id,
        school_name,
        sido,
        support_office,
        establishment,
        address,
        status
      `)
      .eq("school_id", schoolId)
      .single();

    if (error) {
      throw error;
    }

    if (!school) {
      showError("해당 학교를 찾을 수 없습니다.");
      return;
    }

    selectedSchool = school;

    renderSurvey();

  } catch (error) {

    console.error("Supabase 학교 조회 오류:", error);

    showError(
      "학교 정보를 불러오는 중 오류가 발생했습니다."
    );

  }
}

    function renderSurvey() {

      content.innerHTML = `

        <h1>2026 배구지수 조사</h1>

        <p class="description">
          아래 문항은 현재 기능 확인을 위한 테스트 문항입니다.
          실제 2026 배구지수 문항은 이후 별도로 연결합니다.
        </p>

        <div class="school-card">

          <div class="school-label">
            응답 학교
          </div>

          <div class="school-name">
            ${selectedSchool.school_name}
          </div>

          <div class="school-meta">
            ${selectedSchool.sido} ·
            ${selectedSchool.support_office}
          </div>

        </div>

        <form id="surveyForm">

          <section class="question-card">

            <div class="question-number">
              TEST 1
            </div>

            <div class="question-title">
              현재 학교의 전반적인 근무 만족도는 어떻습니까?
            </div>

            ${makeScaleOptions("q1")}

          </section>

          <section class="question-card">

            <div class="question-number">
              TEST 2
            </div>

            <div class="question-title">
              현재 학교의 업무 부담은 어느 정도라고 느끼십니까?
            </div>

            ${makeScaleOptions("q2")}

          </section>

          <section class="question-card">

            <div class="question-number">
              TEST 3
            </div>

            <div class="question-title">
              학교의 업무 분장 기준이 예측 가능하다고 느끼십니까?
            </div>

            ${makeScaleOptions("q3")}

          </section>

          <button
            type="submit"
            class="submit-button"
          >
            테스트 응답 제출
          </button>

        <div class="notice">
  현재 테스트 단계입니다. 제출한 응답은 테스트 데이터로 데이터베이스에 저장됩니다.
</div>

        </form>

      `;

      document
        .getElementById("surveyForm")
        .addEventListener("submit", submitSurvey);
    }

    function makeScaleOptions(name) {

      const options = [
        [1, "전혀 그렇지 않다"],
        [2, "그렇지 않다"],
        [3, "보통이다"],
        [4, "그렇다"],
        [5, "매우 그렇다"]
      ];

      return options.map(option => `

        <label class="option">

          <input
            type="radio"
            name="${name}"
            value="${option[0]}"
            required
          >

          <span>
            ${option[0]}. ${option[1]}
          </span>

        </label>

      `).join("");
    }

    async function submitSurvey(event) {

  event.preventDefault();

  const form = event.target;
  const submitButton = form.querySelector(".submit-button");

  submitButton.disabled = true;
  submitButton.textContent = "저장 중...";

  const formData = new FormData(form);

  const submissionId = crypto.randomUUID();

  const answers = [
    {
      submission_id: submissionId,
      question_key: "q1",
      answer_value: Number(formData.get("q1"))
    },
    {
      submission_id: submissionId,
      question_key: "q2",
      answer_value: Number(formData.get("q2"))
    },
    {
      submission_id: submissionId,
      question_key: "q3",
      answer_value: Number(formData.get("q3"))
    }
  ];

  try {

    // 1. 설문 제출 1건 저장
    const { error: submissionError } = await supabaseClient
      .from("survey_submissions")
      .insert({
        id: submissionId,
        school_id: selectedSchool.school_id,
        survey_year: 2026,
        source: "web"
      });

    if (submissionError) {
      throw submissionError;
    }

    // 2. 문항별 답변 저장
    const { error: answersError } = await supabaseClient
      .from("survey_answers")
      .insert(answers);

    if (answersError) {
      throw answersError;
    }

    console.log("Supabase 저장 성공:", submissionId);

    showComplete();

  } catch (error) {

    console.error("설문 저장 오류:", error);

    alert(
      "응답 저장 중 오류가 발생했습니다.\n잠시 후 다시 시도해주세요."
    );

    submitButton.disabled = false;
    submitButton.textContent = "테스트 응답 제출";
  }
}

    function showComplete() {

      content.innerHTML = `

        <div class="complete">

          <h2>제출되었습니다</h2>

          <p>
            ${selectedSchool.school_name}의
            테스트 응답 흐름이 정상적으로 완료되었습니다.
          </p>

          <p>
  테스트 응답이 데이터베이스에 정상적으로 저장되었습니다.
          </p>

          <a
            class="button primary"
            href="result.html?school=${selectedSchool.school_id}"
          >
            학교 결과로 돌아가기
          </a>

          <a
            class="button secondary"
            href="search.html"
          >
            다른 학교 검색하기
          </a>

        </div>

      `;
    }

    function showError(message) {

      content.innerHTML = `

        <div class="error">

          ${message}

          <br><br>

          <a href="search.html">
            학교 검색으로 돌아가기
          </a>

        </div>

      `;
    }

    loadSurvey();

  </script>

</body>
</html>
