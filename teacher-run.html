function resize(){

 // Never turn that temporary measurement into the game's collision world.

 if(nextW<180||nextH<180)return;
 if(Math.abs(W-nextW)<1&&Math.abs(H-nextH)<1&&canvas.width>0&&canvas.height>0)return;
 const oldW=W,oldH=H;
 W=Math.max(220,nextW);H=nextH;
 dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(oldW>0){
  const sx=W/oldW;
  player.x*=sx;shackle.x*=sx;
  items.forEach(a=>a.x*=sx);
  chalkShots.forEach(b=>{b.x*=sx;if(Number.isFinite(b.missX))b.missX*=sx;});
  sideStudents.forEach(a=>{a.x*=sx;a.stopX*=sx;});
  paperBullets.forEach(a=>{a.x*=sx;a.vx*=sx;});
  mysteryDrops.forEach(a=>a.x*=sx);
  mysteryReveals.forEach(a=>a.x*=sx);
  sparks.forEach(a=>{a.x*=sx;a.vx*=sx;});
  floats.forEach(a=>a.x*=sx);
  if(paperTarget)paperTarget.x*=sx;
  if(pointerX!==null)pointerX*=sx;
 }
 if(oldH>0){
  const sy=H/oldH;

  chalkShots.forEach(a=>{a.y*=sy;if(Number.isFinite(a.missY))a.missY*=sy;});

function fireChalk(dt){
 // Each fixed shadow companion targets hazards independently, with a 50% hit roll.
 const config=chalkProfile();
 if(!config||state!=="playing")return;
 for(const helper of chalkHelpers){
  helper.cooldown=Math.max(0,helper.cooldown-dt);
  if(helper.cooldown>0||chalkShots.some(shot=>shot.role===helper.role))continue;
  const origin=helperPosition(helper);
  const target=items.filter(a=>!a.good&&a.y>32&&a.y<origin.y-35&&
   Math.hypot(a.x-origin.x,a.y-origin.y)<config.range&&
   !chalkShots.some(shot=>shot.target===a)
  ).sort((a,b)=>Math.hypot(a.x-origin.x,a.y-origin.y)-Math.hypot(b.x-origin.x,b.y-origin.y))[0];
  if(!target)continue;
  const willHit=isMysteryBuff("bullet")||Math.random()<.5;
  const missOffset=(Math.random()<.5?-1:1)*(target.r+65);
  chalkShots.push({
   role:helper.role,x:origin.x,y:origin.y-34,target,willHit,life:1.6,
   missX:Math.max(12,Math.min(W-12,target.x+missOffset)),
   missY:Math.max(30,target.y-45)
  });
  helper.cooldown=config.interval;
 }
}
function updateChalk(dt){
 for(let i=chalkShots.length-1;i>=0;i--){
  const shot=chalkShots[i],target=shot.target;
  shot.life-=dt;
  if(!items.includes(target)||shot.life<=0){chalkShots.splice(i,1);continue;}
  const destinationX=shot.willHit?target.x:shot.missX;
  const destinationY=shot.willHit?target.y:shot.missY;
  const dx=destinationX-shot.x,dy=destinationY-shot.y;
  const distance=Math.hypot(dx,dy),move=Math.min(distance,680*dt);
  if(distance>0){shot.x+=dx/distance*move;shot.y+=dy/distance*move;}
  if(shot.willHit&&Math.hypot(shot.x-target.x,shot.y-target.y)<=target.r+8){
   const index=items.indexOf(target);
   if(index>=0&&!target.good){
    items.splice(index,1);
    burst(target.x,target.y,"#e6fbff",10);
    float(target.x,target.y,shot.role+" 분필! +5","#fffbd2");
    addScore(5);playTone(760,.07,"triangle",.025);
   }
   chalkShots.splice(i,1);
  }else if(!shot.willHit&&distance<=Math.max(9,move)){
   chalkShots.splice(i,1); // Visible miss: no collision or points are awarded.
  }
 }
}

  case "shackle":mysteryBuffs.shackle=t+dur;mysteryBuffs.wings=0;player.y=H-52;break;
  case "complaint":mysteryBuffs.complaint=t+dur;mysteryBuffs.letter=0;break;
  case "bullying":score=Math.max(0,score-Math.ceil(score*.10));break;
  case "report":score=Math.max(0,score-Math.ceil(score*.25));break;
  case "conflict":mysteryBuffs.conflict=t+dur;mysteryBuffs.friends=0;chalkShots=[];break;
  case "wings":mysteryBuffs.wings=t+dur;mysteryBuffs.shackle=0;break;
  case "letter":mysteryBuffs.letter=t+dur;mysteryBuffs.complaint=0;break;
  case "salary":score+=1;break;
  case "friends":mysteryBuffs.friends=t+dur;mysteryBuffs.conflict=0;break;
  case "bonus":score+=2;break;
  case "chalk":mysteryBuffs.chalk=t+dur;break;

 }
 if(chalkHelpers.length!==(chalkProfile()?.maxShots||0))resetChalkHelpers();
 mysteryReveals.push({item,x,y,life:1.6});
