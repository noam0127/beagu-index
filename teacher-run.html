<style>
:root{color-scheme:dark;--ink:#f6fbff;--muted:#b9cce6;--line:#395472;--mint:#7be3ca}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#10223d;color:var(--ink)}
button{font:inherit;cursor:pointer}
.shell{max-width:820px;margin:auto;padding:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.brand{font-size:14px;font-weight:900;letter-spacing:-.5px}
.version{border:1px solid #587595;background:#233a57;border-radius:99px;padding:6px 10px;font-size:11px;color:#e6f6ff;font-weight:750}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:9px}
.stat{background:#203855;border:1px solid #456385;padding:10px;border-radius:13px;min-width:0}
.stat span{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.stat strong{display:block;margin-top:4px;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{border:1px solid #506e92;background:#15314f;border-radius:14px;overflow:hidden;position:relative;box-shadow:0 12px 35px rgba(0,0,0,.16)}
canvas{display:block;width:100%;height:420px;touch-action:none;outline:none;cursor:crosshair}
canvas:focus-visible{outline:3px solid #7be3ca;outline-offset:-3px}
.overlay{position:absolute;inset:0;background:rgba(9,26,48,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2;overflow:auto}
.overlay[hidden]{display:none}
.panel{width:min(100%,430px);border:1px solid #829dc1;background:linear-gradient(160deg,#243f64,#142944);border-radius:20px;padding:20px;box-shadow:0 16px 50px rgba(0,0,0,.36);text-align:center}
.panel .symbol{font-size:33px;margin:0 0 5px}
.panel h2{font-size:23px;letter-spacing:-.9px;margin:0 0 9px}
.panel p{font-size:13px;line-height:1.65;color:#dceaff;margin:0 0 13px;white-space:pre-line}
.choices{display:grid;grid-template-columns:1fr;gap:8px}
.choices button{background:#7be3ca;border:0;border-radius:11px;padding:12px 14px;color:#12334b;font-size:14px;font-weight:900;text-align:center;min-height:45px}
.choices button.secondary{background:#385778;color:#f0f9ff;border:1px solid #6988ab}
.choices button:focus-visible,.control button:focus-visible,.toolbar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:10px;touch-action:pan-y}
.control button{width:100%;min-height:58px;user-select:none;touch-action:none;-webkit-user-select:none;border:1px solid #728ba9;background:#2b496d;color:#fff;border-radius:12px;font-weight:900;font-size:17px}
.control button.dash{background:#ffcb66;color:#342a23;border-color:#ffd99a;font-size:14px}
.control button.down{transform:translateY(2px);filter:brightness(1.2)}
.toolbar{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.toolbar button{border:1px solid #5e789b;border-radius:9px;background:#274463;color:#f6fbff;padding:10px 12px;font-size:12px;font-weight:800}
.toolbar button:disabled{opacity:.55;cursor:not-allowed}
.toolbar .help{margin-left:auto}
.hint{font-size:12px;color:#c6d8ee;line-height:1.6;margin:10px 2px 0}
.original{color:#9ce6da;font-weight:750}
@media(max-width:480px){.shell{padding:8px}.stat{padding:8px}.stat strong{font-size:16px}.stat span{font-size:10px}canvas{height:405px}.panel{padding:15px}.panel h2{font-size:21px}.overlay{padding:9px}.control button{min-height:56px}.hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){.control button.down{transform:none}}

/* 2.1 — responsive arcade polish */
.shell{max-width:820px;padding:10px 12px 13px}
.top{margin-bottom:8px;gap:6px;min-width:0}
.brand{font-size:clamp(14px,3.8vw,18px);line-height:1.3;overflow-wrap:anywhere}
.version{font-size:10px;letter-spacing:.08em;flex:0 0 auto}
.hud{gap:6px;margin-bottom:8px}
.stat{padding:9px 10px;overflow:hidden;background:#203d59;border:1px solid #43678a;box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
.stat span{font-size:10px;line-height:1.25;white-space:normal}
.stat strong{font-size:clamp(13px,4vw,20px);font-weight:900;letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.stage{border-radius:16px;border:2px solid #547ca0;box-shadow:0 12px 32px rgba(0,0,0,.24)}
canvas{height:400px;cursor:default}
.overlay{align-items:center;padding:10px;background:rgba(12,32,53,.68);backdrop-filter:blur(5px)}
.panel{max-width:370px;max-height:100%;overflow:auto;overscroll-behavior:contain;padding:16px;border-radius:20px;background:linear-gradient(155deg,#294866,#142a43);border:1px solid #8fb1c8;box-shadow:0 18px 45px rgba(0,0,0,.38)}
.panel .symbol{font-size:37px}
.panel h2{font-size:clamp(19px,5.3vw,23px);line-height:1.35;overflow-wrap:anywhere;letter-spacing:-.045em}

.choices{gap:8px}
.choices button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;width:100%;min-height:48px;padding:10px 12px;border-radius:12px;font-weight:850;white-space:normal;overflow-wrap:anywhere;line-height:1.3}
.choices button small{display:block;color:#244f5c;font-weight:650;font-size:11px;line-height:1.3}
.choices button.secondary small{color:#c6dceb}
.control button{min-width:0;min-height:54px;border-radius:13px;background:linear-gradient(#365c80,#284669);border:1px solid #6d95b5;box-shadow:0 3px 0 #1a3555;font-size:clamp(15px,4.4vw,19px)}
.control button.dash{background:linear-gradient(#ffdc88,#efb957);border-color:#ffe3aa;box-shadow:0 3px 0 #a77b3d;font-size:clamp(12px,3.5vw,16px)}
.toolbar{justify-content:center;margin-top:9px}
.toolbar button,.toolbar a{display:inline-flex;justify-content:center;align-items:center;min-width:42px;min-height:40px;padding:8px 12px;border-radius:11px;border:1px solid #557996;background:#24435f;color:#e7f8fb;text-decoration:none;font-size:15px;font-weight:800}
.toolbar .help{margin-left:0}
.toolbar .original{margin-left:auto;font-size:11px;white-space:nowrap}
.hint{display:none}
@media(max-width:480px){.shell{padding:7px}.top{gap:5px}.version{padding:5px 8px;font-size:9px}.hud{gap:5px}.stat{padding:8px 7px}.stat span{font-size:10px}.stat strong{font-size:clamp(12px,3.7vw,17px)}canvas{height:370px}.panel{padding:12px}.panel .symbol{font-size:31px;margin:0}.panel p{font-size:11px;line-height:1.35;margin-bottom:9px}.choices{gap:6px}.choices button{padding:9px 8px;min-height:43px}.controls{gap:7px}.control button{min-height:54px}}
@media(max-width:310px){.version{display:none}.toolbar .original{font-size:10px}.stat strong{font-size:11px}}
</style>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const ranking=window.ArcadeLeaderboard ? new window.ArcadeLeaderboard("teacher_run","#arcade-top10") : null;
const schoolPicker=new window.ArcadeSchoolPicker("#arcade-school-picker");
const difficultyScale={easy:.72,normal:.86,hard:1,very_hard:1.17,extreme:1.36};
const difficultyName={easy:"EASY",normal:"NORMAL",hard:"HARD",very_hard:"VERY HARD",extreme:"EXTREME"};
schoolPicker.onChange=()=>{if(state==="ready")intro();};
if(!ctx){$("overlayDesc").textContent="이 브라우저에서는 캔버스 게임을 실행할 수 없습니다.";return;}
const days=["월요일","화요일","수요일","목요일","금요일"];
const dayTitles=["출근 첫날, 메일이 쌓인다","회의와 공문의 이중주","수요일의 언덕을 넘자","방심하면 야근이다","오늘만 버티면 주말!"];
const bad=[
 {emoji:"📄",name:"긴급 공문",damage:16,color:"#ffe2d4"},
 {emoji:"📞",name:"민원 전화",damage:20,color:"#f5d8ff"},
 {emoji:"📅",name:"추가 회의",damage:18,color:"#ffefd2"},
 {emoji:"🗂️",name:"행정 업무",damage:17,color:"#d5e4ff"},
 {emoji:"⏰",name:"갑작스런 야근",damage:24,color:"#ffc9c9"}
];
const good=[
 {emoji:"☕",name:"따뜻한 커피",heal:17,color:"#cfffee"},
 {emoji:"💌",name:"학생의 응원",heal:24,color:"#e0ffdb"},
 {emoji:"🤝",name:"동료의 도움",heal:21,color:"#d1f0ff"},
 {emoji:"🌿",name:"쉬는 시간",heal:15,color:"#ecffe0"}
];
const upgrades=[
 {title:"💪 퇴근 체력 +25",detail:"체력 최대치 증가 + 현재 체력 회복",id:"vital"},
 {title:"👟 가벼운 발걸음",detail:"이동 속도 18% 증가",id:"speed"},
 {title:"🛡️ 마음의 여유",detail:"충돌 후 무적 시간 0.4초 연장",id:"guard"},
 {title:"☕ 회복의 기술",detail:"회복 아이템 효과 +50%",id:"heal"},
 {title:"⚡ 재빠른 회피",detail:"회피 쿨타임 0.7초 단축",id:"dash"}
];
let W=600,H=420,dpr=1,state="ready",day=0,dayTime=0,clock=0,score=0,best=0,life=100,maxLife=100;
let items=[],sparks=[],floats=[],spawnClock=0,combo=0,nearCount=0,misses=0,skill={speed:1,guard:0,heal:1,dash:0};
let player={x:300,y:360,r:22,inv:0,dashTime:0,cool:0},pointerId=null,pointerX=null,pointerY=null,pressed=new Set();
let last=0,shake=0,notice="",noticeTime=0,soundOn=false,audio=null,difficulty=1;
try{best=Number(localStorage.getItem("teacherRunBestV2"))||0;soundOn=localStorage.getItem("teacherRunSoundV2")==="1";}catch(e){}
$("bestLabel").textContent=best.toLocaleString("ko-KR");
$("sound").textContent=soundOn?"🔊":"🔇";
$("sound").setAttribute("aria-pressed",String(soundOn));$("sound").setAttribute("aria-label",soundOn?"소리 끄기":"소리 켜기");
function persist(){try{localStorage.setItem("teacherRunBestV2",String(best));}catch(e){}}
function playTone(freq,duration=.1,type="sine",volume=.055){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;
  osc.type=type;osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(volume,t);
  gain.gain.exponentialRampToValueAtTime(.001,t+duration);
  osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+duration);
 }catch(e){}
}
function resize(){
 const oldW=W,oldH=H;W=Math.max(220,canvas.clientWidth);H=canvas.clientHeight;
 dpr=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(oldW>0){player.x=player.x/oldW*W;items.forEach(a=>a.x=a.x/oldW*W);}
 if(oldH>0&&pointerId!==null)player.y=player.y/oldH*H;
 player.x=Math.max(player.r,Math.min(W-player.r,player.x));
 player.y=pointerId===null?H-52:Math.max(76,Math.min(H-52,player.y));
}
if(typeof ResizeObserver!=="undefined"){new ResizeObserver(resize).observe(canvas);}else{window.addEventListener("resize",resize);}
function message(title,desc,choices,symbol="🎒"){
 $("overlayTitle").textContent=title;$("overlayDesc").textContent=desc;$("overlaySymbol").textContent=symbol;
 const root=$("choices");root.replaceChildren();
 choices.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.textContent=c.label;b.className=i?"secondary":"";if(c.detail){const small=document.createElement("small");small.textContent=c.detail;b.append(small);}b.addEventListener("click",c.action);root.append(b);});
 $("overlay").hidden=false;$("pause").disabled=true;
}
function closeMessage(){$("overlay").hidden=true;$("pause").disabled=false;canvas.focus({preventScroll:true});}
async function start(){
 const selected=schoolPicker.get();
 if(!selected?.eligible){intro();schoolPicker.focus();return;}
 if(state==="starting")return;
 state="starting";
 message("조사 자료 확인 중","2023~2026년 중 한 해 이상 백분위가 있는지 확인하고 있습니다.",[],"🏫");
 const session=ranking?await ranking.start(selected):null;
 if(!session){
  state="ready";intro();
  schoolPicker.status.textContent="게임 시작 불가 · 조사 자료를 다시 확인하거나 서버 연결 상태를 확인하세요.";
  return;
 }
 difficulty=difficultyScale[selected.difficulty]||1;
 schoolPicker.setLocked(true);
 state="playing";day=0;dayTime=0;clock=0;score=0;life=100;maxLife=100;
 combo=0;nearCount=0;misses=0;skill={speed:1,guard:0,heal:1,dash:0};
 items=[];sparks=[];floats=[];spawnClock=.5;player.x=W/2;player.y=H-52;player.inv=1.5;player.cool=0;player.dashTime=0;pointerId=null;pointerY=null;
 pressed.clear();pointerX=null;pointerY=null;updateLabels();setNotice("월요일 시작!",2);closeMessage();playTone(500,.13);
}
function intro(){
 state="ready";schoolPicker.setLocked(false);
 const selected=schoolPicker.get();
 const ready=selected?.eligible===true;
 const available=Array.isArray(selected?.available_years)?selected.available_years.join("·")+"년":"확인 연도";
 const title=ready?selected.school_name+" · "+difficultyName[selected.difficulty]:
   selected?selected.school_name+" · 플레이 불가":"먼저 학교를 선택하세요";
 const desc=ready?"확인된 "+available+" 배구지수 백분위 평균으로 난이도를 결정합니다.\n월 → 금 생존!":
   selected?"2023~2026년 조사 백분위가 한 해도 확인되지 않았습니다.\n2026년 배구지수 조사에 참여해 주세요. 조사 반영 후 플레이 가능합니다.":
   "2023~2026년 중 한 해라도 조사 백분위가 있는 학교는 플레이할 수 있습니다.\n위에서 학교를 검색해 선택해 주세요.";
 message("험난한 교직생활",title+"\n"+desc,[
  {label:ready?"▶ 이 학교로 시작":selected?"🏫 다른 학교 검색":"🏫 학교 선택하기",
   action:()=>ready?start():schoolPicker.focus()}
 ],"🏫");
}

function updateLabels(){$("dayLabel").textContent=days[day]+" · "+(day+1)+"/5";$("scoreLabel").textContent=Math.floor(score).toLocaleString("ko-KR");}
function setNotice(t,time=1.8){notice=t;noticeTime=time;}
function burst(x,y,color,n=9){
 for(let i=0;i<n;i++){let a=Math.PI*2*i/n+(Math.random()-.5)*.8,v=50+Math.random()*140;
 sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.4,color,r:2+Math.random()*3});}
}
function float(x,y,text,color="#fff"){floats.push({x,y,text,color,life:1});}
function addScore(n){score+=Math.round(n*(1+Math.min(combo,20)*.04));updateLabels();}
function activateDash(){
 if(state!=="playing"||player.cool>0)return;
 player.cool=Math.max(1.8,4-skill.dash);player.dashTime=.36;player.inv=Math.max(player.inv,.52);
 burst(player.x,player.y,"#ffdf84",12);float(player.x,player.y-46,"⚡ 회피!","#f4ffb5");playTone(710,.11,"square",.03);
}
function hit(a){
 if(a.good){
  let amount=Math.round(a.heal*skill.heal),before=life;life=Math.min(maxLife,life+amount);
  combo=Math.min(25,combo+1);addScore(75);float(a.x,a.y,"+"+(life-before)+" 체력","#1e945b");burst(a.x,a.y,"#7be3ca",12);playTone(760,.1);return;
 }
 if(player.inv>0||player.dashTime>0){combo=Math.min(25,combo+1);addScore(55);float(a.x,a.y,"PERFECT +55","#fcdd87");burst(a.x,a.y,"#ffe7a0",8);return;}
 let amount=Math.round(a.damage*difficulty);
 life=Math.max(0,life-amount);combo=0;player.inv=1.25+skill.guard;shake=.2;misses++;
 float(a.x,a.y,"-"+amount,"#b32738");burst(a.x,a.y,"#ff9d88",15);playTone(190,.24,"sawtooth",.04);
 if(navigator.vibrate)navigator.vibrate(70);
 if(life<=0)finish(false);
}
function spawn(){
 const isGood=Math.random()<(dayTime>12?.22:.16),source=isGood?good:bad;
 let a=source[Math.floor(Math.random()*source.length)];
 const x=30+Math.random()*Math.max(1,W-60);
 let speed=(88+day*18+Math.random()*56)*difficulty;
 if(day===4&&dayTime>13)speed*=1.3;
 items.push({x,y:-40,speed,r:20+Math.random()*3,wobble:Math.random()*7,phase:Math.random()*6.28,good:isGood,...a});
}
function nextDay(){
 if(day===4){finish(true);return;}
 state="between";pressed.clear();pointerId=null;pointerX=null;pointerY=null;playTone(900,.3);
 let picks=upgrades.filter(u=>!(u.id==="dash"&&skill.dash>=1.4));
 picks.sort(()=>Math.random()-.5);picks=picks.slice(0,3);
 message(days[day]+" 퇴근!","능력 선택",picks.map(u=>({label:u.title,detail:u.detail,action:()=>choose(u)})),"🌙");
}
function choose(u){
 if(u.id==="vital"){maxLife+=25;life=Math.min(maxLife,life+35);}
 if(u.id==="speed")skill.speed*=1.18;
 if(u.id==="guard")skill.guard+=.4;
 if(u.id==="heal")skill.heal*=1.5;
 if(u.id==="dash")skill.dash+=.7;
 day++;dayTime=0;items=[];spawnClock=.65;life=Math.min(maxLife,life+10);
 player.inv=1.2;pointerId=null;pointerX=null;pointerY=null;state="playing";updateLabels();setNotice(days[day]+" 시작!",2);closeMessage();playTone(610,.16);
}
function finish(win){
 state="over";pressed.clear();pointerId=null;pointerX=null;pointerY=null;
 schoolPicker.setLocked(false);
 let bonus=win?1500+Math.round(life*5):0;score+=bonus;
 if(score>best){best=Math.floor(score);persist();}
 updateLabels();$("bestLabel").textContent=best.toLocaleString("ko-KR");
 ranking?.finish(Math.floor(score),{score:Math.floor(score),day:day+1,victory:win});
 const grade=win?(life>70?"S":"A"):(day>=3?"B":"C");
 const text=(win?"금요일 퇴근 성공! 🎉":"오늘은 여기까지! 체력 회복이 필요해요.")+"\n"+
 "최종 점수 "+Math.floor(score).toLocaleString("ko-KR")+"점 · "+grade+"등급\n"+
 "아슬아슬 회피 "+nearCount+"회 · 충돌 "+misses+"회\n"+
 (win?"주말은 선생님 편입니다.":"괜찮아요. 다음 주는 더 잘 피할 수 있어요!");
 message(win?"🎊 주말을 지켜냈어요!":"🫖 잠깐 쉬어가요",text,[
 {label:"🔄 같은 학교로 다시 하기",action:()=>start()},
 {label:"🏫 학교 변경",action:intro}],win?"🎉":"🫖");
 playTone(win?950:280,.32);
}
function pause(){
 if(state==="playing"){state="paused";pressed.clear();pointerId=null;pointerX=null;pointerY=null;message("일시정지","",[{label:"▶ 계속",action:resume},{label:"↩ 처음으로",action:intro}],"⏸");}
 else if(state==="paused")resume();
}
function resume(){state="playing";closeMessage();}
function help(){
 const wasPlaying=state==="playing";
 if(wasPlaying){state="paused";pressed.clear();pointerId=null;pointerX=null;pointerY=null;}
 message("게임 방법","📄 공문 · 📞 전화 · 📅 회의 등 장애물을 피하세요.\n☕ 커피 · 💌 응원 · 🤝 동료 아이템을 받으면 체력이 회복됩니다.\n스치듯 피하면 콤보 점수! ⚡ 긴급 회피 중에는 무적입니다.\n\nPC: ← → / A D, 스페이스\n모바일: 터치·드래그로 비행, 버튼으로 좌우 이동",[
 {label:wasPlaying?"▶ 게임으로 돌아가기":"확인",action:()=>{if(wasPlaying)resume();else intro();}}],"❔");
}
function update(dt){
 clock+=dt;dayTime+=dt;score+=dt*9;player.inv=Math.max(0,player.inv-dt);
 player.cool=Math.max(0,player.cool-dt);player.dashTime=Math.max(0,player.dashTime-dt);
 shake=Math.max(0,shake-dt);noticeTime=Math.max(0,noticeTime-dt);
 const dir=(pressed.has("right")?1:0)-(pressed.has("left")?1:0);
 const speed=285*skill.speed*(player.dashTime>0?2.1:1);
 if(pointerId!==null&&pointerX!==null&&pointerY!==null){
  // Finger/mouse targets both axes while actively touching the canvas.
  const flyingSpeed=1300*skill.speed*(player.dashTime>0?1.5:1);
  const dx=pointerX-player.x,dy=pointerY-player.y;
  player.x+=Math.sign(dx)*Math.min(Math.abs(dx),flyingSpeed*dt);
  player.y+=Math.sign(dy)*Math.min(Math.abs(dy),flyingSpeed*dt);
 }else{
  player.x+=dir*speed*dt;
  // Landing: release restores altitude smoothly.
  player.y=Math.min(H-52,player.y+520*dt);
 }
 player.x=Math.max(27,Math.min(W-27,player.x));
 player.y=Math.max(76,Math.min(H-52,player.y));
 spawnClock-=dt;
 if(spawnClock<=0){spawn();spawnClock=Math.max(.3,(.86-day*.085-(dayTime>13&&day===4?.2:0))/difficulty)*(0.8+Math.random()*.45);}
 for(let i=items.length-1;i>=0;i--){
  const a=items[i];a.y+=a.speed*dt;a.x+=Math.sin(clock*2+a.phase)*a.wobble*dt;
  if(Math.hypot(a.x-player.x,a.y-player.y)<a.r+player.r*.78){
   items.splice(i,1);hit(a);if(state!=="playing")return;continue;
  }
  if(a.y>H+35){
   items.splice(i,1);
   if(!a.good&&Math.abs(a.x-player.x)<83){nearCount++;combo=Math.min(25,combo+1);addScore(35);float(player.x,player.y-52,"아슬아슬! +35","#fff1b1");}
  }
 }
 for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=125*dt;s.life-=dt;if(s.life<=0)sparks.splice(i,1);}
 for(let i=floats.length-1;i>=0;i--){let f=floats[i];f.y-=42*dt;f.life-=dt;if(f.life<=0)floats.splice(i,1);}
 if(dayTime>=23.5)nextDay();
 updateLabels();
}
function roundRect(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function background(){
 const palettes=[
  ["#81d0e9","#c0e7ec","#287a8b"],
  ["#8ab6f2","#d7ebff","#3b73ac"],
  ["#f8b974","#ffdeb2","#ae5c59"],
  ["#ba9be0","#d4bfe6","#70549d"],
  ["#879df2","#ffbbbc","#54498e"]
 ];
 const p=palettes[day],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,p[0]);g.addColorStop(1,p[1]);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Dithered 8-bit background: small window pixels + scrolling sparkle blocks
 for(let yy=10;yy<H-70;yy+=24){for(let xx=10;xx<W;xx+=24){
  if(((xx/24+yy/24+day)%4)<1){ctx.fillStyle="rgba(10,49,91,.06)";ctx.fillRect(xx,yy,11,11);}
 }}
 for(let k=0;k<7;k++){const xx=(k*99+clock*12)%(W+26)-13,yy=75+(k*33)%170;ctx.fillStyle="rgba(255,255,255,.3)";ctx.fillRect(xx,yy,6,6);}
 // 바닥과 교실, 화면 폭에 반응하는 칠판과 창문
 const chalkW=Math.min(185,Math.max(80,W*.43)),chalkX=12,windowW=Math.min(112,Math.max(68,W*.28)),windowX=W-12-windowW;
 ctx.fillStyle="rgba(255,255,255,.3)";ctx.beginPath();ctx.arc(W*.74,58,64,0,Math.PI*2);ctx.fill();
 roundRect(0,H-70,W,70,0,"#d0e8d2");
 ctx.fillStyle="rgba(73,122,116,.12)";for(let x=0;x<W;x+=49)ctx.fillRect(x,H-69,1,69);
 roundRect(chalkX+2,97,chalkW,98,9,"#d3aa76");roundRect(chalkX+8,103,chalkW-12,86,6,p[2]);
 ctx.fillStyle="rgba(250,255,247,.95)";ctx.font="bold 13px sans-serif";ctx.textAlign="center";
 ctx.fillText("오늘도 무사히!",chalkX+chalkW/2+2,139,chalkW-20);
 ctx.fillStyle="#d9fff0";ctx.font="12px sans-serif";ctx.fillText(days[day],chalkX+chalkW/2+2,162,chalkW-20);
 roundRect(windowX,98,windowW,96,9,"#f5fcff");roundRect(windowX+6,104,windowW-12,84,4,"#84d3f2");
 ctx.fillStyle="#f9fcff";ctx.fillRect(windowX+windowW/2-3,103,6,85);ctx.fillRect(windowX+6,143,windowW-12,6);
 ctx.fillStyle="rgba(255,255,255,.55)";ctx.beginPath();ctx.ellipse(windowX+windowW*.25,118,18,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="rgba(38,85,102,.15)";ctx.fillRect(0,H-40,W,4);
 for(let x=15;x<W;x+=117){roundRect(x,H-49,72,12,5,"#a97b61");roundRect(x+6,H-38,7,20,3,"#94694f");}
}
function playerDraw(){
 ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y));
 if(pointerId!==null&&state==="playing"){
  const blink=Math.floor(clock*18)%2;
  ctx.fillStyle="#ffe078";ctx.fillRect(-16,31,11,blink?15:23);ctx.fillRect(6,31,11,blink?23:15);
  ctx.fillStyle="#fa8f69";ctx.fillRect(-11,50,7,blink?10:6);ctx.fillRect(10,50,7,blink?6:10);
 }
 if(player.inv>0&&Math.floor(clock*12)%2===0)ctx.globalAlpha=.45;
 if(player.dashTime>0){
  ctx.fillStyle="rgba(255,236,119,.22)";ctx.fillRect(-39,-50,78,80);
  ctx.strokeStyle="#ffe873";ctx.lineWidth=3;ctx.strokeRect(-39,-50,78,80);
 }
 // 16-bit style sprite made of solid square pixels
 const px=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
 px(-24,27,17,8,"#0b213f");px(7,27,17,8,"#0b213f");
 px(-25,23,20,8,"#ffffff");px(5,23,20,8,"#ffffff");
 px(-22,4,14,22,"#253b6f");px(8,4,14,22,"#253b6f");
 px(-27,-9,54,34,"#10263f");px(-24,-6,48,28,"#4a84c9");
 px(-24,-3,7,20,"#244d96");px(17,-3,7,20,"#244d96");
 px(-14,6,28,7,"#d5f4ff");px(-10,13,20,6,"#ffe381");
 px(-26,-36,52,27,"#183a4a");
 px(-19,-39,38,32,"#f5c69d");
 px(-18,-44,36,12,"#1a2e54");px(-21,-40,9,15,"#1a2e54");px(13,-41,8,15,"#1a2e54");
 px(-12,-24,5,5,"#11263f");px(7,-24,5,5,"#11263f");
 px(-3,-14,6,3,"#b97165");
 px(-23,-2,6,15,"#f5c69d");px(17,-2,6,15,"#f5c69d");
 // small badge
 px(-9,0,18,4,"#ecf7fa");px(-5,4,10,4,"#ffd974");
 ctx.restore();
}
function drawItems(){
 for(const a of items){
  ctx.save();ctx.translate(a.x,a.y);
  ctx.shadowColor="rgba(22,54,70,.25)";ctx.shadowBlur=12;ctx.shadowOffsetY=4;
  const shade=a.good?"#e1fff1":"#ffe9e1",edge=a.good?"#27a781":"#df7672";
  ctx.fillStyle="#17294c";ctx.fillRect(-27,-27,54,54);ctx.fillStyle=shade;ctx.fillRect(-24,-24,48,48);
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.strokeStyle=edge;ctx.lineWidth=3;ctx.strokeRect(-24,-24,48,48);
  ctx.fillStyle=edge;ctx.beginPath();ctx.arc(18,-18,5,0,Math.PI*2);ctx.fill();
  ctx.textAlign="center";ctx.font="27px sans-serif";ctx.fillText(a.emoji,0,10,37);
  ctx.restore();
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*4);
 background();drawItems();playerDraw();
 for(const q of sparks){ctx.globalAlpha=Math.min(1,q.life/.35);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
 for(const f of floats){
  const x=Math.max(65,Math.min(W-65,f.x));
  ctx.globalAlpha=Math.min(1,f.life*1.7);ctx.font="bold 13px sans-serif";ctx.textAlign="center";
  ctx.fillStyle=f.color;ctx.strokeStyle="rgba(15,35,50,.55)";ctx.lineWidth=3;
  ctx.strokeText(f.text,x,f.y,Math.max(90,W-12));ctx.fillText(f.text,x,f.y,Math.max(90,W-12));
 }ctx.globalAlpha=1;
 const healthW=Math.min(156,Math.max(104,W*.48)),timeW=Math.min(95,Math.max(68,W*.26));
 roundRect(9,10,healthW,49,12,"rgba(18,44,61,.9)");
 roundRect(W-timeW-9,10,timeW,49,12,"rgba(18,44,61,.9)");
 ctx.fillStyle="#fff";ctx.textAlign="left";ctx.font="bold 12px sans-serif";
 ctx.fillText("♥ "+Math.round(life)+"/"+maxLife,18,29,healthW-14);
 const barW=healthW-18;
 roundRect(18,39,barW,8,4,"#53747c");
 if(life>0)roundRect(18,39,barW*Math.min(1,life/maxLife),8,4,life<35?"#ff8c82":"#77e2b4");
 ctx.textAlign="center";ctx.font="900 18px sans-serif";ctx.fillStyle="#f8fafb";
 ctx.fillText(Math.max(0,Math.ceil(23.5-dayTime))+"s",W-timeW/2-9,33,timeW-12);
 ctx.font="bold 9px sans-serif";ctx.fillStyle="#b9ecdd";ctx.fillText("퇴근",W-timeW/2-9,48,timeW-12);
 if(combo>=3){
  ctx.textAlign="center";roundRect(W/2-53,64,106,24,11,"rgba(108,55,32,.9)");
  ctx.font="900 12px sans-serif";ctx.fillStyle="#fff3c9";ctx.fillText("🔥 "+combo+" COMBO",W/2,80,101);
 }
 if(player.cool>0){roundRect(W/2-53,H-23,106,16,7,"rgba(19,47,71,.88)");ctx.textAlign="center";ctx.font="bold 10px sans-serif";ctx.fillStyle="#fff";ctx.fillText("⚡ "+player.cool.toFixed(1)+"s",W/2,H-11);}
 roundRect(12,H-7,W-24,3,2,"rgba(24,62,83,.15)");
 if(dayTime>0)roundRect(12,H-7,(W-24)*Math.min(1,dayTime/23.5),3,2,"#2b9c8b");
 if(noticeTime>0){ctx.textAlign="center";roundRect(W/2-68,93,136,27,9,"rgba(17,54,70,.88)");ctx.font="bold 13px sans-serif";ctx.fillStyle="#fff";ctx.fillText(notice,W/2,111,126);}
 if(day===4&&dayTime>13){ctx.textAlign="center";ctx.font="900 12px sans-serif";ctx.fillStyle="#8e3030";ctx.fillText("⚠ 공문 폭풍",W/2,131,Math.max(120,W-20));}
 ctx.restore();
}
function tick(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(state==="playing")update(dt);draw();requestAnimationFrame(tick);}
window.addEventListener("keydown",e=>{
 const key=e.key.toLowerCase();
 if(["arrowleft","arrowright"," ","a","d"].includes(key)&&(state==="playing"||state==="paused"))e.preventDefault();
 if(key==="arrowleft"||key==="a")pressed.add("left");
 if(key==="arrowright"||key==="d")pressed.add("right");
 if(key===" "&&!e.repeat)activateDash();
 if(key==="escape"&&(state==="playing"||state==="paused"))pause();
});
window.addEventListener("keyup",e=>{let key=e.key.toLowerCase();if(key==="arrowleft"||key==="a")pressed.delete("left");if(key==="arrowright"||key==="d")pressed.delete("right");});
window.addEventListener("blur",()=>{pressed.clear();pointerId=null;pointerX=null;pointerY=null;if(state==="playing")pause();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="playing")pause();});
for(let dir of ["left","right"]){
 const el=$(dir);
 el.addEventListener("pointerdown",e=>{e.preventDefault();el.setPointerCapture(e.pointerId);pressed.add(dir);pointerId=null;pointerX=null;pointerY=null;el.classList.add("down");});
 const off=()=>{pressed.delete(dir);el.classList.remove("down");};
 el.addEventListener("pointerup",off);el.addEventListener("pointercancel",off);el.addEventListener("lostpointercapture",off);
}
$("dash").addEventListener("pointerdown",e=>{e.preventDefault();activateDash();$("dash").classList.add("down");});
["pointerup","pointercancel","pointerleave"].forEach(k=>$("dash").addEventListener(k,()=>$("dash").classList.remove("down")));
function dragPosition(e){
 const r=canvas.getBoundingClientRect();
 if(!r.width||!r.height)return null;
 return {
  x:Math.max(27,Math.min(W-27,(e.clientX-r.left)/r.width*W)),
  y:Math.max(76,Math.min(H-52,(e.clientY-r.top)/r.height*H))
 };
}
function setFlightTarget(e){
 const target=dragPosition(e);if(!target)return;
 pointerX=target.x;pointerY=target.y;
}
canvas.addEventListener("pointerdown",e=>{
 if(state!=="playing"||pointerId!==null)return;
 e.preventDefault();pointerId=e.pointerId;
 if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);
 setFlightTarget(e);
});
canvas.addEventListener("pointermove",e=>{
 if(pointerId===e.pointerId&&state==="playing"){e.preventDefault();setFlightTarget(e);}
});
const endDrag=e=>{if(pointerId===e.pointerId){pointerId=null;pointerX=null;pointerY=null;}};
canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("lostpointercapture",endDrag);
$("pause").addEventListener("click",pause);
$("how").addEventListener("click",help);
$("sound").addEventListener("click",()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊":"🔇";$("sound").setAttribute("aria-pressed",String(soundOn));$("sound").setAttribute("aria-label",soundOn?"소리 끄기":"소리 켜기");try{localStorage.setItem("teacherRunSoundV2",soundOn?"1":"0");}catch(e){}playTone(800,.12);});
function postHeight(){
 try{window.parent.postMessage({type:"teacher-run:resize",height:document.documentElement.scrollHeight},window.location.origin);}catch(e){}
}
if(typeof ResizeObserver!=="undefined")new ResizeObserver(postHeight).observe(document.body);
window.addEventListener("resize",postHeight);
resize();intro();requestAnimationFrame(tick);postHeight();
})();
</script>
