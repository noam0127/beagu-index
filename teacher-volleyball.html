<script>
(function () {
  "use strict";
  const canvas = document.getElementById("game");

  const scoreP = document.getElementById("player-score");
  const scoreC = document.getElementById("cpu-score");
  const startButton = document.getElementById("start");
  const pauseButton = document.getElementById("pause");
  const status = document.getElementById("status");
  const helpButton=document.getElementById("help"),helpPanel=document.getElementById("help-panel");
  const ranking=window.ArcadeLeaderboard ? new window.ArcadeLeaderboard("volleyball_25","#arcade-top10") : null;
  const schoolPicker=new window.ArcadeSchoolPicker("#arcade-school-picker");
  const battleProfiles={
    easy:{allySpeed:1.38,allyJump:1.20,allyReach:1.22,allyAttack:1.24,enemySpeed:4.7,enemyReaction:17,enemyLead:1,enemyError:82,enemyDeadzone:25,enemyJumpChance:.10,enemyJumpReach:105,enemyJumpForce:10.5,enemyReach:.82,enemyAttack:.68,enemySmashChance:.02,label:"아군 강화 · 상대 점프 드묾"},
    normal:{allySpeed:1.20,allyJump:1.10,allyReach:1.12,allyAttack:1.12,enemySpeed:6.0,enemyReaction:12,enemyLead:3,enemyError:58,enemyDeadzone:17,enemyJumpChance:.27,enemyJumpReach:125,enemyJumpForce:11.5,enemyReach:.91,enemyAttack:.83,enemySmashChance:.08,label:"아군 우세 · 상대 수비 보통"},
    hard:{allySpeed:1,allyJump:1,allyReach:1,allyAttack:1,enemySpeed:7.5,enemyReaction:8,enemyLead:5,enemyError:35,enemyDeadzone:11,enemyJumpChance:.49,enemyJumpReach:148,enemyJumpForce:12.8,enemyReach:1,enemyAttack:1,enemySmashChance:.19,label:"양 팀 균형 · 상대 점프 수비"},
    very_hard:{allySpeed:.89,allyJump:.91,allyReach:.94,allyAttack:.91,enemySpeed:9.2,enemyReaction:5,enemyLead:7,enemyError:18,enemyDeadzone:7,enemyJumpChance:.72,enemyJumpReach:172,enemyJumpForce:13.7,enemyReach:1.10,enemyAttack:1.23,enemySmashChance:.38,label:"아군 약화 · 상대 예측 점프·강타"},
    extreme:{allySpeed:.79,allyJump:.83,allyReach:.86,allyAttack:.83,enemySpeed:11,enemyReaction:2,enemyLead:9,enemyError:5,enemyDeadzone:3,enemyJumpChance:.96,enemyJumpReach:195,enemyJumpForce:14.8,enemyReach:1.20,enemyAttack:1.48,enemySmashChance:.63,label:"아군 약화 · 상대 초고속 수비·강타"}
   };
  // Stronger opponents get distinctive pixel armor, helmets and a boss aura.
  const enemyLooks={
    easy:{uniform:"#f0a3b6",trim:"#df8199",eyes:"#304663",armor:0,aura:0},
    normal:{uniform:"#ec7b97",trim:"#d35e7c",eyes:"#344b64",armor:0,aura:0},
    hard:{uniform:"#d45472",trim:"#80344c",eyes:"#ab2838",armor:1,aura:0},
    very_hard:{uniform:"#983355",trim:"#f0b4ad",eyes:"#f6df87",armor:2,aura:1},
    extreme:{uniform:"#622451",trim:"#ffd168",eyes:"#ffdb60",armor:3,aura:2}
  };
  // Ball speed scales with school difficulty, independent of player and CPU movement.
  const ballSpeedProfiles={easy:.80,normal:.91,hard:1,very_hard:1.13,extreme:1.27};
  const ballSpeedFactor=()=>ballSpeedProfiles[currentDifficulty]||ballSpeedProfiles.hard;
  const cloneProfiles={easy:2,normal:1,hard:0,very_hard:0,extreme:0};
  const specialProfiles={
    easy:{cooldown:12,chargeFrames:540},
    normal:{cooldown:16,chargeFrames:480},
    hard:{cooldown:20,chargeFrames:450},
    very_hard:{cooldown:24,chargeFrames:420},
    extreme:{cooldown:28,chargeFrames:390}
  };
  const diffName={easy:"EASY",normal:"NORMAL",hard:"HARD",very_hard:"VERY HARD",extreme:"EXTREME"};
  let currentDifficulty="normal",battle=battleProfiles.normal,specialProfile=specialProfiles.hard,startTicket=0,lastTapAt=0,lastTapX=0,lastTapY=0;
  schoolPicker.onChange=school=>{
    if(state.phase==="ready"||state.phase==="finished"){
      setStatus(!school ? "" :
        school.eligible ? school.school_name+" · "+diffName[school.difficulty] :
        "🔒 조사 참여 필요");
      if(state.phase==="ready"){
        const tier=school?.difficulty||"hard";
        currentDifficulty=tier;
        specialProfile=specialProfiles[tier]||specialProfiles.hard;
        resetPower();
      }
      syncUI();
    }
  };
  const SPEED_MULTIPLIER=2; // horizontal player and AI reaction (5->10, 3.65->7.3)
  const AUTO_SPIKE_SPEED=8; // player-driven displacement per simulation frame
  const MATCH_TARGET=25;
  const formatTime=tenths=>{
    const t=Math.max(0,Math.floor(Number(tenths)||0));
    return Math.floor(t/600)+":"+String(Math.floor(t%600/10)).padStart(2,"0")+"."+(t%10);
  };
  const getElapsedTenths=()=>{
    if(!state.startedAt)return 0;
    const end=state.phase==="finished"?state.finishedAt:
      state.phase==="paused"?state.pausedAt:performance.now();
    return Math.max(0,Math.round((end-state.startedAt-state.pausedMs)/100));
  };
  const W = 900, H = 500, FLOOR = 451, NET_X = 450, NET_TOP = 342, NET_W = 14, R = 48; // ball 1.5x; net height ~2/3
  const keys = { left: false, right: false, jump: false };
  const touchControl = { pointerId: null, targetX: null, targetY: null };
  const state = { phase:"ready",leftScore:0,rightScore:0,serveLeft:true,pointTicks:0,flash:0,winner:"",
    message:"경기 시작을 눌러주세요!",spikes:0,aiRecalc:0,aiTargetX:688,aiJump:false,
    specialCooldownFrames:0,specialChargeFrames:0,uiTick:0,playFrames:0,
    startedAt:0,pausedAt:0,pausedMs:0,finishedAt:0,
    hitStopFrames:0,impactFrames:0,impactX:0,impactY:0,bossWarnFrames:0,bossCooldownFrames:0 };
  const left = { x: 210, y: FLOOR - 31, vy: 0, vx: 0, impactSpeed: 0, side: "left", jumpLock: false, contactFrames:0 };
  const right = { x: 690, y: FLOOR - 31, vy: 0, vx: 0, side: "right", jumpLock: false, contactFrames:0 };
  const ball = { x: 228, y: 218, vx: 0, vy: 0, spin:0, cooldown: 0, trail: [], shadowFrames:0, shadowColor:"#203f65" };
  const secondBall={x:685,y:168,vx:-6,vy:-5,spin:0,cooldown:0,trail:[],shadowFrames:0,shadowColor:"#762b4b"};
  const activeBalls=[ball],clones=[];
  const volleyShackle={x:156,dir:-1};
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const setStatus = text => { status.textContent = text; };
  const FASTEST_KEY="teacherVolleyballFastest25V1";
  const bestLabel=document.getElementById("volley-best-label");
  let fastestTenths=0;
  try{fastestTenths=Math.max(0,Math.floor(Number(localStorage.getItem(FASTEST_KEY))||0));}catch(e){}
  bestLabel.textContent=fastestTenths?formatTime(fastestTenths):"—";
  function rememberFastest(tenths){
    if(!Number.isSafeInteger(tenths)||tenths<=0||(fastestTenths&&tenths>=fastestTenths))return;
    fastestTenths=tenths;
    bestLabel.textContent=formatTime(tenths);
    try{localStorage.setItem(FASTEST_KEY,String(tenths));}catch(e){}
  }
  const canPlayerJump=()=>currentDifficulty!=="extreme";
  const soundButton=document.getElementById("sound");
  const SOUND_KEY="teacherVolleyballSoundV1";
  let soundOn=true,audioContext=null;
  try{const setting=localStorage.getItem(SOUND_KEY);if(setting!==null)soundOn=setting==="1";}catch(e){}
  function syncSoundUI(){
    soundButton.textContent=soundOn?"🔊":"🔇";
    soundButton.setAttribute("aria-pressed",String(soundOn));
    soundButton.setAttribute("aria-label",soundOn?"소리 끄기":"소리 켜기");
  }
  syncSoundUI();
  function unlockSound(){
    if(!soundOn)return;
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)return;
      audioContext=audioContext||new Ctx();
      if(audioContext.state==="suspended")audioContext.resume();
    }catch(e){}
  }
  function tone(freq,duration=.11,type="sine",volume=.055,delay=0,toFreq=null){
    if(!soundOn)return;
    try{
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)return;
      audioContext=audioContext||new Ctx();
      if(audioContext.state==="suspended")audioContext.resume();
      const start=audioContext.currentTime+delay;
      const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
      oscillator.type=type;oscillator.frequency.setValueAtTime(freq,start);
      if(toFreq&&toFreq>0)oscillator.frequency.exponentialRampToValueAtTime(toFreq,start+duration);
      gain.gain.setValueAtTime(Math.max(.0001,volume),start);
      gain.gain.exponentialRampToValueAtTime(.001,start+duration);
      oscillator.connect(gain);gain.connect(audioContext.destination);
      oscillator.start(start);oscillator.stop(start+duration+.01);
    }catch(e){}
  }
  function spikeSound(superSpike=false){
    tone(superSpike?470:310,superSpike?.22:.14,"sawtooth",superSpike?.063:.038,0,superSpike?105:145);
    tone(superSpike?730:490,.12,"triangle",.038,.035,superSpike?1100:720);
  }
  soundButton.addEventListener("click",()=>{
    soundOn=!soundOn;
    try{localStorage.setItem(SOUND_KEY,soundOn?"1":"0");}catch(e){}
    syncSoundUI();if(soundOn)tone(660,.09,"sine",.055);
  });
  function resetPower(){
    state.specialCooldownFrames=0;state.specialChargeFrames=0;
    state.uiTick=0;lastTapAt=0;
    updateClockUI();
  }
  function updateClockUI(){
    document.getElementById("volley-time-label").textContent="⏱ "+formatTime(getElapsedTenths());
  }
  function activateSuperSpike(){
    if(state.phase!=="playing"||state.specialCooldownFrames>0||state.specialChargeFrames>0)return false;
    state.specialCooldownFrames=specialProfile.cooldown*60;
    state.specialChargeFrames=specialProfile.chargeFrames;
    state.flash=18;
    setStatus("⚡ 슈퍼 스파이크 준비!");
    return true;
  }
  function syncUI() {
    scoreP.textContent = state.leftScore+" / "+MATCH_TARGET;
    scoreC.textContent = state.rightScore+" / "+MATCH_TARGET;
    startButton.textContent = state.phase === "starting" ? "⏳ 학교 확인 중" : state.phase === "finished" ? "↻ 다시 하기" : state.phase === "ready" ? "▶ 시작" : "↻ 다시 시작";
    startButton.disabled = state.phase === "starting" ||
      ((state.phase === "ready" || state.phase === "finished") && schoolPicker.get()?.eligible !== true);
    pauseButton.disabled = state.phase === "ready" || state.phase === "finished" || state.phase === "point" || state.phase === "starting";
    pauseButton.textContent = state.phase === "paused" ? "▶" : "⏸";
    pauseButton.setAttribute("aria-label",state.phase === "paused"?"계속하기":"일시정지");
    updateClockUI();
  }
  function resetPositions() {
    Object.assign(left, { x: 210, y: FLOOR - 31, vx: 0, vy: 0, impactSpeed: 0, jumpLock: false, contactFrames:0 });
    volleyShackle.x=left.x-54;volleyShackle.dir=-1;
    Object.assign(right, { x: 690, y: FLOOR - 31, vx: 0, vy: 0, jumpLock: false, contactFrames:0 });
    ball.x = state.serveLeft ? 215 : 685;

    rect(29,306,5,FLOOR-306,"#fffbeb");rect(W-34,306,5,FLOOR-306,"#fffbeb");
    ctx.fillStyle="rgba(243,254,255,.28)";ctx.fillRect(NET_X-29,NET_TOP,58,FLOOR-NET_TOP);
    rect(NET_X-5,NET_TOP,10,FLOOR-NET_TOP,"#f9fdff");rect(NET_X-9,NET_TOP-3,18,12,"#ee7889");
    ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=2;
    for(let y=NET_TOP+17;y<FLOOR-4;y+=18){ctx.beginPath();ctx.moveTo(NET_X-27,y);ctx.lineTo(NET_X+27,y);ctx.stroke();}
    for(let x=NET_X-25;x<=NET_X+25;x+=12){ctx.beginPath();ctx.moveTo(x,NET_TOP+11);ctx.lineTo(x,FLOOR-2);ctx.stroke();}
    oval(W/2,67,33,33,"rgba(23,67,99,.85)");oval(W/2,67,22,22,"#fff8eb");
    ctx.strokeStyle="#f0ad52";ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,67,16,-1.1,1.4);ctx.stroke();
  }
  function drawTeacher(p,uniform){
 const x=Math.round(p.x),y=Math.round(p.y),mine=p.side==="left";
 const look=mine?null:(enemyLooks[currentDifficulty]||enemyLooks.normal);
 ctx.save();ctx.translate(x,y);
 const px=(a,b,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(a,b,w,h);};
 if(look&&look.aura){
   const pulse=.57+.18*Math.sin(state.playFrames*.11);
   ctx.save();ctx.globalAlpha=pulse*(look.aura===2?.75:.48);
   const auraColor=look.aura===2?"#fa9c43":"#b364c7";
   for(let i=0;i<10;i++){
     const xx=(i%2===0?-1:1)*(35+(i%3)*9),yy=-61+(i*17)%88;
     px(xx,yy,7+(i%2)*4,9+(i%3)*3,auraColor);
   }
   if(look.aura===2){px(-26,-77,52,5,"#ffcb64");px(-14,-86,28,6,"#ff9955");}
   ctx.restore();
 }
 // EASY: animated feather wings stay behind the playable character, not clones.
 if(p===left&&currentDifficulty==="easy"){
   const flap=Math.round(Math.sin(state.playFrames*.18)*10);
   ctx.save();ctx.globalAlpha=.92;
   px(-68,-46-flap,33,13,"#b9edff");px(-80,-39-flap,27,11,"#f0fdff");
   px(-70,-26-flap,29,11,"#def8ff");px(-56,-14,22,12,"#77c9f4");
   px(36,-46-flap,33,13,"#b9edff");px(53,-39-flap,27,11,"#f0fdff");
   px(41,-26-flap,29,11,"#def8ff");px(34,-14,22,12,"#77c9f4");
   px(-81,-48-flap,12,8,"#ffffff");px(69,-48-flap,12,8,"#ffffff");
   ctx.restore();
 }
 px(-35,30,70,7,"rgba(25,45,77,.15)");
 // pixel sneakers and shorts
 px(-24,25,21,8,"#f6ffff");px(4,25,21,8,"#f6ffff");
 px(-21,8,15,19,"#24365f");px(6,8,15,19,"#24365f");
 // thick pixel stroke around shirt
 px(-30,-11,60,34,"#12234a");
 px(-26,-9,52,29,uniform);
 px(-23,-6,7,23,mine?"#2b68c5":look.trim);
 px(16,-6,7,23,mine?"#2b68c5":look.trim);
 if(look&&look.armor){
   px(-38,-14,19,15,look.trim);px(19,-14,19,15,look.trim);
   px(-10,-7,20,16,look.armor>=2?"#e8c7ae":"#f4a5a1");
   px(-6,-3,12,7,look.armor===3?"#fff0a8":"#a8405a");
   if(look.armor>=2){
     px(-40,-20,13,9,"#432942");px(27,-20,13,9,"#432942");
     px(-36,-18,9,6,look.trim);px(27,-18,9,6,look.trim);
     px(-25,17,17,7,look.trim);px(8,17,17,7,look.trim);
   }
   if(look.armor>=3){
     px(-45,-24,12,9,"#ffd168");px(33,-24,12,9,"#ffd168");
     px(-40,-30,7,7,"#fff4b2");px(33,-30,7,7,"#fff4b2");
   }
 }
 px(-8,0,16,5,"#ffffff");px(-6,8,12,6,"#ffe194");
 // gloves / hands: a quick forearm follow-through makes reception readable.
 px(mine?22:-34,-8,12,27,uniform);
 px(mine?29:-37,8,8,12,"#f6c28b");
 if(p.contactFrames>0){
   const lift=Math.round(p.contactFrames*.85);
   px(mine?25:-51,-18-lift,25,11,uniform);
   px(mine?45:-56,-17-lift,12,12,"#f6c28b");
 }
 // square pixel face with darker outline
 px(-23,-52,46,37,"#152644");
 px(-19,-50,38,33,"#f7c797");
 px(-19,-55,38,12,mine?"#254269":look.armor>=2?"#34283f":"#69455f");
 px(-23,-49,8,12,mine?"#254269":look.armor>=2?"#34283f":"#69455f");
 px(15,-49,8,12,mine?"#254269":look.armor>=2?"#34283f":"#69455f");
 // eyes and retro spectacles
 px(-13,-34,6,5,"#17294c");px(7,-34,6,5,"#17294c");
 px(-15,-37,13,2,"#344b64");px(2,-37,13,2,"#344b64");
 px(-15,-37,2,13,"#344b64");px(13,-37,2,13,"#344b64");
 px(-2,-33,4,2,"#344b64");
 px(-5,-24,10,3,"#a85d60");
 // cap / glow highlight
 px(-13,-54,24,3,"rgba(255,255,255,.3)");
 if(look&&look.armor){
   px(-20,-56,40,8,look.trim);
   px(-23,-48,7,12,look.trim);px(16,-48,7,12,look.trim);
   px(-12,-34,7,5,look.eyes);px(6,-34,7,5,look.eyes);
   if(look.armor>=2){
     px(-26,-61,52,7,"#272338");px(-23,-58,46,5,look.trim);
     px(-30,-50,8,14,"#2b2a44");px(22,-50,8,14,"#2b2a44");
     px(-7,-57,14,7,"#f6e8c2");
   }
   if(look.armor>=3){
     px(-30,-64,60,6,"#ffd168");px(-20,-70,14,8,"#ffd168");
     px(6,-70,14,8,"#ffd168");px(-6,-74,12,14,"#fff0b5");
     px(-13,-35,9,5,"#ffe568");px(4,-35,9,5,"#ffe568");
     px(-4,-26,8,3,"#56203c");
   }
 }
 ctx.restore();
}
  function drawVolleyShackle(){
    if(currentDifficulty!=="extreme"||state.phase==="ready"||state.phase==="starting")return;
    const ankleX=left.x+12,ankleY=left.y+25;
    const weightX=volleyShackle.x,weightY=FLOOR-16+Math.sin(state.playFrames*.23)*1.3;
    ctx.save();ctx.lineCap="round";
    ctx.strokeStyle="#394653";ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(ankleX,ankleY);
    ctx.quadraticCurveTo((ankleX+weightX)/2,FLOOR+1,weightX,weightY);ctx.stroke();
    ctx.strokeStyle="#aab4c2";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ankleX,ankleY);
    ctx.quadraticCurveTo((ankleX+weightX)/2,FLOOR+1,weightX,weightY);ctx.stroke();
    oval(weightX,weightY,21,21,"#2b3746");
    oval(weightX-5,weightY-7,7,6,"#9eacb9");
    ctx.fillStyle="#4a596c";ctx.fillRect(ankleX-14,ankleY-8,28,13);
    ctx.fillStyle="#c3d0d9";ctx.fillRect(ankleX-10,ankleY-5,20,4);
    ctx.restore();
  }
  function drawBall(ball=activeBalls[0]) {
    // Spikes leave a dark, fading shadow of the ball plus a short speed streak.
    if(ball.shadowFrames>0){
      const fade=Math.min(1,ball.shadowFrames/18);
      ctx.save();
      for(let i=0;i<ball.trail.length;i++){
        const pos=ball.trail[i],progress=(i+1)/ball.trail.length;
        ctx.globalAlpha=fade*(.07+.24*progress);
        ctx.fillStyle=ball.shadowColor;
        ctx.beginPath();
        ctx.ellipse(pos.x-5,pos.y+5,R*(.54+.32*progress),R*(.54+.32*progress),0,0,Math.PI*2);
        ctx.fill();
      }
      for(let i=4;i>=1;i--){
        ctx.globalAlpha=fade*(.045+(5-i)*.04);
        ctx.fillStyle=ball.shadowColor;
        ctx.beginPath();
        ctx.ellipse(ball.x-ball.vx*i*1.55,ball.y-ball.vy*i*1.55,
          R*(.48+i*.07),R*(.45+i*.07),0,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }else{
      const trailSize=R*.15;
      ball.trail.forEach((pos,i)=>oval(pos.x,pos.y,
        trailSize+i*1.1,trailSize+i*1.1,"rgba(255,248,218,"+(.04+i*.035)+")"));
    }
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.rotate(ball.spin);
    ctx.shadowColor = "rgba(255,244,180,.64)";
    ctx.shadowBlur = 14;
    oval(2, 3, R+3, R+3, "rgba(24,54,83,.24)");
    oval(0, 0, R, R, "#fffdf2");
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff";
    ctx.fillRect(-R*.48, -R*.62, R*.42, R*.18);
    ctx.fillStyle = "#ffdf8e";
    ctx.fillRect(-R*.45, -R*.42, R*.31, R*.32);
    ctx.fillStyle = "#f68b7a";
    ctx.fillRect(R*.18, R*.15, R*.36, R*.33);
    ctx.strokeStyle = "#eba24e";
    ctx.lineWidth = Math.max(4,R*.13);
    ctx.beginPath();
    ctx.arc(0, 0, R*.74, -.95, 1.35);
    ctx.moveTo(-R*.84,R*.1);
    ctx.quadraticCurveTo(0,-R*.4,R*.72,-R*.72);
    ctx.moveTo(-R*.27,R*.92);
    ctx.quadraticCurveTo(-R*.2,R*.03,R*.9,-R*.12);
    ctx.stroke();
    ctx.restore();
  }
  function overlay(headline, subtitle) {
    rect(0,0,W,H,"rgba(11,31,54,.56)");
    ctx.save();ctx.shadowColor="rgba(12,26,45,.5)";ctx.shadowBlur=24;ctx.shadowOffsetY=13;
    ctx.fillStyle="#183552";ctx.beginPath();ctx.roundRect(180,163,540,177,24);ctx.fill();ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle="#6a9bb6";ctx.beginPath();ctx.roundRect(180,163,540,177,24);ctx.stroke();
    textLabel(headline,450,249,45,"#fff6d8","center",494);
    if(subtitle)textLabel(subtitle,450,290,22,"#deefff","center",490);
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if(state.impactFrames>0){
      const shake=(state.impactFrames/19)*4;
      ctx.translate((Math.random()-.5)*2*shake,(Math.random()-.5)*2*shake);
    }
    background();
    for(const ally of clones){
      ctx.save();ctx.globalAlpha=.58;
      drawTeacher(ally,"#50bdb5");
      ctx.restore();
      textLabel("분신",ally.x,ally.y-66,13,"#217f85","center",45);
    }
    drawTeacher(left, "#448bd8");
    drawVolleyShackle();
    drawTeacher(right, (enemyLooks[currentDifficulty]||enemyLooks.normal).uniform);
    if(state.bossWarnFrames>0){
      const glow=state.bossWarnFrames%10<5?"#ffe57a":"#ff8e70";
      ctx.save();ctx.strokeStyle=glow;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(right.x,right.y-29,57,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
      textLabel("⚠",right.x,right.y-91,31,glow,"center",58);
      ctx.restore();
    }
    for(const liveBall of activeBalls)drawBall(liveBall);
    if(state.impactFrames>0){
      const t=1-state.impactFrames/19;
      ctx.save();
      ctx.globalAlpha=Math.max(.05,(1-t)*.8);
      ctx.strokeStyle=state.impactFrames>11?"#fff0a1":"#295780";
      ctx.lineWidth=8*(1-t)+1;
      ctx.beginPath();ctx.arc(state.impactX,state.impactY,15+75*t,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    if(state.flash>0){
      const alpha=Math.min(1,state.flash/9);ctx.fillStyle="rgba(255,235,128,"+(.12*alpha)+")";
      for(let i=0;i<15;i++){const fx=(i*79+state.flash*13)%W,fy=(i*41)%270+25;ctx.fillRect(fx,fy,6,6);}
      textLabel(state.flash>18?"⚡ SUPER SPIKE!":"⚡ SPIKE!",clamp(left.x+85,115,W-115),left.y-115,25,"#a94b27","center",250);
    }
    if (state.phase === "ready") {
      const chosen=schoolPicker.get();
      if(chosen?.eligible)overlay(chosen.school_name, (diffName[chosen.difficulty]||"")+" · ▶ 시작");
      else if(chosen)overlay("조사 참여 필요", "2026 배구지수 조사 참여 후 시작");
      else overlay("학교를 선택하세요", "위의 학교 검색창에서 선택");
    }
    else if (state.phase === "paused") overlay("PAUSE", "");
    else if (state.phase === "point") overlay(state.message, "");
    else if (state.phase === "finished") overlay(state.winner,formatTime(getElapsedTenths()));
    ctx.restore();
  }
  let last = 0, accumulator = 0;
  function frame(time) {
    if (!last) last = time;
    accumulator += Math.min((time - last) / 1000, .06);
    last = time;
    let loops = 0;
    while (accumulator >= 1 / 60 && loops < 4) { step(); accumulator -= 1 / 60; loops++; }
    render();
    requestAnimationFrame(frame);
  }
  // 부모 홈에 자연스럽게 들어가도록 내용 높이를 전달합니다.
  function notifyHeight() {
    if (window.parent === window) return;
    const shell = document.querySelector(".game-shell");
    window.parent.postMessage({ type: "teacher-volleyball:resize", height: Math.ceil(shell.getBoundingClientRect().height) + 2 }, window.location.origin);
  }
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(notifyHeight).observe(document.querySelector(".game-shell"));
  window.addEventListener("load", notifyHeight);
  syncUI();
  render();
  requestAnimationFrame(frame);
})();
</script>
