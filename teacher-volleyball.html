<title>선생님배구 | 배구지수</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #10223d; color: #f8fbff; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .game-shell { margin: 0 auto; max-width: 1100px; padding: 12px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
  .brand { font-size: 13px; font-weight: 850; letter-spacing: -.3px; }
  .pill { display: inline-block; padding: 5px 9px; border: 1px solid #6f97c0; border-radius: 999px; font-size: 11px; color: #d6eaff; white-space: nowrap; }
  .scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px 13px; background: #21395b; border: 1px solid #436185; border-radius: 12px 12px 0 0; }
  .team { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #cfe1ff; }
  .team.right { text-align: right; }
  .team strong { font-size: 24px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  .center-label { color: #cddcf5; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
  .court { position: relative; overflow: hidden; border: 1px solid #436185; border-top: 0; background: #dbefff; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 5; touch-action: none; cursor: crosshair; }
  .touch { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .touch button { min-height: 52px; border: 1px solid #6888b3; border-radius: 12px; background: #304d73; color: #fff; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; user-select: none; touch-action: none; -webkit-user-select: none; }
  .touch button[data-key="spike"] { background: #eaa84e; border-color: #f0c375; color: #2b2331; }
  .touch button.is-down { transform: translateY(2px); filter: brightness(1.18); }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button { flex: 1; min-height: 44px; padding: 10px; border: 0; border-radius: 10px; background: #6bd9c6; color: #12314d; font: inherit; font-weight: 850; cursor: pointer; }
  .actions button.secondary { flex: 0 0 30%; color: #f8fbff; background: #385372; }
  .actions button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { font-size: 12px; line-height: 1.45; color: #bed1e9; text-align: center; margin: 10px 2px 0; }
  .status { min-height: 20px; font-size: 12px; font-weight: 700; text-align: center; color: #ffdea6; margin-top: 8px; }
  button:focus-visible { outline: 3px solid #ffec93; outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .touch { display: none; } .game-shell { padding: 18px; } }
  @media(max-width: 380px) { .game-shell { padding: 9px; } .touch { gap: 5px; } .touch button { min-height: 47px; font-size: 13px; } .scoreboard { padding: 8px; } }

<body>
<main class="game-shell">
  <div class="top"><span class="brand" style="display:inline-flex;align-items:center;gap:10px"><span class="beagu-brand-mark" aria-hidden="true">B</span>선생님배구</span><span class="pill">7점 경기</span></div>
  <div class="scoreboard" aria-label="현재 점수">
    <div class="team"><span>나</span><strong id="player-score">0</strong></div>
    <div class="center-label">VS</div>
    <div class="team right"><span>컴퓨터</span><strong id="cpu-score">0</strong></div>
  </div>
  <div class="court"><canvas tabindex="0" id="game" width="900" height="500" role="img" aria-label="파란 선생님과 분홍 선생님이 네트를 사이에 두고 배구하는 게임 화면"></canvas></div>
  <div class="touch" aria-label="모바일 점프와 스파이크 조작 버튼">
    <button type="button" data-key="spike">⚡ 스파이크</button>
    <button type="button" data-key="jump">↑ 점프</button>
  </div>
  <div class="actions"><button type="button" id="start">▶ 시작</button><button type="button" class="secondary" id="pause" disabled aria-label="일시정지" title="일시정지">⏸</button><button type="button" class="auxiliary" id="help" aria-label="조작법" title="조작법">?</button></div>
  <div class="status" id="status" aria-live="polite"></div><div class="mini-help" id="help-panel" hidden>↔ A·D / 방향키 또는 드래그　↑ 점프·위로 밀기　⚡ J·K 또는 스파이크</div>
</main>
<script>
(function () {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreP = document.getElementById("player-score");
  const scoreC = document.getElementById("cpu-score");
  const startButton = document.getElementById("start");
  const pauseButton = document.getElementById("pause");
  const status = document.getElementById("status");
  const helpButton=document.getElementById("help"),helpPanel=document.getElementById("help-panel");
  const W = 900, H = 500, FLOOR = 451, NET_X = 450, NET_TOP = 305, NET_W = 14, R = 16;
  const keys = { left: false, right: false, jump: false, spike: false };
  const touchControl = { pointerId: null, targetX: null, startY: 0, swiped: false, jumpRequested: false };
  const state = { phase: "ready", leftScore: 0, rightScore: 0, serveLeft: true, pointTicks: 0, flash: 0, winner: "", message: "경기 시작을 눌러주세요!" };
  const left = { x: 210, y: FLOOR - 31, vy: 0, vx: 0, side: "left", jumpLock: false };
  const right = { x: 690, y: FLOOR - 31, vy: 0, vx: 0, side: "right", jumpLock: false };
  const ball = { x: 228, y: 218, vx: 0, vy: 0, cooldown: 0, trail: [] };
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const setStatus = text => { status.textContent = text; };
  function syncUI() {
    scoreP.textContent = String(state.leftScore);
    scoreC.textContent = String(state.rightScore);
    startButton.textContent = state.phase === "finished" ? "↻ 다시 하기" : state.phase === "ready" ? "▶ 시작" : "↻ 다시 시작";
    pauseButton.disabled = state.phase === "ready" || state.phase === "finished" || state.phase === "point";
    pauseButton.textContent = state.phase === "paused" ? "▶" : "⏸";
    pauseButton.setAttribute("aria-label",state.phase === "paused"?"계속하기":"일시정지");
  }
  function resetPositions() {
    Object.assign(left, { x: 210, y: FLOOR - 31, vx: 0, vy: 0, jumpLock: false });
    Object.assign(right, { x: 690, y: FLOOR - 31, vx: 0, vy: 0, jumpLock: false });
    ball.x = state.serveLeft ? 215 : 685;
    ball.y = 223;
    ball.vx = state.serveLeft ? 6.1 : -6.1;
    ball.vy = -6.3;
    ball.cooldown = 0;
    ball.trail.length = 0;
  }
  function startMatch() {
    state.leftScore = 0;
    state.rightScore = 0;
    releaseKeys();
    state.serveLeft = Math.random() < 0.5;
    state.phase = "playing";
    state.winner = "";
    state.message = "";
    state.flash = 0;
    resetPositions();
    setStatus("");
    syncUI();
    canvas.focus();
  }
  function pause() {
    if (state.phase === "playing") {
      state.phase = "paused";
      releaseKeys();
      setStatus("일시정지");
    } else if (state.phase === "paused") {
      state.phase = "playing";
      setStatus("");
    }
    syncUI();
  }
  function releaseKeys() {
    Object.keys(keys).forEach(k => { keys[k] = false; });
    touchControl.pointerId = null;
    touchControl.targetX = null;
    touchControl.jumpRequested = false;
    document.querySelectorAll(".touch button").forEach(b => b.classList.remove("is-down"));
  }
  const codes = { KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right", KeyW: "jump", ArrowUp: "jump", Space: "jump", KeyJ: "spike", KeyK: "spike" };
  document.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "BUTTON") return;
    const key = codes[e.code];
    if (!key) return;
    e.preventDefault();
    keys[key] = true;
  });
  document.addEventListener("keyup", e => { if (codes[e.code]) keys[codes[e.code]] = false; });
  // 모바일에서는 경기장에 손가락을 대거나 드래그하면 해당 위치로 이동합니다.
  // 위로 밀면 한 번 점프합니다. 점프 버튼은 별도로 제공하여 접근성을 높입니다.
  function targetFromPointer(e) {
    const bounds = canvas.getBoundingClientRect();
    if (!bounds.width) return;
    const relativeX = (e.clientX - bounds.left) * (W / bounds.width);
    touchControl.targetX = clamp(relativeX, 35, NET_X - NET_W / 2 - 36);
  }
  canvas.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" || state.phase !== "playing" || touchControl.pointerId !== null) return;
    e.preventDefault();
    touchControl.pointerId = e.pointerId;
    touchControl.startY = e.clientY;
    touchControl.swiped = false;
    targetFromPointer(e);
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (touchControl.pointerId !== e.pointerId) return;
    e.preventDefault();
    targetFromPointer(e);
    if (!touchControl.swiped && touchControl.startY - e.clientY >= 24) {
      touchControl.jumpRequested = true;
      touchControl.swiped = true;
    }
  });
  function endCourtTouch(e) {
    if (touchControl.pointerId !== e.pointerId) return;
    touchControl.pointerId = null;
    // 짧게 탭해도 지정한 위치까지 이동합니다.
    if (e.type === "pointercancel") touchControl.targetX = null;
  }
  canvas.addEventListener("pointerup", endCourtTouch);
  canvas.addEventListener("pointercancel", endCourtTouch);
  canvas.addEventListener("lostpointercapture", endCourtTouch);
  document.querySelectorAll(".touch button").forEach(button => {
    const key = button.dataset.key;
    button.addEventListener("pointerdown", e => {
      e.preventDefault();
      button.setPointerCapture(e.pointerId);
      keys[key] = true;
      button.classList.add("is-down");
    });
    const up = e => { if (e) e.preventDefault(); keys[key] = false; button.classList.remove("is-down"); };
    button.addEventListener("pointerup", up);
    button.addEventListener("pointercancel", up);
    button.addEventListener("lostpointercapture", up);
  });
  startButton.addEventListener("click", startMatch);
  pauseButton.addEventListener("click", pause);
  helpButton.addEventListener("click",()=>{helpPanel.hidden=!helpPanel.hidden;helpButton.setAttribute("aria-expanded",String(!helpPanel.hidden));notifyHeight();});
  window.addEventListener("blur", () => { releaseKeys(); if (state.phase === "playing") pause(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state.phase === "playing") pause(); });
  function controlPlayer(p, direction, jump, speed) {
    p.vx = direction * speed;
    p.x = clamp(p.x + p.vx, p.side === "left" ? 35 : NET_X + NET_W / 2 + 36, p.side === "left" ? NET_X - NET_W / 2 - 36 : W - 35);
    const grounded = p.y >= FLOOR - 31 - .1;
    if (jump && grounded && !p.jumpLock) { p.vy = -10.8; p.jumpLock = true; }
    if (!jump) p.jumpLock = false;
    p.vy += .49;
    p.y += p.vy;
    if (p.y > FLOOR - 31) { p.y = FLOOR - 31; p.vy = 0; }
  }
  function moveAI() {
    let target = 688;
    if (ball.x > NET_X + 2) {
      target = clamp(ball.x + ball.vx * 8, NET_X + 48, W - 42);
    } else if (ball.vx > 0 && ball.y < NET_TOP) {
      target = clamp(NET_X + 130, NET_X + 48, W - 42);
    }
    const difference = target - right.x;
    const move = Math.abs(difference) > 8 ? Math.sign(difference) : 0;
    const close = ball.x > NET_X && Math.abs(ball.x - right.x) < 76;
    const jump = close && ball.y > right.y - 155 && ball.y < right.y + 15 && ball.vy > -3;
    controlPlayer(right, move, jump, 3.65);
  }
  function playerHit(p) {
    const dx = ball.x - p.x, dy = ball.y - (p.y - 7);
    const reach = p.side === "left" ? 43 : 42;
    if (ball.cooldown > 0 || dx * dx + dy * dy > (reach + R) * (reach + R)) return;
    const sign = p.side === "left" ? 1 : -1;
    const spike = p.side === "left" && keys.spike;
    ball.vx = sign * (spike ? 11.8 : p.side === "left" ? 7.6 : 7.1) + p.vx * .18;
    ball.vy = spike ? -5.6 : -9.7;
    if (p.vy < -2) ball.vy -= 1.3;
    ball.x = p.x + sign * (reach + R + 1);
    ball.y = Math.min(ball.y, p.y - 22);
    ball.cooldown = 12;
    if (spike) state.flash = 9;
  }
  function point(leftWins) {
    state.phase = "point";
    state.pointTicks = 100;
    state.serveLeft = !leftWins;
    if (leftWins) state.leftScore += 1; else state.rightScore += 1;
    state.message = leftWins ? "득점! +1" : "실점!";
    setStatus(state.message);
    if ((state.leftScore >= 7 || state.rightScore >= 7) && Math.abs(state.leftScore - state.rightScore) >= 2) {
      state.phase = "finished";
      state.winner = state.leftScore > state.rightScore ? "🏆 승리!" : "다시 도전!";
      state.message = state.winner;
      setStatus(state.winner);
    }
    syncUI();
  }
  function step() {
    if (state.flash > 0) state.flash--;
    if (state.phase === "point") {
      if (--state.pointTicks <= 0) { state.phase = "playing"; state.message = ""; resetPositions(); syncUI(); setStatus(""); }
      return;
    }
    if (state.phase !== "playing") return;
    const keyboardDirection = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let direction = keyboardDirection;
    if (!direction && touchControl.targetX !== null) {
      const difference = touchControl.targetX - left.x;
      if (Math.abs(difference) > 5) direction = Math.sign(difference);
      else touchControl.targetX = null;
    }
    controlPlayer(left, direction, keys.jump || touchControl.jumpRequested, 5);
    touchControl.jumpRequested = false;
    moveAI();
    const previousX = ball.x, previousY = ball.y;
    ball.vy += .30;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.vx *= .999;
    if (ball.cooldown > 0) ball.cooldown--;
    if (ball.x - R < 0) { ball.x = R; ball.vx = Math.abs(ball.vx) * .94; }
    if (ball.x + R > W) { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * .94; }
    if (ball.y - R < 25) { ball.y = R + 25; ball.vy = Math.abs(ball.vy) * .85; }
    if (Math.abs(ball.x - NET_X) < NET_W / 2 + R && ball.y + R >= NET_TOP && ball.y - R < FLOOR) {
      if (previousY + R <= NET_TOP + 4 && ball.vy > 0) {
        ball.y = NET_TOP - R;
        ball.vy = -Math.max(3.7, Math.abs(ball.vy) * .7);
      } else if (previousX <= NET_X) {
        ball.x = NET_X - NET_W / 2 - R;
        ball.vx = -Math.max(2.8, Math.abs(ball.vx) * .85);
      } else {
        ball.x = NET_X + NET_W / 2 + R;
        ball.vx = Math.max(2.8, Math.abs(ball.vx) * .85);
      }
    }
    playerHit(left);
    playerHit(right);
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 6) ball.trail.shift();
    if (ball.y + R >= FLOOR) {
      ball.y = FLOOR - R;
      point(ball.x >= NET_X);
    }
  }
  function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function oval(x, y, rx, ry, color) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  function textLabel(text, x, y, size, color, align, maxWidth) {
    ctx.textAlign = align || "center";
    ctx.fillStyle = color; ctx.font = "900 " + size + "px system-ui, sans-serif";
    ctx.fillText(text, x, y, maxWidth || 850);
  }
  function background() {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#95ceef");sky.addColorStop(.57,"#e2f8fa");sky.addColorStop(1,"#ffe7c4");
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
    // 체육관 천장과 채광
    rect(0,0,W,14,"#254767");rect(0,14,W,6,"#628dac");
    for(let i=0;i<5;i++){
      const x=45+i*195;rect(x,21,13,145,"rgba(238,250,255,.4)");
      oval(x+8,24,36,11,"rgba(255,255,255,.33)");
    }
    rect(0,162,W,136,"#b4d1e5");rect(0,162,W,11,"#517da2");
    for(let i=0;i<8;i++){const x=22+i*120;rect(x,174,94,48,"#93bad5");rect(x+6,179,82,38,"#bde0f1");}
    rect(0,231,W,11,"#5885a8");rect(0,244,W,54,"#7baccf");
    for(let row=0;row<2;row++){
      for(let i=0;i<29;i++){
        const x=i*33+(row%2)*14,y=251+row*25;
        oval(x+9,y+6,7,8,["#f4c99d","#d6a075","#eab481","#a67055"][(i+row)%4]);
        oval(x+9,y-1,9,4,["#355778","#6e5362","#38495d"][(i+row)%3]);
        rect(x+2,y+13,16,12,["#466eaa","#f5a36b","#84c7b8","#e9cc76"][(i*3+row)%4]);
      }
    }
    rect(0,295,W,9,"#37668f");
    const floor=ctx.createLinearGradient(0,304,0,FLOOR);
    floor.addColorStop(0,"#f9e0b4");floor.addColorStop(.55,"#f4ce97");floor.addColorStop(1,"#e5b47e");
    ctx.fillStyle=floor;ctx.fillRect(0,304,W,FLOOR-304);
    for(let x=0;x<W;x+=65)rect(x,306,2,FLOOR-306,"rgba(162,98,62,.13)");
    rect(0,FLOOR,W,H-FLOOR,"#bb7e59");rect(0,FLOOR,W,8,"#fffaf0");rect(0,FLOOR+20,W,3,"#a56e53");
    rect(29,306,5,FLOOR-306,"#fffbeb");rect(W-34,306,5,FLOOR-306,"#fffbeb");
    ctx.fillStyle="rgba(243,254,255,.28)";ctx.fillRect(NET_X-29,NET_TOP,58,FLOOR-NET_TOP);
    rect(NET_X-5,NET_TOP,10,FLOOR-NET_TOP,"#f9fdff");rect(NET_X-9,NET_TOP-3,18,12,"#ee7889");
    ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=2;
    for(let y=NET_TOP+17;y<FLOOR-4;y+=18){ctx.beginPath();ctx.moveTo(NET_X-27,y);ctx.lineTo(NET_X+27,y);ctx.stroke();}
    for(let x=NET_X-25;x<=NET_X+25;x+=12){ctx.beginPath();ctx.moveTo(x,NET_TOP+11);ctx.lineTo(x,FLOOR-2);ctx.stroke();}
    oval(W/2,67,33,33,"rgba(23,67,99,.85)");oval(W/2,67,22,22,"#fff8eb");
    ctx.strokeStyle="#f0ad52";ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2,67,16,-1.1,1.4);ctx.stroke();
  }
  function drawTeacher(p, uniform) {
    const x = Math.round(p.x), y = Math.round(p.y), leftSide = p.side === "left";
    oval(x, FLOOR + 2, 36, 6, "rgba(68,57,57,.18)");
    // 신발과 바지
    rect(x - 21, y + 15, 16, 17, "#203a5a"); rect(x + 6, y + 15, 16, 17, "#203a5a");
    rect(x - 24, y + 27, 20, 7, "#fff"); rect(x + 5, y + 27, 20, 7, "#fff");
    // 상의, 팔, 손
    oval(x, y + 7, 31, 27, uniform);
    oval(x + (leftSide ? 24 : -24), y + 4, 11, 13, uniform);
    oval(x + (leftSide ? 30 : -30), y + 10, 9, 8, "#f0bf8d");
    rect(x - 3, y + 1, 6, 23, "#fff6d9");
    oval(x, y + 19, 5, 7, "#eabc4f");
    // 얼굴 / 머리
    oval(x, y - 30, 27, 29, "#f4c99d");
    oval(x, y - 49, 27, 14, leftSide ? "#34485a" : "#714d49");
    rect(x - 27, y - 50, 54, 10, leftSide ? "#34485a" : "#714d49");
    // 안경 + 미소
    ctx.strokeStyle = "#34465b"; ctx.lineWidth = 3;
    ctx.strokeRect(x - 20, y - 36, 16, 12); ctx.strokeRect(x + 4, y - 36, 16, 12);
    rect(x - 4, y - 33, 8, 3, "#34465b");
    ctx.beginPath(); ctx.arc(x, y - 21, 7, .22, Math.PI - .22); ctx.stroke();
    rect(x - 11, y - 5, 22, 4, "#fff");
    if (leftSide) {
      rect(x - 24, y + 2, 10, 4, "#ffe2b1");
    } else {
      oval(x + 30, y - 28, 7, 7, "#ffb5c0");
    }
  }
  function drawBall() {
    ball.trail.forEach((pos, i) => oval(pos.x, pos.y, 5 + i, 5 + i, "rgba(255,251,232," + (.04 + i * .035) + ")"));
    oval(ball.x + 2, ball.y + 2, R + 2, R + 2, "rgba(43,84,110,.17)");
    const ballGradient=ctx.createRadialGradient(ball.x-5,ball.y-8,2,ball.x,ball.y,R);ballGradient.addColorStop(0,"#fff");ballGradient.addColorStop(1,"#e9e5d5");ctx.fillStyle=ballGradient;ctx.beginPath();ctx.arc(ball.x,ball.y,R,0,Math.PI*2);ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "#f2a341";
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 12, -.9, 1.2);
    ctx.moveTo(ball.x - 14, ball.y + 2); ctx.quadraticCurveTo(ball.x, ball.y - 6, ball.x + 11, ball.y - 11);
    ctx.moveTo(ball.x - 4, ball.y + 15); ctx.quadraticCurveTo(ball.x - 2, ball.y + 1, ball.x + 15, ball.y - 2);
    ctx.stroke();
  }
  function overlay(headline, subtitle) {
    rect(0,0,W,H,"rgba(11,31,54,.56)");
    ctx.save();ctx.shadowColor="rgba(12,26,45,.5)";ctx.shadowBlur=24;ctx.shadowOffsetY=13;
    ctx.fillStyle="#183552";ctx.beginPath();ctx.roundRect(180,163,540,177,24);ctx.fill();ctx.restore();
    ctx.lineWidth=3;ctx.strokeStyle="#6a9bb6";ctx.beginPath();ctx.roundRect(180,163,540,177,24);ctx.stroke();
    textLabel(headline,450,249,45,"#fff6d8","center",494);
    if(subtitle)textLabel(subtitle,450,290,22,"#deefff","center",490);
  }
  function render() {
    ctx.clearRect(0, 0, W, H);
    background();
    drawTeacher(left, "#448bd8");
    drawTeacher(right, "#ec7b97");
    drawBall();
    if (state.flash > 0) textLabel("⚡ SPIKE!", clamp(left.x+85,115,W-115), left.y-115,25,"#a94b27","center",220);
    if (state.phase === "ready") overlay("🏐 선생님배구", "");
    else if (state.phase === "paused") overlay("⏸ 일시정지", "");
    else if (state.phase === "point") overlay(state.message, "");
    else if (state.phase === "finished") overlay(state.winner, "");
  }
  let last = 0, accumulator = 0;
  function frame(time) {
    if (!last) last = time;
    accumulator += Math.min((time - last) / 1000, .06);
    last = time;
    let loops = 0;
    while (accumulator >= 1 / 60 && loops < 4) { step(); accumulator -= 1 / 60; loops++; }
    render();
    requestAnimationFrame(frame);
  }
  // 부모 홈에 자연스럽게 들어가도록 내용 높이를 전달합니다.
  function notifyHeight() {
    if (window.parent === window) return;
    const shell = document.querySelector(".game-shell");
    window.parent.postMessage({ type: "teacher-volleyball:resize", height: Math.ceil(shell.getBoundingClientRect().height) + 2 }, window.location.origin);
  }
  if (typeof ResizeObserver !== "undefined") new ResizeObserver(notifyHeight).observe(document.querySelector(".game-shell"));
  window.addEventListener("load", notifyHeight);
  syncUI();
  render();
  requestAnimationFrame(frame);
})();
</script>
