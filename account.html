<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>나의 계정 · 배구지수</title><link rel="stylesheet" href="styles/beagu-account-v1.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script><script src="js/supabase-config.js"></script><script defer src="js/beagu-account-v1.js"></script></head>
<body><main><nav><a href="index.html">BAEGUINDEX 홈</a> · <a href="challenge.html">챌린지</a></nav><h1>나의 계정</h1><p>기존 참여코드와 추천 실적은 그대로 유지됩니다. 계정 연결에는 처음 참여한 기기가 필요합니다.</p><p id="accountMessage" role="status" aria-live="polite"></p>
<section><h2>가계정 가입</h2><form id="accountSignup"><label>개인 참여코드<input name="code" required maxlength="120" autocomplete="off"></label><label>비밀번호 (12자 이상)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><button>가계정 만들기</button></form><p id="issuedAccount" hidden></p></section>
<section><h2>가계정 로그인</h2><form id="accountLogin"><label>가계정 고유번호<input name="account_id" required maxlength="36" autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button>로그인</button></form></section>
<section><h2>정식 계정</h2><p>정식 계정은 Lv.2 챌린지 달성 및 본인 확인 후 연결됩니다. 현재 연결된 Google 계정만 지원하도록 준비합니다. 카카오·네이버는 제공자 설정 검증 후 추가합니다.</p><button type="button" id="accountGoogle">Google 로그인</button><form id="accountFormal"><label>기존 개인 참여코드<input name="code" required maxlength="120" autocomplete="off"></label><button>기존 계정 연결</button></form><button id="accountFormalLogin" type="button">연결된 정식 계정으로 접속</button></section>
<button type="button" id="accountLogout">계정 로그아웃</button><p><a href="index.html">기존 참여코드 방식 계속 이용하기</a></p></main></body></html>
