<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f7f8fa">
  <title>참여 인증 새 주소 | 배구지수</title>
  <link rel="canonical" href="https://baeguindex.com/challenge.html">
  <style>
    body{margin:0;padding:32px 18px;min-height:100dvh;display:grid;place-items:center;background:#f7f8fa;color:#17233a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
    main{max-width:450px;padding:24px;background:#fff;border:1px solid #dce4ef;border-radius:16px}
    h1{font-size:23px}p{line-height:1.7;color:#52627c}a{color:#1d4ed8;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>참여 인증 화면이 이동했습니다</h1>
    <p>중복된 이전 주소를 하나로 정리했습니다. 현재 참여 인증 화면으로 이동합니다.</p>
    <p><a id="currentLink" href="../challenge.html">현재 참여 인증 화면 열기</a></p>
  </main>
  <script>
  (()=>{
    const destination=new URL('../challenge.html',location.href);
    destination.search=location.search;
    destination.hash=location.hash;
    document.getElementById('currentLink').href=destination.href;
    location.replace(destination.href);
  })();
  </script>
</body>
</html>
