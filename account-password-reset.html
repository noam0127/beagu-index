<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://snvzwrexuqavnfvzgxqj.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>비밀번호 재설정 · 배구지수</title>
<script defer src="js/beagu-account-password-reset-v1.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#1c283c;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;line-height:1.6;padding:24px}
main{max-width:440px;margin:10vh auto;padding:28px;border:1px solid #dbe3ed;border-radius:20px;background:#fff}
h1{font-size:23px;margin:0 0 10px}p{color:#56647a}label{display:block;font-weight:650;margin:18px 0 5px}
input{font:inherit;width:100%;border:1px solid #bac8d8;border-radius:11px;padding:12px;min-height:46px}
input:focus{outline:2px solid #2563eb;outline-offset:2px}
#resetStatus{margin-top:18px;min-height:25px}small{color:#64748b}
</style>
</head>
<body>
<main>
<h1>비밀번호 재설정</h1>
<p>이메일에서 받은 일회용 복구 링크로 접속한 경우에만 비밀번호를 변경할 수 있습니다.</p>
<form id="resetForm" autocomplete="off" hidden>
  <label for="resetPassword">새 비밀번호</label>
  <input id="resetPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
  <label for="resetPasswordConfirm">비밀번호 확인</label>
  <input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required enterkeyhint="go">
  <small>12자 이상 입력하고 비밀번호 확인란에서 Enter 또는 완료를 눌러 주세요.</small>
</form>
<p id="resetStatus" role="status" aria-live="polite">복구 링크를 확인하고 있습니다.</p>
</main>
</body>
</html>
