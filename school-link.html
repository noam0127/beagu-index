<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>학교 상세조회 연결 | 배구지수</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fa;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#19334e}
main{padding:26px;text-align:center}p{font-size:14px;color:#546b81}a{color:#1d4ed8}
</style>
</head>
<body>
<main><h1>학교 상세조회 연결</h1><p id="status" role="status">현재 레벨을 확인하고 있습니다.</p><a href="search.html">학교검색으로 이동</a></main>
<script>
(async()=>{
"use strict";
const id=new URLSearchParams(location.search).get("school_id")||"";
if(!/^[A-Z0-9]{7}$/.test(id)){location.replace("search.html");return;}
const target=new URLSearchParams({school_id:id}).toString();
let tier=0;
try{
 const token=sessionStorage.getItem("beagu-level-session-v1")||"";
 if(/^[a-f0-9]{64}$/.test(token)){
  const response=await fetch("https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-level-api",{
   method:"POST",cache:"no-store",
   headers:{"Content-Type":"application/json","X-Beagu-Session":token},
   body:JSON.stringify({action:"verify"}),signal:AbortSignal.timeout(5000)
  });
  if(response.ok){
   const data=await response.json();
   if(Number.isInteger(data.level)&&data.level>=1)tier=data.level>=2?2:1;
  }
 }
}catch(_){/* Unverified visitors see only public Lv.0 information. */}
location.replace((tier>=1?"search-lv1.html":"school-report.html")+"?"+target);
})();
</script>
</body>
</html>
