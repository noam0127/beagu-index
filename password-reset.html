<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>비밀번호 재설정 | 배구지수</title>
<link rel="stylesheet" href="styles/beagu-password-reset-v1.css?v=20261121-8">
</head>
<body>
<main class="recovery-shell" aria-labelledby="recoveryTitle">
  <a class="recovery-brand" href="index.html">BAEGU<span>INDEX</span></a>
  <section class="recovery-card">
    <p class="recovery-eyebrow">ACCOUNT SECURITY</p>
    <h1 id="recoveryTitle">비밀번호 재설정</h1>
    <p class="recovery-description">배구지수 계정의 비밀번호를 안전하게 다시 설정하세요.</p>
    <p id="beaguRecoveryStatus" class="recovery-status" role="status" aria-live="polite" hidden></p>
    <form id="beaguRecoveryRequestForm" autocomplete="on">
      <label for="beaguRecoveryEmail">가입한 이메일 주소</label>
      <input id="beaguRecoveryEmail" type="email" inputmode="email" autocomplete="email"
        maxlength="254" placeholder="example@email.com" required>
      <button id="beaguRecoveryRequestButton" type="submit">재설정 메일 받기</button>
      <p class="recovery-note">가입 여부와 관계없이 같은 안내를 표시합니다. 이메일이 도착하지 않으면 스팸함과 입력 주소를 확인해 주세요.</p>
    </form>
    <form id="beaguRecoveryResetForm" autocomplete="off" hidden>
      <label for="beaguRecoveryPassword">새 비밀번호 (10자 이상)</label>
      <input id="beaguRecoveryPassword" type="password" autocomplete="new-password"
        minlength="10" maxlength="128" required>
      <label for="beaguRecoveryConfirm">새 비밀번호 확인</label>
      <input id="beaguRecoveryConfirm" type="password" autocomplete="new-password"
        minlength="10" maxlength="128" required>
      <button id="beaguRecoveryUpdateButton" type="submit">비밀번호 변경하기</button>
      <p class="recovery-note">기존 비밀번호와 인증 코드는 이 화면에 표시하거나 별도로 저장하지 않습니다.</p>
    </form>
    <section id="beaguRecoveryExpiry" class="recovery-help" hidden>
      <p>인증 링크가 만료·사용되었거나 유효하지 않습니다. 새 이메일을 요청해 주세요.</p>
      <button type="button" id="beaguRecoveryRestart">새 링크 다시 요청하기</button>
    </section>
    <p class="recovery-footer">
      <a href="challenge.html">챌린지로 돌아가기</a>
      <span aria-hidden="true">·</span>
      <a href="postit.html">포스트잇으로 돌아가기</a>
    </p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/beagu-auth-return-v1.js?v=20261121-url1"></script>
<script src="js/beagu-password-reset-v1.js?v=20261121-8"></script>
</body>
</html>
