<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 검색 | 배구지수</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .back {
      border: 0;
      background: none;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #2563eb;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
      letter-spacing: -1.5px;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.6;
    }

    .search-box {
      width: 100%;
      padding: 17px 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .search-box:focus {
      border-color: #2563eb;
    }

    .result-count {
      font-size: 14px;
      color: #777;
      margin: 18px 2px 12px;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .school-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .school-card:active {
      transform: scale(0.98);
    }

    .school-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

   .school-meta {
  font-size: 14px;
  color: #666;
  line-height: 1.6;
}

.school-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.school-button {
  display: block;
  text-align: center;
  text-decoration: none;
  border-radius: 10px;
  padding: 13px 10px;
  font-size: 14px;
  font-weight: 700;
}

.view-button {
  background: #2563eb;
  color: white;
}

.survey-button {
  background: #eef2ff;
  color: #2563eb;
}
    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="topbar">
      <button class="back" onclick="history.back()">←</button>
      <div class="logo">VOLLEYBALL INDEX</div>
    </div>

    <h1>학교를 찾아보세요</h1>

    <p class="description">
      학교명을 입력하면 배구지수 학교 마스터에서 검색합니다.
    </p>

    <input
      id="searchInput"
      class="search-box"
      type="search"
      placeholder="예: 개원초, 서울개원초등학교"
      autocomplete="off"
    >

    <div id="resultCount" class="result-count"></div>

    <div id="results" class="results"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>

<script>
  const searchInput = document.getElementById("searchInput");
  const results = document.getElementById("results");
  const resultCount = document.getElementById("resultCount");

  let searchTimer = null;
  let latestSearchNumber = 0;

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderSchools(schools) {

    results.innerHTML = "";

    resultCount.textContent =
      `검색 결과 ${schools.length}개`;

    if (schools.length === 0) {

      results.innerHTML = `
        <div class="empty">
          검색 결과가 없습니다.
        </div>
      `;

      return;
    }

    schools.forEach(school => {

      const card = document.createElement("div");

      card.className = "school-card";

      const schoolId =
        encodeURIComponent(school.school_id);

      card.innerHTML = `
        <div class="school-name">
          ${escapeHtml(school.school_name)}
        </div>

        <div class="school-meta">
          ${escapeHtml(school.sido)}
          ·
          ${escapeHtml(school.support_office || "")}
          <br>
          ${escapeHtml(school.address || "")}
        </div>

        <div class="school-actions">

          <a
            class="school-button view-button"
            href="result.html?school=${schoolId}"
          >
            배구지수 열람
          </a>

          <a
            class="school-button survey-button"
            href="survey.html?school=${schoolId}"
          >
            2026 조사 참여
          </a>

        </div>
      `;

      results.appendChild(card);
    });
  }

  async function searchSchools() {

    const keyword =
      searchInput.value.trim();

    if (keyword === "") {
      resultCount.textContent = "";
      results.innerHTML = "";
      return;
    }

    const currentSearchNumber =
      ++latestSearchNumber;

    resultCount.textContent =
      "검색 중...";

    try {

      const { data: schools, error } =
        await supabaseClient
          .from("schools")
          .select(`
            school_id,
            school_name,
            sido,
            support_office,
            address,
            establishment,
            status
          `)
          .eq("status", "운영")
          .ilike(
            "school_name",
            `%${keyword}%`
          )
          .order("school_name")
          .limit(20);

      if (currentSearchNumber !== latestSearchNumber) {
        return;
      }

      if (error) {
        throw error;
      }

      renderSchools(schools || []);

    } catch (error) {

      console.error(
        "학교 검색 오류:",
        error
      );

      resultCount.textContent = "";

      results.innerHTML = `
        <div class="empty">
          학교 검색 중 오류가 발생했습니다.
        </div>
      `;
    }
  }

  searchInput.addEventListener(
    "input",
    () => {

      clearTimeout(searchTimer);

      searchTimer = setTimeout(
        searchSchools,
        250
      );
    }
  );
</script>

</body>
</html>
