<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>학교 검색 | 배구지수</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 40px;
    }

    .back {
      border: 0;
      background: none;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #2563eb;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
      letter-spacing: -1.5px;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.6;
    }

    .search-box,
    .region-select {
      width: 100%;
      padding: 17px 18px;

      border: 1px solid #ddd;
      border-radius: 14px;

      font-size: 16px;
      outline: none;

      background: white;
      color: #111;
    }

    .search-box:focus,
    .region-select:focus {
      border-color: #2563eb;
    }

    .filters {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .region-select {
      cursor: pointer;
    }

    .result-count {
      font-size: 14px;
      color: #777;
      margin: 18px 2px 12px;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .school-card {
      background: white;
      border-radius: 16px;
      padding: 20px;

      box-shadow:
        0 3px 14px rgba(0, 0, 0, 0.05);

      transition: transform 0.15s ease;
    }

    .school-card:active {
      transform: scale(0.98);
    }

    .school-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .school-meta {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    .region-badge {
      display: inline-block;

      margin-bottom: 10px;
      padding: 5px 9px;

      border-radius: 999px;

      background: #eef2ff;
      color: #2563eb;

      font-size: 12px;
      font-weight: 700;
    }

    .school-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;
      margin-top: 16px;
    }

    .school-button {
      display: block;

      text-align: center;
      text-decoration: none;

      border-radius: 10px;

      padding: 13px 10px;

      font-size: 14px;
      font-weight: 700;
    }

    .view-button {
      background: #2563eb;
      color: white;
    }

    .exchange-button {
      background: #eef2ff;
      color: #2563eb;
    }

    .empty {
      padding: 40px 20px;

      text-align: center;

      color: #888;
    }
  
    .participation-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e5e7eb;
    }
    .participation-link {
      display: block;
      max-width: 552px;
      margin: 0 auto;
      padding: 14px 12px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
    }
    .participation-link:hover { background: #1d4ed8; }
    .participation-link:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }
    .percentile-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0 8px; }
    .percentile-cell { padding: 12px 4px; background: #f1f5f9; border-radius: 10px; text-align: center; }
    .percentile-year { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .percentile-value { font-size: 16px; font-weight: 700; color: #1e40af; }
    .percentile-note { font-size: 12px; color: #64748b; line-height: 1.6; margin: 6px 0; }
  </style>
</head>

<body>

  <header class="participation-bar">
    <a class="participation-link" href="https://indischool.com/boards/together/37612156" target="_blank" rel="noopener noreferrer">배구지수 조사하고 참여코드 획득</a>
  </header>


  <main class="container">

    <div class="topbar">

      <button
        class="back"
        onclick="history.back()"
        aria-label="뒤로가기"
      >
        ←
      </button>

      <div class="logo">
        VOLLEYBALL INDEX
      </div>

    </div>

    <h1>
      학교를 찾아보세요
    </h1>

    <p class="description">
      전국 초등학교를 학교명과 지역으로 검색할 수 있습니다.
    </p>

    <div class="filters">

      <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="예: 개원초, 서울개원초등학교"
        autocomplete="off"
      >

      <select
        id="regionSelect"
        class="region-select"
        aria-label="지역 선택"
      >
        <option value="">
          전체 지역
        </option>

        <option value="서울">서울</option>
        <option value="부산">부산</option>
        <option value="대구">대구</option>
        <option value="인천">인천</option>
        <option value="광주">광주</option>
        <option value="대전">대전</option>
        <option value="울산">울산</option>
        <option value="세종">세종</option>
        <option value="경기">경기</option>
        <option value="강원">강원</option>
        <option value="충북">충북</option>
        <option value="충남">충남</option>
        <option value="전북">전북</option>
        <option value="전남">전남</option>
        <option value="경북">경북</option>
        <option value="경남">경남</option>
        <option value="제주">제주</option>

      </select>

    </div>

    <div
      id="resultCount"
      class="result-count"
    ></div>

    <div
      id="results"
      class="results"
    ></div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>


  <script src="js/percentile-chart.js"></script>
  <script>

    const searchInput =
      document.getElementById("searchInput");

    const regionSelect =
      document.getElementById("regionSelect");

    const results =
      document.getElementById("results");

    const resultCount =
      document.getElementById("resultCount");


    let searchTimer = null;

    let latestSearchNumber = 0;


    function escapeHtml(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    let percentileIndex = null;
    let percentileLoadError = false;
    const normalize = value => String(value ?? "").normalize("NFKC").replace(/\s/g, "");
    function normalizeRegion(value) {
      const name = normalize(value).replace(/교육청$/, "").replace(/특별자치도|특별자치시|특별시|광역시/g, "");
      return ({경기도:"경기",강원도:"강원",충청북도:"충북",충청남도:"충남",전라북도:"전북",전라남도:"전남",경상북도:"경북",경상남도:"경남"})[name] || name;
    }
    function normalizeOffice(value, region) {
      let name = normalize(value).replace(/교육지원청$|교육청$/, "");
      if (region && name.startsWith(region)) name = name.slice(region.length);
      return name.replace(/특별자치도|특별자치시|특별시|광역시/g, "");
    }
    const percentileReady = fetch("data/percentiles-2023-2025.json")
      .then(response => { if (!response.ok) throw new Error("백분위 자료 로딩 실패"); return response.json(); })
      .then(data => {
        percentileIndex = new Map();
        data.rows.forEach(row => {
          const key = normalizeRegion(row.region) + "|" + normalize(row.name);
          if (!percentileIndex.has(key)) percentileIndex.set(key, []);
          percentileIndex.get(key).push(row);
        });
      }).catch(() => { percentileLoadError = true; });

    function renderPercentiles(school) {
      const region = normalizeRegion(school.sido_standard || school.sido);
      let candidates = percentileIndex?.get(region + "|" + normalize(school.school_name)) || [];
      const office = normalizeOffice(school.support_office, region);
      if (candidates.length > 1 && office) candidates = candidates.filter(row => normalizeOffice(row.office, region) === office);
      if (candidates.length > 1 && school.address) candidates = candidates.filter(row => normalize(row.address) === normalize(school.address));
      const row = candidates.length === 1 ? candidates[0] : null;
      const fallback = percentileLoadError ? "불러오기 실패" : candidates.length > 1 ? "학교 확인 필요" : "자료 없음";
      const cells = [2023, 2024, 2025].map((year, i) => {
        const value = row?.percentiles[i];
        const label = typeof value === "number" && Number.isFinite(value) ? value.toFixed(1) + "%" : fallback;
        return `<div class="percentile-cell"><span class="percentile-year">${year}</span><span class="percentile-value">${label}</span></div>`;
      }).join("");
      return `<section aria-label="연도별 배구지수 백분위"><div class="percentile-note">연도별 배구지수 백분위</div><div class="percentile-grid">${cells}</div>${row && row.percentiles.some(v => typeof v === "number") ? percentileChart(row.percentiles) : ""}<p class="percentile-note">출처: 2025 배구지수 편집본 · 연도별 조사 문항과 참여 학교가 달라 단순 증감 비교에 유의하세요.</p></section>`;
    }

    function renderSchools(
      schools,
      totalCount
    ) {

      results.innerHTML = "";

      if (totalCount > 20) {

        resultCount.textContent =
          `검색 결과 ${totalCount.toLocaleString()}개 · 최대 20개 표시`;

      } else {

        resultCount.textContent =
          `검색 결과 ${totalCount.toLocaleString()}개`;
      }


      if (schools.length === 0) {

        results.innerHTML = `
          <div class="empty">
            검색 결과가 없습니다.
          </div>
        `;

        return;
      }


      schools.forEach(
        school => {

          const card =
            document.createElement("div");

          card.className =
            "school-card";


          const schoolId =
            encodeURIComponent(
              school.school_id
            );


          const region =
            school.sido_standard ||
            school.sido ||
            "";


          card.innerHTML = `

            <div class="region-badge">
              ${escapeHtml(region)}
            </div>

            <div class="school-name">
              ${escapeHtml(
                school.school_name
              )}
            </div>

            <div class="school-meta">

              ${escapeHtml(
                school.support_office || ""
              )}

              <br>

              ${escapeHtml(
                school.address || ""
              )}

            </div>


            ${renderPercentiles(school)}

            <div class="school-actions">

              <a
                class="
                  school-button
                  view-button
                "
                href="https://cafe.naver.com/bluey9t7i" target="_blank" rel="noopener noreferrer"
              >
                상세열람
              </a>


              <a
                class="
                  school-button
                  exchange-button
                "
                href="https://open.kakao.com/o/gJyJ14Si" target="_blank" rel="noopener noreferrer"
              >
                실시간 정보교류
              </a>

            </div>
          `;


          results.appendChild(card);
        }
      );
    }


    async function searchSchools() {

      const keyword =
        searchInput.value.trim();

      const region =
        regionSelect.value;


      if (
        keyword === "" &&
        region === ""
      ) {

        resultCount.textContent = "";

        results.innerHTML = "";

        return;
      }


      const currentSearchNumber =
        ++latestSearchNumber;


      resultCount.textContent =
        "검색 중...";


      try {

        let query =
          supabaseClient
            .from("schools")
            .select(
              `
                school_id,
                school_name,
                sido,
                sido_standard,
                support_office,
                address,
                establishment,
                status
              `,
              {
                count: "exact"
              }
            )
            .eq(
              "status",
              "운영"
            );


        if (keyword !== "") {

          query =
            query.ilike(
              "school_name",
              `%${keyword}%`
            );
        }


        if (region !== "") {

          query =
            query.eq(
              "sido_standard",
              region
            );
        }


        const {
          data: schools,
          count,
          error
        } =
          await query
            .order(
              "school_name"
            )
            .limit(20);


        if (
          currentSearchNumber !==
          latestSearchNumber
        ) {

          return;
        }


        if (error) {

          throw error;
        }


        await percentileReady;
        if (currentSearchNumber !== latestSearchNumber) return;

        renderSchools(
          schools || [],
          count || 0
        );

      } catch (error) {

        console.error(
          "학교 검색 오류:",
          error
        );


        resultCount.textContent = "";


        results.innerHTML = `
          <div class="empty">
            학교 검색 중 오류가 발생했습니다.
          </div>
        `;
      }
    }


    searchInput.addEventListener(
      "input",
      () => {

        clearTimeout(
          searchTimer
        );


        searchTimer =
          setTimeout(
            searchSchools,
            250
          );
      }
    );


    regionSelect.addEventListener(
      "change",
      searchSchools
    );

  </script>

<script src="js/visit-stats.js"></script>
</body>
</html>
