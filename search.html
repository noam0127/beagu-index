<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 검색 | 배구지수</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f7f8fa;color:#111}
.container{max-width:600px;margin:0 auto;padding:24px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:40px}
.back{border:0;background:none;color:inherit;font-size:24px;cursor:pointer;padding:0}.logo{font-size:15px;font-weight:700;color:#2563eb}
h1{font-size:32px;margin:0 0 10px;letter-spacing:-1.5px}.description{margin:0 0 28px;color:#666;line-height:1.6}
.search-box,.region-select{width:100%;padding:17px 18px;border:1px solid #ddd;border-radius:14px;font-size:16px;outline:none;background:white;color:#111}
.search-box:focus,.region-select:focus{border-color:#2563eb;outline:2px solid #bfdbfe}.region-select:disabled{color:#94a3b8}
.field-label{display:block;font-size:14px;color:#475569;font-weight:700;margin:0 0 8px}.field-group{margin-bottom:14px}.field-hint{font-size:13px;color:#64748b;line-height:1.5}
.search-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.search-tab{padding:14px 8px;border:1px solid #d7e0ee;background:white;color:#475569;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.search-tab[aria-selected="true"]{background:#2563eb;border-color:#2563eb;color:white}
.search-tab:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
[hidden]{display:none!important}
.result-count{font-size:14px;color:#777;margin:18px 2px 12px}
.results{display:flex;flex-direction:column;gap:12px}
.school-card{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 14px rgba(0,0,0,.05)}
.school-name{font-size:18px;font-weight:700;margin-bottom:8px}
.school-meta{font-size:14px;color:#666;line-height:1.6}
.region-badge{display:inline-block;margin-bottom:10px;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#2563eb;font-size:12px;font-weight:700}
.school-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:16px}
.school-button{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:13px 10px;font-size:14px;font-weight:700}
.view-button{background:#2563eb;color:white}
.empty{padding:40px 20px;text-align:center;color:#888}
.participation-bar{position:sticky;top:0;z-index:1000;padding:12px 16px;background:#f7f8fa;border-bottom:1px solid #e5e7eb}
.participation-link{display:block;max-width:552px;margin:0 auto;padding:14px 12px;border-radius:12px;background:#2563eb;color:#fff;text-align:center;text-decoration:none;font-size:16px;font-weight:700;line-height:1.5;word-break:keep-all}
.participation-link:hover{background:#1d4ed8}.participation-link:focus-visible{outline:3px solid #111;outline-offset:3px}
.percentile-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 8px}
.percentile-cell{padding:12px 4px;background:#f1f5f9;border-radius:10px;text-align:center}
.percentile-year{display:block;font-size:12px;color:#64748b;margin-bottom:6px}
.percentile-value{font-size:16px;font-weight:700;color:#1e40af}
.percentile-notes{padding-left:20px}
    .percentile-note{font-size:12px;color:#64748b;line-height:1.6;margin:6px 0}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 30px}
.pager button{background:#fff;color:#1d4ed8;border:1px solid #cbd5e1;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}.pager span{font-size:13px;color:#64748b;white-space:nowrap}

.percentile-cell{min-width:0}
.percentile-value{overflow-wrap:anywhere;font-size:clamp(12px,2.1vw,16px)}
.percentile-cell.percentile-locked{background:#eaf0fb;border:1px solid #d2def4}
.percentile-cell.percentile-locked .percentile-value{display:block;color:#47658d;font-weight:700}.percentile-cell.percentile-locked .percentile-value::before{content:'▦ ▥ ▦';display:block;letter-spacing:3px;font-size:18px;line-height:1.2;filter:blur(2.5px);color:#8296b6;margin-bottom:4px}
@media(max-width:480px){.percentile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.percentile-value{font-size:15px}}
</style>
  <link rel="stylesheet" href="styles/school-search-card-v1.css?v=20261031-independent5">
</head>
<body>
<header class="participation-bar">
<a class="participation-link" href="https://docs.google.com/forms/d/e/1FAIpQLSf3fY3b4amMyIpBLpU4tK69Bf3ZNVQ2r7eH2vBUUn0gxz7lYQ/viewform" target="_blank" rel="noopener noreferrer">2026 배구지수 조사 참여하기</a>
</header>
<main class="container">
<div class="topbar"><button type="button" class="back" onclick="history.back()" aria-label="뒤로가기">←</button><div class="logo">VOLLEYBALL INDEX</div></div>
<h1>학교를 찾아보세요</h1>
<p class="description">전국 초등학교를 학교명과 지역으로 검색할 수 있습니다.</p>
<div class="search-tabs" role="tablist" aria-label="찾기 방법">
  <button type="button" class="search-tab" id="schoolTab" role="tab" aria-selected="true" aria-controls="schoolPanel">학교별 찾기</button>
  <button type="button" class="search-tab" id="regionTab" role="tab" aria-selected="false" aria-controls="regionPanel">지역 찾기</button>
</div>
<section id="schoolPanel" role="tabpanel" aria-labelledby="schoolTab">
  <label class="field-label" for="searchInput">학교명 검색</label>
  <input id="searchInput" class="search-box" type="search" placeholder="예: 개원초, 서울개원초등학교" autocomplete="off">
</section>
<section id="regionPanel" role="tabpanel" aria-labelledby="regionTab" hidden>
  <div class="field-group"><label class="field-label" for="regionSelect">1. 시도 선택</label>
    <select id="regionSelect" class="region-select">
      <option value="">17개 시도·재외한국학교 선택</option>
      <option>서울</option><option>부산</option><option>대구</option><option>인천</option><option>광주</option><option>대전</option><option>울산</option><option>세종</option><option>경기</option><option>강원</option><option>충북</option><option>충남</option><option>전북</option><option>전남</option><option>경북</option><option>경남</option><option>제주</option><option value="재외한국학교">재외한국학교</option>
    </select>
  </div>
  <div class="field-group"><label class="field-label" for="officeSelect">2. 교육지원청 / 국가 선택</label>
    <select id="officeSelect" class="region-select" disabled><option value="">시도를 먼저 선택하세요</option></select>
  </div>
  <p class="field-hint">시도를 선택하면 해당 지역 학교를, 교육지원청을 선택하면 관할 학교를 볼 수 있습니다.</p>
</section>
<div id="resultCount" class="result-count" aria-live="polite"></div>
<div id="results" class="results"></div>
<div id="pager" class="pager" hidden>
<button id="prevPage" type="button">이전</button><span id="pageInfo" aria-live="polite"></span><button id="nextPage" type="button">다음</button>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/percentile-chart.js?v=20261031-independent5b"></script>
<script src="js/master-percentiles-v1.2.js?v=20261031-1350"></script>
  <script src="js/school-search-card-v1.js?v=20261031-independent5"></script>
<script>
  const searchInput = document.getElementById('searchInput');
  const regionSelect = document.getElementById('regionSelect');
  const officeSelect = document.getElementById('officeSelect');
  const schoolTab = document.getElementById('schoolTab');
  const regionTab = document.getElementById('regionTab');
  const schoolPanel = document.getElementById('schoolPanel');
  const regionPanel = document.getElementById('regionPanel');
  const results = document.getElementById('results');
  const resultCount = document.getElementById('resultCount');
  const pager = document.getElementById('pager');
  const pageInfo = document.getElementById('pageInfo');
  const prevPage = document.getElementById('prevPage');
  const nextPage = document.getElementById('nextPage');
  const PAGE_SIZE = 20;
  let mode = 'school';
  let page = 0;
  let searchTimer = null;
  let searchSerial = 0;

  // Derived from public.schools.support_office in the project database.
  // The option value is constructed to match the database exactly.
  const OFFICE_NAMES = {
    '서울':'강남서초 강동송파 강서양천 남부 동부 동작관악 북부 서부 성동광진 성북강북 중부',
    '부산':'남부 동래 북부 서부 해운대',
    '대구':'군위 남부 달성 동부 서부',
    '인천':'강화 남부 동부 북부 서부',
    '광주':'동부 서부',
    '대전':'동부 서부',
    '울산':'강남 강북',
    '세종':'세종',
    '경기':'가평 고양 광명 광주하남 구리남양주 군포의왕 김포 동두천양주 부천 성남 수원 시흥 안산 안성 안양과천 양평 여주 연천 용인 의정부 이천 파주 평택 포천 화성오산',
    '강원':'강릉 고성 동해 삼척 속초양양 양구 영월 원주 인제 정선 철원 춘천 태백 평창 홍천 화천 횡성',
    '충북':'괴산증평 단양 보은 영동 옥천 음성 제천 진천 청주 충주',
    '충남':'공주 금산 논산계룡 당진 보령 부여 서산 서천 아산 예산 천안 청양 태안 홍성',
    '전북':'고창 군산 김제 남원 무주 부안 순창 완주 익산 임실 장수 전주 정읍 진안',
    '전남':'강진 고흥 곡성 광양 구례 나주 담양 목포 무안 보성 순천 신안 여수 영광 영암 완도 장성 장흥 진도 함평 해남 화순',
    '경북':'경산 경주 고령 구미 김천 문경 봉화 상주 성주 안동 영덕 영양 영주 영천 예천 울릉 울진 의성 청도 청송 칠곡 포항',
    '경남':'거제 거창 고성 김해 남해 밀양 사천 산청 양산 의령 진주 창녕 창원 통영 하동 함안 함양 합천',
    '제주':'서귀포시 제주시'
  };
  const OFFICE_PREFIX = {
    '서울':'서울특별시','부산':'부산광역시','대구':'대구광역시','인천':'인천광역시',
    '광주':'전남광주통합특별시광주','대전':'대전광역시','울산':'울산광역시',
    '경기':'경기도','강원':'강원특별자치도','충북':'충청북도','충남':'충청남도',
    '전북':'전북특별자치도','전남':'전남광주통합특별시','경북':'경상북도','경남':'','제주':''
  };
  const LEGACY_GYEONGNAM = [
    ['마산 (과거 분류)','마산교육청(폐지)'],
    ['진해 (과거 분류)','진해교육청(폐지)'],
    ['창원 (과거 분류)','창원교육청(폐지)']
  ];

  function populateOffices(region) {
    officeSelect.replaceChildren(new Option(region ? '전체 교육지원청' : '시도를 먼저 선택하세요', ''));
    officeSelect.disabled = !region;
    if (!region) return;
    if (region === '재외한국학교') {
      ["일본","중국","대만","베트남","사우디아라비아","인도네시아","싱가포르","태국","필리핀","파라과이","아르헨티나","러시아","이란","이집트","말레이시아","캄보디아"].forEach(country => officeSelect.add(new Option(country, country)));
      return;
    }
    if (region === '세종') {
      officeSelect.add(new Option('세종시교육청', '세종특별자치시교육청'));
      return;
    }
    const prefix = OFFICE_PREFIX[region] || '';
    const names = (OFFICE_NAMES[region] || '').split(' ').filter(Boolean);
    names.forEach(name => officeSelect.add(new Option(name, prefix + name + '교육지원청')));
    if (region === '경남') LEGACY_GYEONGNAM.forEach(([label,value]) => officeSelect.add(new Option(label,value)));
  }

  function selectMode(target) {
    mode = target;
    schoolPanel.hidden = target !== 'school';
    regionPanel.hidden = target !== 'region';
    schoolTab.setAttribute('aria-selected', String(target === 'school'));
    regionTab.setAttribute('aria-selected', String(target === 'region'));
    loadSchools(true);
  }

  const escapeHtml = value => String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const normalize = value => String(value ?? '').normalize('NFKC').replace(/\s/g,'');
  const normalizeRegion = value => {
    const name=normalize(value).replace(/교육청$/,'').replace(/특별자치도|특별자치시|특별시|광역시/g,'');
    return ({경기도:'경기',강원도:'강원',충청북도:'충북',충청남도:'충남',전라북도:'전북',전라남도:'전남',경상북도:'경북',경상남도:'경남'})[name] || name;
  };
  const normalizeOffice = (value,region) => {
    let name=normalize(value).replace(/교육지원청$|교육청$/,'');
    if (region && name.startsWith(region)) name=name.slice(region.length);
    return name.replace(/특별자치도|특별자치시|특별시|광역시/g,'');
  };

  let percentileIndex = new Map();
  let percentileLoadError = false, percentileStaticLoaded = false;
  const percentileReady = fetch('data/public-lv0-percentiles-v1.2.json?v=20261031-empirical2025', {cache:'no-cache'})
    .then(r => { if (!r.ok) throw new Error('백분위 자료 로딩 실패'); return r.json(); })
    .then(data => { percentileIndex = BeaguPublic.buildIndex(data); percentileStaticLoaded = true; })
    .catch(error => { percentileLoadError=true; console.warn('공개 백분위 파일 미응답, DB 재조회 사용',error); });
  // If mobile Safari/CDN cannot load the 750 KB static index, recover from the
  // separately approved public annual Supabase table, 20 visible schools at a time.
  async function recoverPublishedPercentiles(schools) {
    if (percentileStaticLoaded || !schools.length) return;
    const ids=[...new Set(schools.map(s=>String(s.school_id)).filter(id=>/^\d{7}$/.test(id)))];
    if (!ids.length) return;
    const {data,error}=await supabaseClient.from('beagu_school_report_yearly')
      .select('school_id,survey_year,percentile')
      .in('school_id',ids).eq('publication_status','PUBLISHED').in('survey_year',[2023,2024,2025])
      .limit(100);
    if (error) throw error;
    for (const id of ids) {
      const p=[null,null,null], statuses=['NO_PUBLISHED_VALUE','NO_PUBLISHED_VALUE','NO_PUBLISHED_VALUE'];
      for (const item of data||[]) {
        if (String(item.school_id)!==id) continue;
        const index=[2023,2024,2025].indexOf(Number(item.survey_year));
        const value=Number(item.percentile);
        if(index>=0&&Number.isFinite(value)&&value>=0&&value<=100){
          p[index]=value; statuses[index]='EXISTING_PUBLIC_VALUE_PRESERVED';
        }
      }
      percentileIndex.set(id,{school_id:id,percentiles:p,statuses});
    }
    percentileLoadError=false;
  }

  function renderPercentiles(school) {
    const row=percentileIndex.get(String(school.school_id));
    return BeaguSchoolSearchCard.percentiles({
      publicValues:BeaguPublic.values(row),
      statuses:row?.statuses || [],
      publicError:percentileLoadError,
      locked:true
    });
  }

  function renderSchools(schools,total) {
    results.replaceChildren();
    const start=total ? page*PAGE_SIZE+1 : 0;
    const end=total ? start+schools.length-1 : 0;
    resultCount.textContent=total>PAGE_SIZE
      ? `검색 결과 ${total.toLocaleString()}개 · ${start}~${end}번째 표시`
      : `검색 결과 ${total.toLocaleString()}개`;
    const pages=Math.ceil(total/PAGE_SIZE);
    pager.hidden=pages<=1;
    pageInfo.textContent=`${page+1} / ${pages} 페이지`;
    prevPage.disabled=page===0;
    nextPage.disabled=page+1>=pages;
    if (!schools.length) {
      results.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }
    schools.forEach(school => {
      const {card}=BeaguSchoolSearchCard.createCard(school,{
        level:0,
        percentile:renderPercentiles(school)
      });
      const link=card.querySelector('.view-button');
      if(link)link.addEventListener('click',event=>{
        window.BeaguSearchTelemetry?.selected(String(school.school_id),0,'search',event);
      });
      results.appendChild(card);
    });
  }

  async function loadSchools(resetPage=true,explicitEnter=false) {
    if (resetPage) page=0;
    const keyword=mode==='school' ? searchInput.value.trim() : '';
    const region=mode==='region' ? regionSelect.value : '';
    const office=mode==='region' ? officeSelect.value : '';
    const token=++searchSerial;
    if ((mode==='school' && !keyword) || (mode==='region' && !region)) {
      results.replaceChildren();resultCount.textContent='';pager.hidden=true;return;
    }
    resultCount.textContent='검색 중...';pager.hidden=true;
    try {
      let query=supabaseClient.from('schools')
        .select('school_id,school_name,sido,sido_standard,support_office,address,establishment,status',{count:'exact'})
        .eq('status','운영');
      if (keyword) query=query.ilike('school_name',`%${keyword}%`);
      if (region) query=query.eq('sido_standard',region);
      if (office) query=query.eq('support_office',office);
      const from=page*PAGE_SIZE;
      const {data,count,error}=await query
  .order('address', {ascending:true, nullsFirst:false})
  .order('school_name', {ascending:true})
  .range(from, from+PAGE_SIZE-1);
      if (token!==searchSerial) return;
      if (error) throw error;
      await percentileReady;
      if (token!==searchSerial) return;
      if (!percentileStaticLoaded) {
        try { await recoverPublishedPercentiles(data||[]); }
        catch(e) { percentileLoadError=true; console.warn('공개 백분위 DB 조회 실패',e); }
      }
      if (token!==searchSerial) return;
      if(explicitEnter&&keyword&&count===1&&Array.isArray(data)&&data.length===1)
        window.BeaguSearchTelemetry?.searchConfirmed(String(data[0].school_id),0,'search');
      renderSchools(data || [],count || 0);
    } catch (error) {
      if (token!==searchSerial) return;
      console.error('학교 검색 오류:',error);
      resultCount.textContent='';pager.hidden=true;
      results.innerHTML='<div class="empty">학교 검색 중 오류가 발생했습니다.</div>';
    }
  }

  schoolTab.addEventListener('click',()=>selectMode('school'));
  regionTab.addEventListener('click',()=>selectMode('region'));
  regionSelect.addEventListener('change',()=>{populateOffices(regionSelect.value);loadSchools(true);});
  officeSelect.addEventListener('change',()=>loadSchools(true));
  searchInput.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadSchools(true),250);});
  searchInput.addEventListener('keydown',event=>{
    if(event.key!=='Enter'||event.isComposing||!searchInput.value.trim())return;
    event.preventDefault();clearTimeout(searchTimer);void loadSchools(true,true);
  });
  prevPage.addEventListener('click',()=>{if(page>0){page-=1;loadSchools(false);}});
  nextPage.addEventListener('click',()=>{page+=1;loadSchools(false);});
</script>
