<title>TEST 비밀번호 재설정 · 배구인덱스</title>
<style>body{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;background:#f7f8fa;margin:0;padding:20px;color:#1d2737}main{max-width:480px;margin:10vh auto;background:#fff;border-radius:18px;padding:25px;box-shadow:0 4px 20px #10203012}label{display:block;margin:18px 0 7px;font-weight:bold}input,button{font:inherit;width:100%;padding:13px;border-radius:12px}input{border:1px solid #cbd5e1}button{border:0;background:#2563eb;color:#fff;margin-top:15px;cursor:pointer}p{color:#546375}#status{margin-top:18px}small{color:#6b7280}</style>
<script defer src="./config.js"></script><script defer src="./recover.js"></script></head>
<body><main><strong>배구인덱스 TEST</strong><h1>비밀번호 재설정</h1>
<p>테스트 이메일로 발급된 일회용 복구 링크에서만 사용할 수 있습니다.</p>
<form id="form" hidden>
<label for="pw">새 비밀번호 (12자 이상)</label><input id="pw" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="pw2">비밀번호 확인</label><input id="pw2" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button type="submit">새 비밀번호 설정</button></form>
<p id="status" role="status">복구 링크를 확인 중입니다.</p>
<a href="./index.html">테스트 로그인 화면</a>
</main></body></html>
