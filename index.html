<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배구지수 챌린지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.2;
      margin: 0 0 20px;
      letter-spacing: -2px;
    }

    .description {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    .card p {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.6;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
  
    .participation-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e5e7eb;
    }
    .participation-link {
      display: block;
      max-width: 552px;
      margin: 0 auto;
      padding: 14px 12px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
    }
    .participation-link:hover { background: #1d4ed8; }
    .participation-link:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }

    .survey-totals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 20px;
      padding: 16px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      text-align: center;
    }
    .survey-totals > div { min-width: 0; }
    .survey-totals dt { font-size: 13px; color: #666; margin-bottom: 6px; }
    .survey-totals dd { margin: 0; color: #2563eb; font-weight: 700; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .survey-total-number { font-size: clamp(22px, 6vw, 28px); }
    .survey-total-unit { font-size: 13px; margin-left: 3px; }
    @media (max-width: 600px) {
      .container { padding-top: 28px; }
      .logo { margin-bottom: 22px; }
      .description { margin-bottom: 22px; }
    }
  </style>
  <link rel="stylesheet" href="styles/challenge-progress-v1.css?v=20261117-minimal2">
</head>

<body>

  <header class="participation-bar">
    <a class="participation-link" href="https://forms.gle/TPyCakK6Sj2zchRy7" target="_blank" rel="noopener noreferrer">2026 배구지수 조사 참여하기</a>
  </header>


  <main class="container">

    <div class="logo">VOLLEYBALL INDEX</div>

    <h1>
      배구지수<br>챌린지
    </h1>


    <!-- 고정 누적 조사 통계: 수치 변경 시 아래 숫자만 수정합니다. 방문 통계와 별개입니다. -->
    <dl class="survey-totals" aria-label="누적 조사 통계">
      <div>
        <dt>누적 참여자</dt>
        <dd><span class="survey-total-number">18,797</span><span class="survey-total-unit">명</span></dd>
      </div>
      <div>
        <dt>누적 참여교</dt>
        <dd><span class="survey-total-number">4,177</span><span class="survey-total-unit">개교</span></dd>
      </div>
    </dl>

    <section class="beagu-xp" data-beagu-xp data-xp-state="loading" aria-label="2026년 챌린지 목표 달성률">
      <div class="beagu-xp-head"><h2>2026 챌린지 XP · 목표 1,000명</h2><strong class="beagu-xp-number" data-xp-number aria-live="polite">순번 확인 중</strong></div>
      <div class="beagu-xp-track"><div class="beagu-xp-fill" data-xp-progress role="progressbar" aria-label="챌린지 진행률" aria-valuemin="0" aria-valuemax="1000"></div></div>
      <div class="beagu-xp-footer"><span class="beagu-sr-only" data-xp-state>챌린지 집계 확인 중</span><strong data-xp-remainder>확인 중</strong></div>
      <p class="beagu-xp-promise"><strong>1,000명 달성 시 2026 배구지수 자료를 공개합니다.</strong></p>
    </section>

    <section class="card" style="margin-top:20px" aria-label="방문 통계">
      <h2>방문한 선생님</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center">
        <div>오늘 방문자<br><strong data-stat="today" aria-live="polite">집계 중</strong></div>
        <div>월간 방문자<br><strong data-stat="month" aria-live="polite">집계 중</strong></div>
        <div>누적 방문자<br><strong data-stat="total" aria-live="polite">집계 중</strong></div>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/visit-stats.js?v=20261117-visitfix1"></script>
<script src="js/challenge-progress-v1.js?v=20261117-goal1000"></script>
</body>
</html>
