<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배구지수 챌린지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.2;
      margin: 0 0 20px;
      letter-spacing: -2px;
    }

    .description {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    .card p {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.6;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
  
    .participation-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e5e7eb;
    }
    .participation-link {
      display: block;
      max-width: 552px;
      margin: 0 auto;
      padding: 14px 12px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
    }
    .participation-link:hover { background: #1d4ed8; }
    .participation-link:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }

    .reading-cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .reading-card { border: 1px solid #e5e7eb; min-width: 0; }
    .reading-card-basic { background: #eff6ff; border: 2px solid #2563eb; padding: 27px 21px; }
    .reading-card h2 { display: flex; align-items: center; gap: 10px; font-size: 21px; line-height: 1.4; }
    .level-icon { width: 25px; height: 25px; flex: 0 0 25px; color: #2563eb; }
    .reading-card .level-description { font-size: 14px; margin: 0 0 18px; overflow-wrap: anywhere; }
    .level-description a { color: #1d4ed8; text-decoration: underline; text-underline-offset: 3px; }
    .reading-button { display: block; width: 100%; padding: 16px; border-radius: 12px; background: #eef2ff; color: #1d4ed8; font-size: 17px; font-weight: 700; line-height: 1.5; text-align: center; text-decoration: none; }
    .reading-card-basic .reading-button { background: #2563eb; color: #fff; }
    .reading-button:hover { background: #dbeafe; }
    .reading-card-basic .reading-button:hover { background: #1d4ed8; }
    .reading-button:focus-visible, .level-description a:focus-visible { outline: 3px solid #111; outline-offset: 3px; }

    .survey-totals {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 20px;
      padding: 16px 12px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      text-align: center;
    }
    .survey-totals > div { min-width: 0; }
    .survey-totals dt { font-size: 13px; color: #666; margin-bottom: 6px; }
    .survey-totals dd { margin: 0; color: #2563eb; font-weight: 700; line-height: 1.3; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .survey-total-number { font-size: clamp(22px, 6vw, 28px); }
    .survey-total-unit { font-size: 13px; margin-left: 3px; }
    @media (max-width: 600px) {
      .container { padding-top: 28px; }
      .logo { margin-bottom: 22px; }
      .description { margin-bottom: 22px; }
    }
  </style>
</head>

<body>

  <header class="participation-bar">
    <a class="participation-link" href="https://indischool.com/boards/together/37612156" target="_blank" rel="noopener noreferrer">배구지수 조사하고 참여코드 획득</a>
  </header>


  <main class="container">

    <div class="logo">VOLLEYBALL INDEX</div>

    <h1>
      배구지수<br>챌린지
    </h1>

    <p class="description">
      전국 초등교사 학교정보 공동조사<br>선생님의 경험이 다른 선생님의 선택을 돕습니다.
    </p>

    <!-- 고정 누적 조사 통계: 수치 변경 시 아래 숫자만 수정합니다. 방문 통계와 별개입니다. -->
    <dl class="survey-totals" aria-label="누적 조사 통계">
      <div>
        <dt>누적 참여자</dt>
        <dd><span class="survey-total-number">18,797</span><span class="survey-total-unit">명</span></dd>
      </div>
      <div>
        <dt>누적 참여교</dt>
        <dd><span class="survey-total-number">4,177</span><span class="survey-total-unit">개교</span></dd>
      </div>
    </dl>

    <div class="reading-cards" aria-label="레벨별 배구지수 열람">
      <section class="card reading-card reading-card-basic" aria-labelledby="level-0-title">
        <h2 id="level-0-title"><svg class="level-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 11V7a5 5 0 0 1 9.6-2"/><rect x="4" y="11" width="16" height="11" rx="2"/><path d="M12 15v3"/></svg><span>Lv.0 기본 열람</span></h2>
        <p class="level-description">누구나 이용 가능 · 참여코드 불필요</p>
        <a class="reading-button" href="search.html">바로 열람하기</a>
      </section>
      <section class="card reading-card" aria-labelledby="level-1-title">
        <h2 id="level-1-title"><svg class="level-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="11" width="16" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4M12 15v3"/></svg><span>Lv.1 참여자 열람</span></h2>
        <p class="level-description"><a href="https://indischool.com/boards/together/37612156" target="_blank" rel="noopener noreferrer">조사참여시</a> 참여코드 발급</p>
        <a class="reading-button" href="search-lv1.html">Lv.1 열람하기</a>
      </section>
      <section class="card reading-card" aria-labelledby="level-2-title">
        <h2 id="level-2-title"><svg class="level-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6Z"/><path d="m8 12 3 3 5-6"/></svg><span>Lv.2 교사 인증 열람</span></h2>
        <p class="level-description"><a href="https://cafe.naver.com/bluey9t7i" target="_blank" rel="noopener noreferrer">네이버카페</a>에서 참여코드 발급</p>
        <a class="reading-button" href="search-lv2.html">Lv.2 열람하기</a>
      </section>
    </div>

    <section class="card" style="margin-top:20px" aria-label="방문 통계">
      <h2>함께 찾아온 선생님들</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center">
        <div>오늘 방문자<br><strong data-stat="today">집계 중</strong></div>
        <div>월간 방문자<br><strong data-stat="month">집계 중</strong></div>
        <div>누적 방문자<br><strong data-stat="total">집계 중</strong></div>
      </div>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/visit-stats.js"></script>
</body>
</html>
