<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배구지수 챌린지</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif;
      background: #f7f8fa;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.2;
      margin: 0 0 20px;
      letter-spacing: -2px;
    }

    .description {
      font-size: 18px;
      line-height: 1.7;
      color: #555;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    .card h2 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    .card p {
      margin: 0 0 24px;
      color: #666;
      line-height: 1.6;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
  
    .participation-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 12px 16px;
      background: #f7f8fa;
      border-bottom: 1px solid #e5e7eb;
    }
    .participation-link {
      display: block;
      max-width: 552px;
      margin: 0 auto;
      padding: 14px 12px;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      word-break: keep-all;
    }
    .participation-link:hover { background: #1d4ed8; }
    .participation-link:focus-visible {
      outline: 3px solid #111;
      outline-offset: 3px;
    }
  </style>
</head>

<body>

  <header class="participation-bar">
    <a class="participation-link" href="https://indischool.com/boards/together/37612156" target="_blank" rel="noopener noreferrer">배구지수 조사하고 참여코드 획득</a>
  </header>


  <main class="container">

    <div class="logo">VOLLEYBALL INDEX</div>

    <h1>
      배구지수<br>챌린지
    </h1>

    <p class="description">
      전국 초등교사 학교정보 공동조사<br>선생님의 경험이 다른 선생님의 선택을 돕습니다.
    </p>

    <section class="card">
      <h2>학교 배구지수 찾기</h2>

      <p>
        학교를 검색하여 공개된 배구지수 정보를 확인하세요.
      </p>

      <button type="button" onclick="window.location.href='search.html'">
        배구지수 열람하기
      </button>
    </section>

    <section class="card" style="margin-top:20px" aria-label="방문 통계">
      <h2>함께 찾아온 선생님들</h2>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center">
        <div>오늘 방문자<br><strong data-stat="today">집계 중</strong></div>
        <div>월간 방문자<br><strong data-stat="month">집계 중</strong></div>
        <div>누적 방문자<br><strong data-stat="total">집계 중</strong></div>
      </div>
      <p style="font-size:12px;margin:16px 0 0">한국 시간 기준 · 동일 브라우저 중복 제외 · 집계 시작 이후 기록<br>방문 통계를 위해 무작위 브라우저 식별자와 방문 시각을 저장합니다.</p>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/visit-stats.js"></script>
</body>
</html>
