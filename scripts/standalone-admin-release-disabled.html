<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>업데이트 관리 · 독립 시험 웹 (읽기 전용)</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f7fb;color:#18314d;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
    main{max-width:740px;margin:7vh auto 9rem;padding:0 22px}
    .panel{background:white;border:1px solid #d9e4f1;border-radius:20px;padding:32px;box-shadow:0 9px 24px #1d407b0a}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#3663a6}
    h1{font-size:clamp(24px,5vw,35px);margin:13px 0 15px;line-height:1.3}
    p{line-height:1.8;margin:13px 0;color:#415675}
    a{color:#1555a8;font-weight:750}
    .banner{border:1px solid #d6e4f7;background:#f0f6ff;border-radius:12px;padding:13px 15px}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <p class="eyebrow">INDEPENDENT STAGING / READ-ONLY</p>
    <h1>업데이트 관리 · 읽기 전용</h1>
    <p>이 페이지는 Vercel을 사용하지 않는 독립 시험 웹입니다.
       운영 웹의 배포·되돌리기·버전 등록 명령을 이곳에서 실행하지 않습니다.</p>
    <p class="banner" role="status"><strong>배포 명령 비활성화</strong><br>
       관리형 배포 작업과 운영 배포 승인은 별도 관리자 시스템에서만 처리합니다.</p>
    <p>시험 인증과 화면 동작은 <a href="/admin.html">시험 관리자 로그인 화면</a>에서 확인할 수 있습니다.
       실제 웹과 데이터베이스는 변경하지 않습니다.</p>
    <p><a href="/index.html">시험 웹 홈으로</a></p>
  </section>
</main>
</body>
</html>
