<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fa">
<title>참여 인증 | 2026 배구지수 챌린지</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-light: #eff6ff;
    --ink: #14233e;
    --muted: #52627c;
    --line: #dce4ef;
    --background: #f7f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    line-height: 1.6;
    word-break: keep-all;
  }
  main { max-width: 620px; margin: 0 auto; padding: 22px 18px 64px; }
  a, button { -webkit-tap-highlight-color: transparent; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand { color: var(--blue); font-weight: 800; font-size: 12px; letter-spacing: .06em; }
  .backlink { color: var(--muted); text-decoration: none; font-size: 13px; }
  .backlink:hover { color: var(--blue-dark); }

  .certificate {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 28px 22px 25px;
    text-align: center;
    box-shadow: 0 6px 24px rgba(16, 41, 75, .05);
  }
  .trophy { font-size: 43px; line-height: 1.3; }
  .certificate h1 { font-size: 26px; line-height: 1.3; letter-spacing: -1px; margin: 10px 0 5px; }
  .subtitle { color: #63728b; font-size: 14px; }
  .thanks { font-size: 14px; color: var(--muted); margin: 16px 0 0; }
  .rank { background: #eef4ff; border-radius: 16px; padding: 18px 12px; margin: 20px 0; }
  .rank-label { color: var(--muted); font-size: 13px; display: block; }
  .rank strong { display: block; color: var(--blue-dark); font-size: clamp(31px, 8.5vw, 40px); letter-spacing: -1.4px; line-height: 1.35; margin: 4px 0; }
  .rank-foot { color: var(--muted); font-size: 12px; }
  .message { font-weight: 750; font-size: 18px; line-height: 1.55; margin: 12px 0 7px; }
  .body-copy { font-size: 13px; color: var(--muted); margin: 0 auto 12px; max-width: 420px; }
  .site-link { color: var(--blue-dark); font-weight: 650; font-size: 13px; text-decoration: none; }

  .steps { margin-top: 28px; }
  .section-title { margin: 0 0 3px; font-size: 21px; letter-spacing: -.5px; }
  .section-subtitle { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .step-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }
  .step-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .step-number { display: grid; place-items: center; flex: 0 0 28px; height: 28px; background: var(--blue-light); color: var(--blue-dark); border-radius: 50%; font-size: 14px; font-weight: 800; }
  .step-heading h3 { margin: 0; font-size: 16px; letter-spacing: -.2px; }
  .step-card p { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .action {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    min-height: 48px;
    padding: 12px 16px;
    border-radius: 11px;
    text-align: center;
    text-decoration: none;
    font: inherit;
    font-weight: 750;
    font-size: 15px;
    border: 1px solid transparent;
    cursor: pointer;
    background: var(--blue);
    color: #fff;
  }
  .action:hover { background: var(--blue-dark); }
  .action:disabled { opacity: .55; cursor: wait; }
  .action.secondary { color: var(--blue-dark); border-color: #bfcef1; background: #fff; }
  .action.secondary:hover { background: var(--blue-light); }
  .action.soft { background: #eef4ff; color: var(--blue-dark); border-color: #dae7ff; }
  .action.soft:hover { background: #e1edff; }
  #status { font-size: 12px; color: var(--muted); margin: 10px 0 0; }
  #retry { margin-top: 10px; }
  .small-note { color: #64748b; font-size: 12px; margin-top: 10px !important; margin-bottom: 0 !important; }
  .copy-fallback { font-size: 12px; color: var(--muted); margin: 8px 0 0 !important; }
  .copy-fallback a { color: var(--blue-dark); }

  .footer-links { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 22px; }
  .footer-links h2 { font-size: 16px; margin: 0 0 11px; }
  .footer-grid { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .footer-link { color: var(--muted); text-align: center; font-size: 13px; border: 1px solid var(--line); background: #fff; padding: 13px 10px; text-decoration: none; border-radius: 11px; font-weight: 650; }
  .footer-link:hover { color: var(--blue-dark); border-color: #a8bfef; }
  @media (max-width: 370px) {
    main { padding: 18px 14px 54px; }
    .certificate { padding: 24px 15px; }
    .certificate h1 { font-size: 23px; }
    .step-card { padding: 16px 14px; }
    .footer-grid { grid-template-columns: 1fr; }
  }
</style>

</head>
<body>
<main>
  <nav class="topbar" aria-label="페이지 탐색">
    <a href="index.html" class="beagu-brand-link" aria-label="배구인덱스 홈"><span class="beagu-brand-mark" aria-hidden="true">B</span><span class="beagu-brand-word">BAEGU INDEX</span></a>
    <a class="backlink" href="index.html">배구지수 홈으로 →</a>
  </nav>
<nav class="beagu-global-nav" aria-label="주요 메뉴"><a href="index.html">홈</a><a href="search.html">학교 검색</a><a href="statistics.html">통계표</a><a href="challenge.html" aria-current="page">참여 인증</a></nav>

  <!-- 인증서 저장 범위: 이 section 안의 내용만 이미지로 생성됩니다. -->
  <section class="certificate" id="certificate" aria-label="2026 배구지수 참여 인증서">
    <div class="trophy" aria-hidden="true">🏆</div>
    <h1>2026 배구지수 챌린지</h1>
    <div class="rank">
      <span class="rank-label">2026년 챌린지 참여 순번</span>
      <strong id="participantNo" aria-live="polite">순번 확인 중</strong>
    </div>
    <a class="site-link" href="https://baeguindex.com/">baeguindex.com</a>
  </section>

    <section class="beagu-xp" data-beagu-xp data-xp-state="loading" aria-label="2026년 챌린지 목표 달성률">
      <div class="beagu-xp-head"><h2>2026 챌린지 · 목표 1,000명</h2><strong class="beagu-xp-number" data-xp-number aria-live="polite">순번 확인 중</strong></div>
      <div class="beagu-xp-track"><div class="beagu-xp-fill" data-xp-progress role="progressbar" aria-label="챌린지 진행률" aria-valuemin="0" aria-valuemax="1000"></div></div>
      <div class="beagu-xp-footer"><span class="beagu-sr-only" data-xp-state>챌린지 집계 확인 중</span><strong data-xp-remainder>확인 중</strong></div>
      
    </section>
  <section class="steps" aria-labelledby="steps-title">
    <h2 class="section-title" id="steps-title">참여 인증</h2>

    <section class="step-card" aria-labelledby="step-1">
      <div class="step-heading"><span class="step-number" aria-hidden="true">1</span><h3 id="step-1">인증 이미지 저장</h3></div>
      <button class="action" id="capture" type="button" disabled>↓ 인증 이미지 저장하기</button>
      <p id="status" role="status" aria-live="polite">참여 순번을 확인하고 있습니다.</p>
      <button class="action secondary" id="retry" type="button" hidden>다시 시도하기</button>
    </section>

    <section class="step-card" aria-labelledby="step-2">
      <div class="step-heading"><span class="step-number" aria-hidden="true">2</span><h3 id="step-2">쫑알쫑알 인증</h3></div>
      <a class="action secondary" id="loungeLink" href="https://indischool.com/tweets/channels/lounge" target="_blank" rel="noopener noreferrer">인디스쿨 쫑알쫑알에서 인증하기 ↗</a>
    </section>

  </section>

</main>
