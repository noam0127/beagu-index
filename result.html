<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f7f8fa">
  <title>학교 결과 새 주소 안내 | 배구지수</title>
  <link rel="canonical" href="https://baeguindex.com/school-report.html">
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    *{box-sizing:border-box}
    body{background:#f7f8fa;color:#17233a;display:grid;min-height:100dvh;place-items:center;margin:0;padding:24px}
    main{width:min(100%,510px);background:white;border:1px solid #dfe6f0;border-radius:18px;padding:30px;box-shadow:0 8px 22px #1235650d}
    h1{font-size:24px;margin:0 0 15px}
    p{font-size:15px;line-height:1.75;color:#526079}
    a{color:#1d4ed8;font-weight:700}
    a:focus-visible{outline:3px solid #93c5fd;outline-offset:4px}
    .button{display:block;margin-top:22px;padding:14px;border-radius:12px;background:#2563eb;color:white;text-align:center;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>학교 결과 화면이 통합되었습니다</h1>
    <p>현재 학교별 조사 기록은 새로운 상세화면에서 제공합니다. 이전 주소로 접속하셨다면 동일한 학교의 최신 공개 화면으로 이동합니다.</p>
    <p>Lv.1·Lv.2 자료는 기존처럼 해당 화면에서 별도 인증이 필요하며, 승인되지 않은 데이터는 공개하지 않습니다.</p>
    <a id="continueLink" class="button" href="school-report.html">현재 학교 상세화면으로 이동</a>
    <p><small>자동 이동하지 않는 경우 위 버튼을 눌러 주세요.</small></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/visit-stats.js?v=20261031-1350"></script>
  <script>
  (()=>{
    'use strict';
    const params=new URLSearchParams(location.search);
    const school=params.get('school_id')||params.get('school');
    const destination=new URL('school-report.html',location.href);
    if(school&&/^\d{7}$/.test(school))destination.searchParams.set('school_id',school);
    const year=params.get('year');
    if(year&&['2023','2024','2025','2026'].includes(year))destination.searchParams.set('year',year);
    const target=destination.pathname+destination.search;
    document.getElementById('continueLink').href=target;
    // Keep legacy /result.html visit statistics before navigating if possible;
    // never block visitors if the optional visit RPC is unavailable.
    const tracked=window.beaguVisitReady||Promise.resolve();
    Promise.race([tracked,new Promise(resolve=>setTimeout(resolve,650))])
      .catch(()=>{}).then(()=>location.replace(target));
  })();
  </script>
</body>
</html>
