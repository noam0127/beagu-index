name: v1.1.0 staging class diary preview and admin review NO-GO security smoke
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-class-diary-guest-access-v1/**'
      - 'scripts/staging/recovered-class-diary-progress-v1/**'
      - 'scripts/staging/recovered-beagu-2026-review-admin/**'
      - 'scripts/staging/schema-class-diary-private-qa-only.sql'
      - 'tests/staging-class-diary-admin-*.test.py'
      - '.github/workflows/v110-staging-preview-admin-locked.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-write-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify isolated source, private ACLs and explicit NO-GO
        run: python3 tests/staging-class-diary-admin-contract.test.py
      - name: Exercise real staging HTTP negative paths (no writes)
        run: python3 tests/staging-class-diary-admin-http.test.py
      - name: Confirm no production release credentials in CI
        run: |
          echo "Read-only negative smoke only; manager MFA, owner PIN, referral remain locked"
