name: Frozen edge compatibility validation
on:
  pull_request:
    branches: ['fix/v11117-opening-prep']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute candidate handlers against mock DB only
        run: node --experimental-strip-types tests/release-edge-compatibility.mjs
      - name: Check bounded recommendation on retained official game server
        run: node tests/arcade-school-recommend-server.mjs
