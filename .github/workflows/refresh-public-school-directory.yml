name: Refresh public comparison school directory
on:
  schedule:
    # 06:30 KST; weekly NEIS school sync occurs before this.
    - cron: '30 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-school-directory-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export published public directory (RLS, publishable key)
        run: node scripts/build-public-comparison-directory.cjs
      - name: Commit only if public records changed
        run: |
          if git diff --quiet -- data/public-comparison-school-directory-v1.json; then
            echo 'Public directory unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-comparison-school-directory-v1.json
          git commit -m 'data: refresh public school comparison directory'
          git push
