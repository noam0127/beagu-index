name: Search Results Unified UI Validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'challenge.html'
      - 'styles/beagu-site-header-v1.css'
      - 'tests/site-nav-challenge-unity.mjs'
      - 'search.html'
      - 'search-lv1.html'
      - 'statistics.html'
      - 'search-lv2.html'
      - 'school-report.html'
      - 'js/school-search-card-v1.js'
      - 'js/school-detail-groups-v1.js'
      - 'styles/school-detail-groups-v1.css'
      - 'js/percentile-chart.js'
      - 'js/level-search.js'
      - 'js/lv2-edited-search.js'
      - 'js/school-mbti-v1.js'
      - 'styles/school-search-card-v1.css'
      - 'styles/beagu-search-details-v1.css'
      - 'styles/beagu-auth-unified-v1.css'
      - 'scripts/beagu-2026-mbti-review-sync.gs'
      - 'tests/school-search-unification.mjs'
      - 'tests/lv1-ranked-office-history.mjs'
      - 'tests/lv1-view-count-sort.mjs'
      - 'tests/lv0-locked-sort-options.mjs'
      - 'tests/overseas-history-presence.mjs'
      - 'tests/regional-percentile-coverage-20261120.mjs'
      - 'data/public-lv0-percentiles-v1.2.json'
      - 'data/public-2023-2025-school-records-v2.json'
      - 'tests/search-detail-ui-v1.mjs'
      - 'tests/lv1-school-faculty-groups.mjs'
      - 'tests/auth-unified-2026-link.mjs'
      - 'tests/school-question-mode-only-privacy.mjs'
      - 'tests/lv1-ox-multiselect-ui.mjs'
      - 'tests/2026-approved-search-refresh.mjs'
      - 'tests/2026-school-empty-survey-cta.mjs'
      - 'tests/lv1-percentile-chart-parity.mjs'
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'supabase/migrations/20261119_school_checkbox_choices_v1.sql'
      - 'supabase/migrations/20261119_2025_domain_comparisons_v1.sql'
      - 'supabase/migrations/20261120_lv1_school_sort_view_count.sql'
      - '.github/workflows/school-search-unification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-nav-challenge-unity.mjs
      - run: node tests/school-search-unification.mjs
      - run: node tests/lv1-ranked-office-history.mjs
      - run: node tests/lv1-view-count-sort.mjs
      - run: node tests/lv0-locked-sort-options.mjs
      - run: node tests/overseas-history-presence.mjs
      - run: node tests/regional-percentile-coverage-20261120.mjs
      - run: node tests/search-detail-ui-v1.mjs
      - run: node tests/lv1-school-faculty-groups.mjs
      - run: node tests/auth-unified-2026-link.mjs
      - run: node tests/school-question-mode-only-privacy.mjs
      - run: node tests/lv1-ox-multiselect-ui.mjs
      - run: node tests/2026-approved-search-refresh.mjs
      - run: node tests/2026-school-empty-survey-cta.mjs
      - run: node tests/lv1-percentile-chart-parity.mjs
