name: Unified Lv1/Lv2 participation code validation
on:
  pull_request:
    paths:
      - 'js/beagu-participation-auth-v2.js'
      - 'styles/beagu-participation-auth-v2.css'
      - 'js/beagu-level-state-v1.js'
      - 'js/beagu-level-guide-v1.js'
      - 'js/challenge-access-v1.js'
      - 'js/level-search.js'
      - 'js/statistics-compare.js'
      - 'js/postit-v1.js'
      - 'supabase/functions/beagu-level-api/**'
      - 'supabase/functions/beagu-postit-api-v1/**'
      - 'supabase/functions/beagu-referral-link-v1/**'
      - 'supabase/migrations/20261121_earned_challenge_participation_auth.sql'
      - 'tests/*auth*'
      - 'tests/level-guide-route.mjs'
      - 'tests/levelup-provisional-v1.cjs'
      - '.github/workflows/participation-code-v2-validation.yml'
  push:
    branches: [main]
    paths:
      - 'js/beagu-participation-auth-v2.js'
      - 'supabase/functions/beagu-level-api/**'
      - '.github/workflows/participation-code-v2-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and DOM entrypoint contract
        run: |
          node --check js/beagu-participation-auth-v2.js
          node --check js/beagu-level-state-v1.js
          node --check js/challenge-access-v1.js
          node --check js/level-search.js
          node --check js/statistics-compare.js
          node --check js/postit-v1.js
          node tests/level-guide-route.mjs
          node tests/auth-journey-states.mjs
          node tests/levelup-provisional-v1.cjs
          node tests/challenge-auth-ui.mjs
          node tests/auth-unified-2026-link.mjs
          node tests/postit-static-check.cjs
