name: Class Diary Literary v3 Regression
on:
  pull_request:
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-*.js'
      - 'scripts/test-class-diary-literary-v3.cjs'
      - 'scripts/test-class-diary-long-prologue.cjs'
      - '.github/workflows/class-diary-literary-v3-validation.yml'
  push:
    branches:
      - 'feature/class-diary-literary-v3-clean-20261120'
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-*.js'
      - 'scripts/test-class-diary-literary-v3.cjs'
      - 'scripts/test-class-diary-long-prologue.cjs'
      - '.github/workflows/class-diary-literary-v3-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-literary-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate five long narrator prologues and handoff to player
        run: node scripts/test-class-diary-long-prologue.cjs
      - name: Validate 30 full routes, philosophy and five different endings
        run: node scripts/test-class-diary-literary-v3.cjs
