name: Lv1 Lv2 desktop and mobile browser test

on:
  pull_request:
    paths:
      - 'scripts/test-participation-browser.cjs'
      - '.github/workflows/participation-code-browser.yml'
      - 'js/beagu-participation-auth-v2.js'
      - 'styles/beagu-participation-auth-v2.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --no-package-lock playwright html2canvas@1.4.1
          npx playwright install --with-deps chromium --only-shell
      - name: Test desktop/mobile participation-code flow on local static pages
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/participation-browser.log 2>&1 &
          node tests/v11123-challenge-ui.mjs
          node scripts/test-participation-browser.cjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lv1-lv2-desktop-mobile
          path: artifacts/participation-auth/
          if-no-files-found: ignore
