name: Challenge Lv2 account entry regression
on:
  pull_request:
    paths:
      - 'challenge.html'
      - 'js/challenge-member-auth-v1.js'
      - 'styles/challenge-member-auth-v1.css'
      - 'js/beagu-participation-auth-v2.js'
      - 'tests/challenge-lv2-account-entry.mjs'
      - '.github/workflows/challenge-lv2-account-entry.yml'
  push:
    branches: [main]
    paths:
      - 'challenge.html'
      - 'js/challenge-member-auth-v1.js'
      - 'styles/challenge-member-auth-v1.css'
      - 'js/beagu-participation-auth-v2.js'
      - 'tests/challenge-lv2-account-entry.mjs'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/challenge-lv2-account-entry.mjs
      - run: node tests/participation-code-unified.mjs
      - run: node tests/challenge-auth-ui.mjs
      - run: node scripts/test-challenge-lv2-card.cjs
      - run: node scripts/test-challenge-referral-premium.cjs
