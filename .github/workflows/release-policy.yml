name: School release policy regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/release-policy.test.mjs tests/auth.test.mjs
