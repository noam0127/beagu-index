name: Class diary natural transparent actors
on:
  push:
    branches: [main]
    paths:
      - 'styles/class-diary-actors-natural-v1.css'
      - 'js/class-diary-semester-male-art-v1.js'
      - 'js/class-diary-male-photos-v1.js'
      - 'js/class-diary-student-doyun-v1.js'
      - 'scripts/test-class-diary-natural-actors.cjs'
      - 'scripts/test-class-diary-male-webtoon.cjs'
      - 'teacher-class-diary-play.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-natural-actors.cjs
      - run: node scripts/test-class-diary-male-webtoon.cjs
      - run: node scripts/test-class-diary-semester-male-art.cjs
      - run: node scripts/test-class-diary-male-cast.cjs
      - run: node scripts/test-class-diary-doyun.cjs
