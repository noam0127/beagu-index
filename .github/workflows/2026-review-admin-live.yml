name: 2026 Review Admin Live Authorization
on:
  pull_request:
    paths:
      - 'tests/2026-review-admin-live.cjs'
      - '.github/workflows/2026-review-admin-live.yml'
  push:
    branches: [main]
    paths:
      - 'tests/2026-review-admin-live.cjs'
      - '.github/workflows/2026-review-admin-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deny-untrusted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/2026-review-admin-live.cjs
