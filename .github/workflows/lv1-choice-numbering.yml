name: Lv1 School Choice Numbering Regression
on:
  push:
    branches: [main]
    paths:
      - 'js/level-search.js'
      - 'js/2025-observed-choices.js'
      - 'search-lv1.html'
      - 'tests/search-detail-ui-v1.mjs'
      - '.github/workflows/lv1-choice-numbering.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  option-numbering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verified choices and numeric-value preservation
        run: node tests/search-detail-ui-v1.mjs
