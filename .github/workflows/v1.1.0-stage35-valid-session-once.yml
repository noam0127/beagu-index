name: v1.1.0 stage35 one-time synthetic session E2E
on:
  push:
    branches: ['develop/v1.1.0-lv3']
    paths:
      - 'tests/v1.1.0-stage35-valid-session-once.py'
      - '.github/workflows/v1.1.0-stage35-valid-session-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-level1-level2-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check only 15-minute staging dummy sessions, no writes
        run: python3 tests/v1.1.0-stage35-valid-session-once.py
      - name: Fixture cleanup notice
        if: always()
        run: echo "Revoke staging fixture hashes after this job. Never promote these QA credentials."
