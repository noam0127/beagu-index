name: Refresh comparison public school directory
on:
  schedule:
    - cron: '40 18 * * *' # 03:40 Asia/Seoul; after weekly official-school sync
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: school-directory-refresh
  cancel-in-progress: false
jobs:
  update-public-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public-only directory
        run: node scripts/build-public-compare-directory.cjs
      - name: Validate public-only directory
        run: node tests/public-compare-directory-static.cjs
      - name: Publish changed verified directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-compare-school-directory-v1.json
          if git diff --cached --quiet; then
            echo "Directory unchanged"
            exit 0
          fi
          git commit -m "data: refresh approved public school directory"
          git pull --rebase origin main
          git push origin HEAD:main
