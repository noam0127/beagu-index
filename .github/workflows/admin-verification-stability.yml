name: Admin verification stability (offline only)
on:
  push:
    branches: [fix/admin-verification-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          node --check js/beagu-admin-updates-v1.js
          node --test tests/admin-verification-stability.mjs
          node --test tests/site-release-single-publisher.mjs
      - run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            echo "BEAGU_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            timeout 120s npx playwright install chromium --only-shell
          fi
      - run: |
          node tests/admin-release-draft-browser.cjs
          node tests/admin-verification-stability-browser.cjs
