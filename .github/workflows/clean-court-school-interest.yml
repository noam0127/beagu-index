name: Clean Court school-interest (offline)
on:
  push:
    branches: [refactor/clean-court-school-interest-20261128]
  pull_request:
    branches: [fix/v112061-emergency-stability]
    paths:
      - 'js/search-telemetry-v1.js'
      - 'tests/school-view-client-integration.cjs'
      - '.github/workflows/clean-court-school-interest.yml'
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/search-telemetry-v1.js
      - run: node tests/school-view-client-integration.cjs
