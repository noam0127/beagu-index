name: Auth single-flight independent validation
on:
  push:
    branches: [perf/v1.12.06-auth-singleflight, perf/v1.12.06-2026-batch, fix/v112061-emergency-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authentication regression checks (no deployment)
        run: |
          node --check js/beagu-level-state-v1.js
          node --check js/beagu-participation-auth-v2.js
          node --check js/challenge-access-v1.js
          node --check js/beagu-game-lv1-gate-v1.js
          node --check js/statistics-compare.js
          node --check js/challenge.js
          node --check js/visit-stats.js
          node --check js/beagu-presence-games-v1.js
          node tests/emergency-stability-v112061.mjs
          node tests/participation-code-unified.mjs
          node tests/auth-verify-singleflight.mjs
          node tests/auth-background-load-performance.mjs
          node tests/telemetry-gateway-client-smoke.cjs
          node tests/challenge-search-telemetry.mjs
          node tests/level-guide-route.mjs
          node tests/auth-journey-states.mjs
          node tests/levelup-provisional-v1.cjs
          node tests/challenge-auth-ui.mjs
          node tests/auth-unified-2026-link.mjs
          node tests/postit-static-check.cjs
