name: v1.1.0 stage36 static regression (read-only)
on:
  push:
    branches: ['develop/v1.1.0-lv3']
    paths:
      - '.github/workflows/v1.1.0-stage36-regression.yml'
      - 'tests/v1.1.0-stage36-release-gates.mjs'
  pull_request:
    paths:
      - 'challenge.html'
      - 'search.html'
      - 'search-lv1.html'
      - 'statistics.html'
      - 'school-report.html'
      - 'admin.html'
      - 'admin-updates.html'
      - 'js/**'
      - 'styles/**'
      - 'tests/**'
      - '.github/workflows/v1.1.0-stage36-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authentication, challenge, school browsing, and layout contracts
        run: |
          node tests/auth-journey-states.mjs
          node tests/challenge-auth-ui.mjs
          node tests/challenge-lv2-account-entry.mjs
          node tests/school-search-unification.mjs
          node tests/search-compare-unity.mjs
          node tests/admin-page-performance-static.cjs
      - name: Release packaging and isolation contracts
        run: |
          python3 tests/site-release-packaging.py
      - name: Stage35 security and release-policy regressions
        run: |
          node tests/v1.1.0-stage35-2026-release-policy.mjs
          node tests/v1.1.0-stage35-lv3-member.mjs
          node tests/v1.1.0-stage35-member-admin-ownership.mjs
          node tests/v1.1.0-stage35-moderation-audit.mjs
          node tests/v1.1.0-stage35-cross-account-decision.mjs
      - name: Stage36 hard release gates
        run: node tests/v1.1.0-stage36-release-gates.mjs
      - name: Scope notice
        run: |
          echo 'Static checks only. Does not prove live DB/RLS, browser UX, latency, or production readiness.'
