name: Search and comparison UI unity
on:
  push:
    branches: [main]
    paths:
      - 'search.html'
      - 'search-lv1.html'
      - 'statistics.html'
      - 'levels.html'
      - 'postit.html'
      - 'styles/beagu-search-compare-unity-v1.css'
      - 'js/beagu-level-state-v1.js'
      - 'js/beagu-level-guide-v1.js'
      - 'js/postit-v1.js'
      - 'tests/search-compare-unity.mjs'
      - '.github/workflows/search-compare-unity.yml'
  pull_request:
    paths:
      - 'tests/search-compare-unity.mjs'
      - '.github/workflows/search-compare-unity.yml'
      - 'search.html'
      - 'search-lv1.html'
      - 'statistics.html'
      - 'js/beagu-participation-auth-v2.js'
      - 'js/beagu-level-state-v1.js'
      - 'js/postit-v1.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-and-level-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/search-compare-unity.mjs
      - run: node tests/statistics-lv2-price-upgrade-v1.mjs
