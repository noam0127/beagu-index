name: v1.11.19 court tidy offline
on:
  push:
    branches: [feat/v11119-daily-ranking]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check js/beagu-home-ranking-v1.js
          node tests/2026-home-ranking-daily.mjs
          node tests/v11119-court-tidy.mjs
          node tests/arcade-fire-court-v11115.mjs
          node tests/2026-civic-feedback-safe.cjs
          node tests/school-likes-contract.mjs
          node tests/v111181-court-completion.mjs
          node tests/v11118-static-basics.mjs
          node tests/v11117-public-school-basics.mjs
          node tests/2026-public-projection-integrity.mjs
          node tests/2026-question-results-pipeline.mjs
          node tests/2026-percentile-v13-final-contract.mjs
  postgres-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: rank_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated SQL fixture
        env:
          PGPASSWORD: fixture
        run: psql -h 127.0.0.1 -U postgres -d rank_fixture -v ON_ERROR_STOP=1 -f tests/2026-home-ranking-daily-fixture.sql
