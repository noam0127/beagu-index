name: Publish an Owner-approved Pages archive
on:
  workflow_dispatch:
    inputs:
      request:
        description: Approved deployment UUID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages-direct
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://baeguindex.com
    env:
      RELEASE_API: ${{ vars.RELEASE_API }}
      REQUEST_ID: ${{ inputs.request }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Claim approval and verify archived SHA-256
        id: claim
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_PROMOTION_SECRET }}
        run: python release/ci.py claim
      - name: Check candidate identity
        run: |
          mkdir dist
          tar -xf website.tar -C dist
          test "$(jq -r .sha dist/release.json)" = "$(cat expected-sha)"
          test "$(cat dist/CNAME)" = baeguindex.com
          mv website.tar artifact.tar
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1
      - uses: actions/deploy-pages@v4
      - name: Verify production bytes
        run: python release/verify_host.py production
      - name: Record verified result
        if: always()
        env:
          RELEASE_SECRET: ${{ secrets.RELEASE_PROMOTION_SECRET }}
          JOB_STATUS: ${{ job.status }}
          FAILURE_STEP: ${{ job.status != 'success' && 'See the linked Actions run and verify the live SHA before retrying.' || '' }}
        run: python release/ci.py finish
