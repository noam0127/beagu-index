name: v1.1.0 — password recovery UX and expiry regression
on:
  push:
    branches:
      - develop/v1.1.0-phase1-20261121
    paths:
      - '.github/workflows/v1.1.0-password-reset.yml'
      - 'tests/v1.1.0-password-reset.test.mjs'
      - 'tests/v1.1.0-email-confirmation.test.mjs'
      - 'tests/v1.1.0-auth-redirects.test.mjs'
      - 'js/beagu-password-reset-v1.js'
      - 'js/beagu-auth-confirmation-v1.js'
      - 'js/beagu-auth-return-v1.js'
      - 'password-reset.html'
      - 'styles/beagu-password-reset-v1.css'
      - 'styles/challenge-member-auth-v1.css'
      - 'styles/postit-account-v1.css'
      - 'docs/releases/v1.1.0-auth-redirect-matrix.json'
      - 'challenge.html'
      - 'postit.html'
      - 'admin-enroll.html'
      - 'admin.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-recovery:
    name: Recovery, callbacks and preview DB isolation (no real Auth writes)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authentication scripts syntax
        run: |
          node --check js/beagu-password-reset-v1.js
          node --check js/beagu-auth-confirmation-v1.js
      - name: Run reset, email callback and URL allowlist tests
        run: |
          node --test tests/v1.1.0-password-reset.test.mjs tests/v1.1.0-email-confirmation.test.mjs tests/v1.1.0-auth-redirects.test.mjs
      - name: Verify packaged preview does not use live DB or live survey
        run: python3 tests/preview-db-isolation.py
