name: v1.1.0 — password recovery UX and expiry regression
on:
  push:
    branches:
      - develop/v1.1.0-phase1-20261121
    paths:
      - '.github/workflows/v1.1.0-password-reset.yml'
      - 'tests/v1.1.0-password-reset.test.mjs'
      - 'js/beagu-password-reset-v1.js'
      - 'js/beagu-auth-return-v1.js'
      - 'password-reset.html'
      - 'challenge.html'
      - 'postit.html'
      - 'admin-enroll.html'
      - 'admin.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-recovery:
    name: Password recovery and expired-link UX (offline Auth mocks)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new recovery JavaScript syntax
        run: node --check js/beagu-password-reset-v1.js
      - name: Run recovery flow, expiry, cross-environment and credential hygiene tests
        run: node --test tests/v1.1.0-password-reset.test.mjs
