name: Common school and challenge authentication journey
on:
  push:
    branches: [main]
    paths:
      - 'search.html'
      - 'search-lv1.html'
      - 'statistics.html'
      - 'challenge.html'
      - 'js/beagu-level-state-v1.js'
      - 'js/statistics-compare.js'
      - 'js/challenge-access-v1.js'
      - 'styles/beagu-auth-journey-v1.css'
      - 'tests/auth-journey-states.mjs'
      - '.github/workflows/auth-journey-states.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-card-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server-backed level status and common card layout
        run: node tests/auth-journey-states.mjs
