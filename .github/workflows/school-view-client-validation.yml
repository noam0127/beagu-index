name: School view selection recording
on:
  push:
    branches: [main]
    paths:
      - 'js/search-telemetry-v1.js'
      - 'js/school-view-counts-v1.js'
      - 'search.html'
      - 'search-lv1.html'
      - 'school-report.html'
      - 'tests/school-view-client-integration.cjs'
      - '.github/workflows/school-view-client-validation.yml'
  pull_request:
    paths:
      - 'js/search-telemetry-v1.js'
      - 'js/school-view-counts-v1.js'
      - 'search.html'
      - 'search-lv1.html'
      - 'school-report.html'
      - 'tests/school-view-client-integration.cjs'
      - '.github/workflows/school-view-client-validation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/search-telemetry-v1.js
      - run: node --check js/school-view-counts-v1.js
      - run: node tests/school-view-client-integration.cjs
