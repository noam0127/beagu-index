name: Class Diary Korean drama photo cast restoration
on:
  push:
    branches: [main]
    paths:
      - 'assets/class-diary/characters/hyunwoo-six-expressions.webp'
      - 'assets/class-diary/characters/male-supporting-strip.webp'
      - 'assets/class-diary/characters/doyun-four-expressions.webp'
      - 'js/class-diary-semester-male-art-v1.js'
      - 'js/class-diary-male-photos-v1.js'
      - 'js/class-diary-student-doyun-v1.js'
      - 'teacher-class-diary-play.html'
      - 'scripts/test-class-diary-male-webtoon.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-male-webtoon.cjs
      - run: node scripts/test-class-diary-semester-male-art.cjs
      - run: node scripts/test-class-diary-male-cast.cjs
      - run: node scripts/test-class-diary-doyun.cjs
