name: Isolated Lv0-Lv2 staging checks (no deploy)
on:
  push:
    branches: [feature/test-web-lv0-lv2-20261120]
    paths: ['test-web/**','test-environment/**','tests/test-web-stage-contract.mjs','.github/workflows/test-web-stage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test-web-stage-contract.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check test-environment/supabase/functions/beagu-test-v1/index.ts
