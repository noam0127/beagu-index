name: v1.1.0 standalone staging artifact (NO VERCEL, NO DEPLOY)
on:
  push:
    branches:
      - ci/v1.1.0-standalone-test-bundle-20261123
      - fix/v1.1.0-preview-isolation-gate-20261123
  pull_request:
    paths:
      - '**/*.html'
      - 'js/**'
      - 'styles/**'
      - 'assets/**'
      - 'data/**'
      - 'r/**'
      - 'scripts/build-standalone-staging.py'
      - 'scripts/staging-runtime-guard.js'
      - 'scripts/standalone-admin-release-disabled.html'
      - 'scripts/staging-survey-unavailable.html'
      - 'tests/test-standalone-staging.py'
      - 'scripts/test-standalone-browser.cjs'
      - 'scripts/check-standalone-assets.py'
      - 'scripts/verify-render-preview.py'
      - 'tests/test-render-preview-readiness.py'
      - 'tests/postit-auth-redirect-stage.cjs'
      - 'scripts/staging/auth-readiness.sql'
      - 'scripts/staging/check-auth-readiness.cjs'
      - 'tests/staging-auth-readiness.cjs'
      - 'scripts/staging/audit-frontend-edge-functions.py'
      - 'scripts/staging/stage-edge-functions-inventory.json'
      - 'tests/staging-edge-inventory.test.py'
      - 'tests/postit-member-auth.cjs'
      - 'render.yaml'
      - '.github/workflows/v110-standalone-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-safe-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout selected Git SHA without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python syntax gate
        run: |
          python3 -m py_compile scripts/build-standalone-staging.py
          python3 -m py_compile tests/test-standalone-staging.py
      - name: Validate live-site readiness probe without network access
        run: |
          python3 -m py_compile scripts/verify-render-preview.py
          python3 -m py_compile tests/test-render-preview-readiness.py
          python3 tests/test-render-preview-readiness.py
      - name: Build test-only static bundle from exact checkout
        run: python3 scripts/build-standalone-staging.py
      - name: Audit test-only bundle and production isolation
        run: python3 tests/test-standalone-staging.py
      - name: Audit staging Edge Function inventory without contacting backend
        run: |
          python3 tests/staging-edge-inventory.test.py
          python3 scripts/staging/audit-frontend-edge-functions.py
      - name: Require complete staging Edge Function inventory for manually requested E2E
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/staging/audit-frontend-edge-functions.py --require-ready
      - name: Audit local asset paths before browser verification
        run: python3 scripts/check-standalone-assets.py
      - name: Setup Node 22 for isolated browser checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Staging Auth readiness prerequisites (offline contract only)
        run: node tests/staging-auth-readiness.cjs
      - name: Post-it staging email confirmation and OAuth redirect regression
        run: |
          node tests/postit-member-auth.cjs
          node tests/postit-auth-redirect-stage.cjs
          node tests/challenge-lv2-account-entry.mjs
      - name: Check isolation guard syntax before packaging
        run: node --check scripts/staging-runtime-guard.js
      - name: Install headless Chromium only
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium --only-shell
      - name: PC/mobile browser and no-live-requests regression
        run: |
          python3 -m http.server 8132 --directory _standalone_staging --bind 127.0.0.1 >/tmp/beagu-standalone-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/test-standalone-browser.cjs
      - name: Verify production domain and deployment workers never included
        run: |
          test ! -e _standalone_staging/CNAME
          test ! -e _standalone_staging/.github
          test ! -e _standalone_staging/supabase
          test ! -e _release_site
          echo 'PASS: Vercel-free artifact only; no live site, DB, or deployment writes'
      - name: Upload reviewable staging-only site (not published)
        uses: actions/upload-artifact@v4
        with:
          name: baegu-v110-standalone-staging
          path: _standalone_staging/
          retention-days: 7
          if-no-files-found: error
