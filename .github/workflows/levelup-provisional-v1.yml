name: Provisional Lv2 level-up checks
on:
  push:
    paths:
      - 'js/beagu-level-state-v1.js'
      - 'js/postit-v1.js'
      - 'js/beagu-level-guide-v1.js'
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'tests/levelup-provisional-v1.cjs'
      - '.github/workflows/levelup-provisional-v1.yml'
  pull_request:
    paths:
      - 'js/beagu-level-state-v1.js'
      - 'js/postit-v1.js'
      - 'js/beagu-level-guide-v1.js'
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'tests/levelup-provisional-v1.cjs'
      - '.github/workflows/levelup-provisional-v1.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts parse
        run: |
          node --check js/beagu-level-state-v1.js
          node --check js/postit-v1.js
          node --check js/beagu-level-guide-v1.js
      - name: Check level-up security and UI contract
        run: node tests/levelup-provisional-v1.cjs
