name: Lv2 Post-it member authentication
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261121103000_beagu_postit_member_auth.sql'
      - 'supabase/functions/beagu-postit-api-v1/index.ts'
      - 'js/postit-account-v1.js'
      - 'js/postit-v1.js'
      - 'postit.html'
      - 'styles/postit-account-v1.css'
      - 'tests/postit-member-auth.cjs'
      - 'tests/postit-static-check.cjs'
      - 'tests/levelup-provisional-v1.cjs'
      - '.github/workflows/postit-member-auth.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261121103000_beagu_postit_member_auth.sql'
      - 'supabase/functions/beagu-postit-api-v1/index.ts'
      - 'js/postit-account-v1.js'
      - 'js/postit-v1.js'
      - 'postit.html'
      - 'styles/postit-account-v1.css'
      - 'tests/postit-member-auth.cjs'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/postit-member-auth.cjs
      - run: node tests/postit-static-check.cjs
      - run: node tests/levelup-provisional-v1.cjs
