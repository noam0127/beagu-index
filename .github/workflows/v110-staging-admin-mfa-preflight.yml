name: v1.1.0 stage admin AAL2 readiness no-write HTTP
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-2026-review-admin/**'
      - 'tests/staging-admin-mfa-preflight-*.test.py'
      - 'tests/staging-owner-aal2-local-checker.test.py'
      - 'scripts/staging/check-owner-aal2-interactive.py'
      - '.github/workflows/v110-staging-admin-mfa-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-mfa-preflight-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require signature verified before claims + no review unlock
        run: python3 tests/staging-admin-mfa-preflight-contract.test.py
      - name: Call REAL STAGING HTTP with unsigned/forged tokens only
        run: python3 tests/staging-admin-mfa-preflight-http.test.py
      - name: Test local tester instructions with zero secrets
        run: python3 tests/staging-owner-aal2-local-checker.test.py
      - name: Document narrow evidence boundary
        run: |
          echo "All live requests are credential-free and make no database changes."
          echo "Real owner MFA setup, signed JWT and PC/mobile browser E2E remain UNTESTED."
