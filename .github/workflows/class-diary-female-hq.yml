name: Class diary high quality female cast

on:
  push:
    paths:
      - 'js/class-diary-hq-*.js'
      - 'js/class-diary-female-hq-*.js'
      - 'teacher-class-diary-play.html'
      - 'styles/class-diary-female-hq-v1.css'
      - 'scripts/test-class-diary-female-hq.cjs'
      - 'scripts/test-class-diary-browser.cjs'
      - '.github/workflows/class-diary-female-hq.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate original female high quality assets and all 30 emotions
        run: node scripts/test-class-diary-female-hq.cjs
      - name: Validate 36-episode routes and legacy source art
        run: |
          node scripts/test-class-diary-sd.cjs
          node scripts/test-class-diary-semester.cjs
