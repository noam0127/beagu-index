name: Private Account/Auth V1 (not deployed)
on:
  push:
    branches:
      - feature/lv2-referral-phase1-20261119
    paths:
      - 'supabase/migrations/20261119_account_auth_private_v1.sql'
      - 'supabase/functions/beagu-account-v1/**'
      - 'js/beagu-account-client-v1.js'
      - 'js/beagu-account-confirm-cleanup-v1.js'
      - 'account-email-confirmed.html'
      - 'account-password-reset.html'
      - 'supabase/email-templates/account-recovery.html'
      - 'js/beagu-account-password-reset-v1.js'
      - 'tests/account-lifecycle-security-v1.mjs'
      - 'tests/account-auth-private-v1.mjs'
      - '.github/workflows/account-auth-private-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-auth-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/account-auth-private-v1.mjs
      - run: node tests/account-lifecycle-security-v1.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/beagu-account-v1/index.ts
