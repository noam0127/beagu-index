name: v1.1.0 — preview database isolation (offline)
on:
  push:
    branches:
      - develop/v1.1.0-phase1-20261121
    paths:
      - '.github/workflows/v1.1.0-preview-db-isolation.yml'
      - 'scripts/release-manager/worker.py'
      - 'tests/preview-db-isolation.py'
      - 'js/supabase-config.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-isolation:
    name: Check immutable production vs. staging preview (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile worker and isolation tests
        run: python3 -m py_compile scripts/release-manager/worker.py tests/preview-db-isolation.py
      - name: Build preview artifact in temporary directory; verify fail closed
        run: python3 tests/preview-db-isolation.py
