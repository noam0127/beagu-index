name: Class diary desktop and mobile browser E2E
on:
  push:
    branches: [main]
    paths:
      - 'teacher-class-diary-play.html'
      - 'index.html'
      - 'js/class-diary-home-entry-v1.js'
      - 'styles/class-diary-guest-experience-v1.css'
      - 'scripts/test-class-diary-guest-flow-browser.cjs'
      - 'js/class-diary-play-v1.js'
      - 'js/class-diary-semester-v1.js'
      - 'js/class-diary-narrator-v1.js'
      - 'js/class-diary-prologue-scenes-v1.js'
      - 'js/class-diary-prologue-lens-woman-v1.js'
      - 'js/class-diary-prologue-lens-man-v1.js'
      - 'js/class-diary-prologue-lens-none-v1.js'
      - 'js/class-diary-prologue-lens-man2-v1.js'
      - 'js/class-diary-prologue-lens-man3-v1.js'
      - 'js/class-diary-pedagogy-v1.js'
      - 'scripts/test-class-diary-long-prologue.cjs'
      - 'js/class-diary-colleague-dogyeom-v1.js'
      - 'js/class-diary-colleague-taeo-v1.js'
      - 'js/class-diary-prose-act1-v1.js'
      - 'js/class-diary-prose-act2-v1.js'
      - 'js/class-diary-prose-act3-v1.js'
      - 'js/class-diary-prose-act4-v1.js'
      - 'js/class-diary-prose-act5-v1.js'
      - 'js/class-diary-prose-act6-v1.js'
      - 'js/class-diary-school-brief-v1.js'
      - 'styles/class-diary-player-flow-v1.css'
      - 'scripts/test-class-diary-school-brief.cjs'
      - 'js/class-diary-journey-v1.js'
      - 'js/class-diary-semester-ui-v1.js'
      - 'styles/class-diary-semester-ui-v1.css'
      - 'scripts/test-class-diary-semester-ui.cjs'
      - 'js/class-diary-scenario-v1.js'
      - 'js/class-diary-director-v1.js'
      - 'js/class-diary-character-routes-v1.js'
      - 'js/class-diary-incidents-v1.js'
      - 'js/class-diary-sound-v1.js'
      - 'js/class-diary-visual-v1.js'
      - 'js/class-diary-motion-v1.js'
      - 'js/class-diary-literary-v1.js'
      - 'styles/class-diary-literary-v1.css'
      - 'styles/class-diary-motion-v1.css'
      - 'js/class-diary-sd-v1.js'
      - 'js/class-diary-ui-v2.js'
      - 'styles/class-diary-ui-v2.css'
      - 'styles/class-diary-journey-v1.css'
      - 'scripts/test-class-diary-literary.cjs'
      - 'scripts/test-class-diary-literary-browser.cjs'
      - 'scripts/test-class-diary-browser.cjs'
      - '.github/workflows/class-diary-browser-e2e.yml'
  pull_request:
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-semester-v1.js'
      - 'scripts/test-class-diary-browser.cjs'
      - 'scripts/test-class-diary-guest-flow-browser.cjs'
      - '.github/workflows/class-diary-browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: class-diary-browser-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify line layout without browser
        run: node scripts/test-class-diary-literary.cjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium --only-shell
      - name: Serve site and complete both game routes
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/diary-web.log 2>&1 &
          node scripts/test-class-diary-literary-browser.cjs
          node scripts/test-class-diary-guest-flow-browser.cjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-diary-desktop-mobile
          path: artifacts/class-diary/
          if-no-files-found: ignore
