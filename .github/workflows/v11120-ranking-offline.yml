name: v1.11.20 ranking integration offline
on:
  push:
    branches: [feat/v11120-ranking-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check js/beagu-home-ranking-v1.js
          node tests/2026-home-ranking-daily.mjs
          node tests/v11120-region-ranking.mjs
          node tests/v11119-court-tidy.mjs
          node tests/arcade-fire-court-v11115.mjs
          node tests/2026-civic-feedback-safe.cjs
          node tests/school-likes-contract.mjs
          node tests/v111181-court-completion.mjs
          node tests/v11118-static-basics.mjs
          node tests/v11117-public-school-basics.mjs
          node tests/2026-public-projection-integrity.mjs
          node tests/2026-question-results-pipeline.mjs
          node tests/2026-percentile-v13-final-contract.mjs
  postgres-fixture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: rank_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated SQL fixture
        env:
          PGPASSWORD: fixture
        run: psql -h 127.0.0.1 -U postgres -d rank_fixture -v ON_ERROR_STOP=1 -f tests/2026-home-ranking-daily-fixture.sql
      - name: Validate actual region TOP10 SQL with private-event fixtures
        env:
          PGPASSWORD: fixture
        run: |
          createdb -h 127.0.0.1 -U postgres region_fixture
          # Roles are cluster-wide; reuse roles from previous fixture.
          tail -n +3 tests/region-interest-fixture.sql | psql -h 127.0.0.1 -U postgres -d region_fixture -v ON_ERROR_STOP=1
          for f in supabase/region-interest-v1.sql tests/region-interest-assertions.sql supabase/region-interest-top10-v11119.sql tests/v11120-region-top10-assertions.sql; do psql -h 127.0.0.1 -U postgres -d region_fixture -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Verify unified archive, points, verified status and grants
        env:
          PGPASSWORD: fixture
        run: |
          createdb -h 127.0.0.1 -U postgres arcade_fixture
          tail -n +5 tests/v1114-school-points-fixture.sql | psql -h 127.0.0.1 -U postgres -d arcade_fixture -v ON_ERROR_STOP=1
          for f in tests/v11115-archive-fixture.sql scripts/sql/v1.11.14-school-game-points-candidate.sql scripts/sql/v1.11.15-arcade-archive-candidate.sql tests/v11115-archive-assertions.sql docs/run4-ranking-preflight/schema-draft.sql docs/run4-ranking-preflight/store-draft.sql scripts/sql/v1.11.15-run4-archive-adapter-candidate.sql tests/v11115-run4-archive-assertions.sql scripts/sql/v1.11.15-run4-archive-adapter-candidate.sql scripts/sql/v1.11.20-run-unified-read-candidate.sql tests/v11120-run-unified-assertions.sql; do psql -h 127.0.0.1 -U postgres -d arcade_fixture -v ON_ERROR_STOP=1 -f "$f"; done
