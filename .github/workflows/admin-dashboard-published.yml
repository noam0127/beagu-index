name: Live admin dashboard publication smoke
# A live publication check must run AFTER an approved release, not on an unapproved PR.
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-dashboard-published.cjs