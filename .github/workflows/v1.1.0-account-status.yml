name: v1.1.0 — truthful account verification status
on:
  push:
    branches:
      - develop/v1.1.0-phase1-20261121
    paths:
      - '.github/workflows/v1.1.0-account-status.yml'
      - 'js/beagu-account-status-v1.js'
      - 'js/challenge-member-auth-v1.js'
      - 'js/postit-account-v1.js'
      - 'styles/beagu-account-status-v1.css'
      - 'challenge.html'
      - 'postit.html'
      - 'tests/v1.1.0-account-status.test.mjs'
      - 'tests/v1.1.0-legacy-password.test.mjs'
      - 'tests/challenge-lv2-account-entry.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-account-state:
    name: Validate truthful signup and Lv2 states using fake Auth only
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check account scripts syntax
        run: |
          node --check js/beagu-account-status-v1.js
          node --check js/challenge-member-auth-v1.js
          node --check js/postit-account-v1.js
      - name: Run account state and legacy-login mocked Auth regressions
        run: node --test tests/v1.1.0-account-status.test.mjs tests/v1.1.0-legacy-password.test.mjs tests/v1.1.0-unified-account-mode.test.mjs
      - name: Validate Challenge, Post-it and admin access compatibility
        run: |
          node tests/challenge-lv2-account-entry.mjs
          node tests/postit-member-auth.cjs
          node tests/admin-verified-email-enrollment-static.cjs
          node scripts/test-admin-access.cjs
      - name: Check fail-closed staging DB separation
        run: python3 tests/preview-db-isolation.py
