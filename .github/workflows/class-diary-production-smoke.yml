name: Class diary production asset verification
on:
  push:
    branches: [main]
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-play-v1.js'
      - 'js/class-diary-director-v1.js'
      - 'js/class-diary-scenario-v1.js'
      - 'js/class-diary-incidents-v1.js'
      - 'js/class-diary-sound-v1.js'
      - 'js/class-diary-visual-v1.js'
      - '.github/workflows/class-diary-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deployed-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify public demo and matching deployment assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://baeguindex.com'
          files=(
            'teacher-class-diary-play.html'
            'js/class-diary-play-v1.js'
            'js/class-diary-sound-v1.js'
            'js/class-diary-visual-v1.js'
            'js/class-diary-scenario-v1.js'
            'js/class-diary-incidents-v1.js'
            'js/class-diary-director-v1.js'
          )
          fail=0
          for file in "${files[@]}"; do
            ok=0
            for attempt in {1..16}; do
              if curl -fLsS --retry 1 --max-time 20 -H 'Cache-Control: no-cache' \
                "$base/$file?class_diary_build=${GITHUB_SHA}" -o /tmp/class-diary-live; then
                if cmp -s "$file" /tmp/class-diary-live; then
                  ok=1; break
                fi
              fi
              sleep 8
            done
            if [[ "$ok" = 1 ]]; then echo "PASS deployed exact asset $file";
            else echo "FAIL deployed asset differs from main: $file"; fail=1; fi
          done
          if [[ "$fail" != 0 ]]; then exit 1; fi
          if ! curl -fLsS --max-time 20 \
             "$base/teacher-class-diary-play.html?demo=1&verify=${GITHUB_SHA}" \
             -o /tmp/class-diary-demo; then
            echo 'FAIL public demo download'; exit 1
          fi
          if ! grep -q 'id="sceneBackdrop"' /tmp/class-diary-demo; then
            echo 'FAIL public demo route'; exit 1
          fi
          echo 'PASS public demo route, audio and visual scripts deployed'
      - name: Unauthenticated private world remains protected
        shell: bash
        run: |
          code=$(curl -sS --max-time 20 -o /tmp/diary-guard.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"schoolId":"7972013"}' \
            'https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/class-diary-world-v1')
          test "$code" = 401
          grep -q LEVEL2_REQUIRED /tmp/diary-guard.json
          echo 'PASS unauthorized Lv2 world access is blocked'
