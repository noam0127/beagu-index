name: Static compare directory and approved Lv1 cache
on:
  pull_request:
    paths:
      - 'data/public-compare-school-directory-v1.json'
      - 'scripts/build-public-compare-directory.cjs'
      - 'js/statistics-directory-v2.js'
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'supabase/migrations/20261120_lv1_school_sort_approved_cache.sql'
      - 'tests/public-compare-directory-static.cjs'
      - '.github/workflows/perf-static-directory-lv1-cache-validation.yml'
  push:
    branches: [main]
jobs:
  performance-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public read-only export from live school directory
        run: node scripts/build-public-compare-directory.cjs
      - name: Check public directory and protected cache behavior
        run: node tests/public-compare-directory-static.cjs
      - name: Verify existing school loading fallback
        run: node tests/school-loading-rls-static.cjs
