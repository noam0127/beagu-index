name: Emergency mobile stability (offline WebKit)
on:
  push:
    branches: [fix/v112061-emergency-stability, release/v1.12.07-clean-court]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps webkit
      - name: Offline mobile touch and outage recovery
        run: |
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/emergency-mobile.log 2>&1 &
          node scripts/test-emergency-mobile-v112061.cjs
