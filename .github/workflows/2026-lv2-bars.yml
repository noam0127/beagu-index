name: Lv2 2026 horizontal bar validation
on:
  pull_request:
    paths:
      - 'js/2026-lv2-horizontal-bars-v1.js'
      - 'styles/2026-lv2-horizontal-bars-v1.css'
      - 'js/2026-approved-question-results.js'
      - 'js/level-search.js'
      - 'search-lv1.html'
      - 'tests/2026-lv2-bars.mjs'
      - 'tests/2026-lv2-n1-policy-ui.mjs'
      - 'tests/2026-lv2-school-first-v1.mjs'
      - 'styles/2026-lv2-release-status-v1.css'
      - '.github/workflows/2026-lv2-bars.yml'
  push:
    branches: [main]
    paths:
      - 'js/2026-lv2-horizontal-bars-v1.js'
      - 'styles/2026-lv2-horizontal-bars-v1.css'
      - 'js/2026-approved-question-results.js'
      - 'js/level-search.js'
      - 'search-lv1.html'
      - 'tests/2026-lv2-bars.mjs'
      - 'tests/2026-lv2-n1-policy-ui.mjs'
      - 'tests/2026-lv2-school-first-v1.mjs'
      - 'styles/2026-lv2-release-status-v1.css'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/2026-lv2-bars.mjs
      - run: node tests/2026-school-empty-survey-cta.mjs
      - run: node tests/2026-approved-search-refresh.mjs
      - run: node tests/2026-lv2-n1-policy-ui.mjs
      - run: node tests/2026-lv2-school-first-v1.mjs
