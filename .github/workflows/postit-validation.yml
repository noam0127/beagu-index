name: Post-it validation
on:
  push:
    branches: [feature/postit-school-conversations-20261120, main]
    paths:
      - "postit.html"
      - "challenge.html"
      - "styles/challenge-postit-unity-v1.css"
      - "styles/postit*"
      - "js/postit*"
      - "js/statistics-compare.js"
      - "js/school-search-card-v1.js"
      - "js/arcade-school-picker-v1.js"
      - "statistics.html"
      - "search*.html"
      - "teacher-*.html"
      - "index.html"
      - "supabase/functions/beagu-postit-api-v1/**"
      - "supabase/migrations/*postit*"
      - "tests/postit-static-check.cjs"
      - ".github/workflows/postit-validation.yml"
  pull_request:
    paths:
      - 'postit.html'
      - 'challenge.html'
      - 'styles/challenge-postit-unity-v1.css'
      - 'js/postit*'
      - 'styles/postit*'
      - 'supabase/functions/beagu-postit-api-v1/**'
      - 'tests/postit-static-check.cjs'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/postit-static-check.cjs
