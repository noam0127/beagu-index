name: v1.1.0 — legacy password login compatibility
on:
  push:
    branches:
      - develop/v1.1.0-phase1-20261121
    paths:
      - '.github/workflows/v1.1.0-legacy-password.yml'
      - 'tests/v1.1.0-legacy-password.test.mjs'
      - 'js/challenge-member-auth-v1.js'
      - 'js/postit-account-v1.js'
      - 'js/beagu-admin-enroll-v1.js'
      - 'challenge.html'
      - 'postit.html'
      - 'admin-enroll.html'
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-password:
    name: Short legacy sign-in vs stronger new account signup (fake Auth only)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check js/challenge-member-auth-v1.js
          node --check js/postit-account-v1.js
          node --check js/beagu-admin-enroll-v1.js
          node --check js/beagu-admin-access-v1.js
          node --check tests/v1.1.0-legacy-password.test.mjs
      - name: Run legacy-login and signup separation regression
        run: node --test tests/v1.1.0-legacy-password.test.mjs
