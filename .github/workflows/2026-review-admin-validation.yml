name: 2026 Private Review Admin
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'js/beagu-2026-admin-review.js'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'supabase/migrations/*beagu_2026_admin_private_review_queue.sql'
      - 'tests/2026-review-admin-static.cjs'
      - '.github/workflows/2026-review-admin-validation.yml'
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'js/beagu-2026-admin-review.js'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'supabase/migrations/*beagu_2026_admin_private_review_queue.sql'
      - 'tests/2026-review-admin-static.cjs'
      - '.github/workflows/2026-review-admin-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/2026-review-admin-static.cjs
          node tests/admin-dashboard-static.cjs
          node tests/2026-question-results-pipeline.mjs
          node tests/three-day-release.mjs
