name: 2026 Private Review Admin
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'js/beagu-2026-admin-review.js'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'supabase/migrations/*beagu_2026_admin_private_review_queue.sql'
      - 'supabase/migrations/*beagu_2026_basis_pending_review_audit.sql'
      - 'tests/2026-review-admin-static.cjs'
      - 'tests/2026-review-basis-pending-static.cjs'
      - 'tests/2026-one-response-final-approval-rule.mjs'
      - 'tests/2026-owner-final-approval-static.cjs'
      - 'tests/2026-bulk-verified-static.cjs'
      - 'tests/2026-bulk-400-enabled-static.cjs'
      - 'supabase/migrations/20261123173500_2026_bulk_verified_limit_400.sql'
      - 'supabase/migrations/20261123171500_2026_bulk_verified_school_approval.sql'
      - 'tests/2026-level-final-approval-ui.cjs'
      - 'tests/2026-three-stage-review-flow.mjs'
      - 'supabase/migrations/20261123162500_2026_owner_final_review_publication.sql'
      - 'supabase/migrations/20261123153000_beagu_2026_n1_final_approval_eligible.sql'
      - 'styles/beagu-admin-v1.css'
      - '.github/workflows/2026-review-admin-validation.yml'
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'js/beagu-2026-admin-review.js'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'supabase/migrations/*beagu_2026_admin_private_review_queue.sql'
      - 'supabase/migrations/*beagu_2026_basis_pending_review_audit.sql'
      - 'tests/2026-review-admin-static.cjs'
      - 'tests/2026-review-basis-pending-static.cjs'
      - 'tests/2026-one-response-final-approval-rule.mjs'
      - 'tests/2026-owner-final-approval-static.cjs'
      - 'tests/2026-bulk-verified-static.cjs'
      - 'tests/2026-bulk-400-enabled-static.cjs'
      - 'supabase/migrations/20261123173500_2026_bulk_verified_limit_400.sql'
      - 'supabase/migrations/20261123171500_2026_bulk_verified_school_approval.sql'
      - 'tests/2026-level-final-approval-ui.cjs'
      - 'tests/2026-three-stage-review-flow.mjs'
      - 'supabase/migrations/20261123162500_2026_owner_final_review_publication.sql'
      - 'supabase/migrations/20261123153000_beagu_2026_n1_final_approval_eligible.sql'
      - 'styles/beagu-admin-v1.css'
      - '.github/workflows/2026-review-admin-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/2026-review-admin-static.cjs
          node tests/2026-review-basis-pending-static.cjs
          node tests/2026-one-response-final-approval-rule.mjs
          node tests/2026-owner-final-approval-static.cjs
          node tests/2026-bulk-verified-static.cjs
          node tests/2026-bulk-400-enabled-static.cjs
          node tests/2026-level-final-approval-ui.cjs
          node tests/2026-three-stage-review-flow.mjs
          node tests/admin-dashboard-static.cjs
          node tests/2026-question-results-pipeline.mjs
          node tests/three-day-release.mjs
