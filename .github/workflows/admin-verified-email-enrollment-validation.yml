name: Admin verified-email enrollment validation
on:
  pull_request:
    paths:
      - 'admin-enroll.html'
      - 'js/beagu-admin-enroll-v1.js'
      - 'supabase/migrations/20261120_admin_verified_email_invite_v1.sql'
      - 'tests/admin-verified-email-enrollment-static.cjs'
      - '.github/workflows/admin-verified-email-enrollment-validation.yml'
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-verified-email-enrollment-static.cjs
