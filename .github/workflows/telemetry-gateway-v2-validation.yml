name: Telemetry v2 gateway validation
on:
  pull_request:
    paths:
      - 'supabase/functions/beagu-telemetry-v2/**'
      - 'supabase/migrations/20261120_telemetry_gateway_v2.sql'
      - 'js/visit-stats.js'
      - 'js/beagu-presence-games-v1.js'
      - 'tests/**'
      - '.github/workflows/telemetry-gateway-v2-validation.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/beagu-telemetry-v2/**'
      - 'supabase/migrations/20261120_telemetry_gateway_v2.sql'
      - 'js/visit-stats.js'
      - 'js/beagu-presence-games-v1.js'
      - 'tests/telemetry-abuse-guard-static.cjs'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/beagu-telemetry-v2/index.ts
      - run: node tests/telemetry-abuse-guard-static.cjs
      - run: node tests/admin-live-traffic-static.cjs
      - run: node tests/challenge-search-telemetry.mjs
