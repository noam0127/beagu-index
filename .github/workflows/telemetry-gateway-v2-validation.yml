name: Telemetry v2 gateway validation
on:
  pull_request:
    paths:
      - 'supabase/functions/beagu-telemetry-v2/**'
      - 'supabase/migrations/20261120_telemetry_gateway_v2.sql'
      - 'supabase/migrations/20261120_telemetry_gateway_v2_cutover.sql'
      - 'js/visit-stats.js'
      - 'js/beagu-presence-games-v1.js'
      - 'tests/**'
      - '.github/workflows/telemetry-gateway-v2-validation.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/beagu-telemetry-v2/**'
      - 'supabase/migrations/20261120_telemetry_gateway_v2.sql'
      - 'js/visit-stats.js'
      - 'js/beagu-presence-games-v1.js'
      - 'tests/telemetry-abuse-guard-static.cjs'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/beagu-telemetry-v2/index.ts
      - run: node tests/telemetry-abuse-guard-static.cjs
      - run: node tests/admin-live-traffic-static.cjs
      - run: node tests/telemetry-gateway-client-smoke.cjs
      - run: node tests/challenge-search-telemetry.mjs
      - name: Live gateway non-writing HTTP contract
        run: |
          set -euo pipefail
          endpoint="https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-telemetry-v2"
          response="$(curl --retry 2 --connect-timeout 8 --max-time 15 --fail --silent --show-error "$endpoint")"
          printf '%s' "$response" | grep -q '"status":"ready"'
          code="$(curl --connect-timeout 8 --max-time 15 --silent --show-error \
            -o /tmp/beagu-telemetry-invalid.json -w '%{http_code}' \
            -X POST "$endpoint" -H 'content-type: application/json' \
            --data '{"action":"ping","visitor":"not-a-uuid","page":"index"}')"
          test "$code" = "400"
          code="$(curl --connect-timeout 8 --max-time 15 --silent --show-error \
            -o /tmp/beagu-telemetry-origin.json -w '%{http_code}' \
            -X POST "$endpoint" -H 'origin: https://invalid.example' \
            -H 'content-type: application/json' --data '{}')"
          test "$code" = "403"


      - name: ONE-TIME canary after RPC cutover (remove before merging)
        run: |
          set -euo pipefail
          endpoint="https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-telemetry-v2"
          code="$(curl --connect-timeout 8 --max-time 20 --silent --show-error \
            -o /tmp/beagu-telemetry-cutover-canary.json -w '%{http_code}' \
            -X POST "$endpoint" -H 'content-type: application/json' \
            --data '{"action":"ping","visitor":"aaaacccc-0000-4000-8000-000000000002","page":"other"}')"
          cat /tmp/beagu-telemetry-cutover-canary.json
          test "$code" = "200"
          grep -q '"ok":true' /tmp/beagu-telemetry-cutover-canary.json
