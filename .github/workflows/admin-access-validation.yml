name: Admin access static checks
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'styles/beagu-admin-v1.css'
      - 'supabase/functions/beagu-admin-access/**'
      - 'supabase/migrations/20261120_admin_visit_search_exclusion.sql'
      - 'supabase/functions/arcade-leaderboard/index.ts'
      - 'js/arcade-leaderboard-v1.js'
      - 'teacher-run.html'
      - 'teacher-volleyball.html'
      - 'supabase/migrations/20261120_admin_access_mfa_audit.sql'
      - 'scripts/test-admin-access.cjs'
      - 'scripts/test-admin-access-live.cjs'
      - '.github/workflows/admin-access-validation.yml'
  push:
    branches:
      - feature/admin-access-mfa-20261120
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify admin access is isolated and TOTP is mandatory
        run: node scripts/test-admin-access.cjs
      - name: Live unauthenticated API, RLS and method smoke
        run: node scripts/test-admin-access-live.cjs