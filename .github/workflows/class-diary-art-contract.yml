name: Class diary illustrated art contract
on:
  push:
    branches: [main]
    paths:
      - 'docs/class-diary-stage7-art-bible.md'
      - 'data/class-diary-art-manifest-v1.json'
      - 'scripts/test-class-diary-art-contract.cjs'
      - 'assets/class-diary/**'
      - '.github/workflows/class-diary-art-contract.yml'
  pull_request:
    paths:
      - 'data/class-diary-art-manifest-v1.json'
      - 'scripts/test-class-diary-art-contract.cjs'
      - 'assets/class-diary/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify planned/ready image asset contract
        run: node scripts/test-class-diary-art-contract.cjs
      - name: Preserve current SVG fallback behavior
        run: node scripts/test-class-diary-visual.cjs
