name: Class Diary fictional student character regression
on:
  push:
    branches: [main]
    paths:
      - 'assets/class-diary/characters/doyun-four-expressions.webp'
      - 'js/class-diary-student-doyun-v1.js'
      - 'styles/class-diary-student-doyun-v1.css'
      - 'teacher-class-diary-play.html'
      - 'scripts/test-class-diary-doyun.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-doyun.cjs
