name: Stage38 signed real-file publisher E2E proof (DISABLED, READ ONLY)
# Genuine GitHub OIDC + Git publication A→B→A + atomic DB integration:
# PASS in GitHub Actions 45031135725. Temporary privileged Edge API = HTTP 410.
# The fixture SQL RPC was removed from staging after confirming zero release jobs.
on:
  pull_request:
    paths:
      - '.github/workflows/stage38-signed-publish-worker-e2e.yml'
      - 'tests/stage38-signed-publish-worker-e2e.py'
      - 'tests/fixtures/stage38-signed-publish-worker-once/**'
      - 'tests/fixtures/stage38-signed-publish-worker-e2e.sql'
permissions:
  contents: read
jobs:
  prove-signed-publisher-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify historical publisher SHA attestations, safe scoped Git branch and OIDC gate
        run: |
          set -euo pipefail
          python3 -m py_compile tests/stage38-signed-publish-worker-e2e.py
          python3 - <<'PY'
          from pathlib import Path
          edge=Path('tests/fixtures/stage38-signed-publish-worker-once/index.ts').read_text()
          runner=Path('tests/stage38-signed-publish-worker-e2e.py').read_text()
          fixture=Path('tests/fixtures/stage38-signed-publish-worker-e2e.sql').read_text()
          assert 'ycwuugggqbunlbwuzvbx' in edge and 'ycwuugggqbunlbwuzvbx' in fixture
          assert 'snvzwrexuqavnfvzgxqj' in fixture
          assert 'jwtVerify(bearer,trustedJWKS' in edge
          assert 'payload.ref!=="refs/pull/244/merge"' in edge
          assert 'payload.workflow_ref!==WORKFLOW' in edge
          assert 'publishedBranchAt(queued.from_sha)' in edge
          assert 'publishedBranchAt(job.to_sha)' in edge
          assert 'crypto.randomUUID()' in edge and 'cache:"no-store"' in edge
          assert 'sandbox_branch_not_at_claimed_sha' in edge
          assert 'sandbox_branch_not_at_claimed_source_sha' in edge
          assert 'beagu_site_release_finalize_v1' in edge
          assert 'stage38-oidc-atomic-publish-rc-5c95aad' in runner
          assert '--force-with-lease=refs/heads/' in runner
          assert 'branch_head("main")==main_before' in runner
          assert "DELETE FROM public.beagu_site_release_jobs_v1" in fixture
          assert "WHERE target='staging' AND version IN" in fixture
          assert 'GRANT EXECUTE ON FUNCTION public.beagu_stage38_signed_publish_worker_fixture_v1' in fixture
          print('PASS: historic signed worker was bound to isolated sandbox, fresh SHA checks and service-only DB')
          PY
      - name: Check privileged temporary publisher cannot run again
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://ycwuugggqbunlbwuzvbx.supabase.co/functions/v1/beagu-stage38-signed-publish-worker-once'
          code=$(curl --silent --show-error --max-time 18 \
            --output /tmp/stage38-disabled.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' --data '{"action":"prepare"}' "$endpoint")
          test "$code" = 410
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/stage38-disabled.json',encoding='utf-8'))
          assert data.get('status')=='DISABLED'
          assert data.get('reason')=='STAGE38_SIGNED_REAL_PUBLISH_QA_COMPLETE'
          print('PASS: staging signed publisher HTTP 410; no operational release actions available')
          PY
      - name: Check independent public sandbox branch remains restored to A
        run: |
          set -euo pipefail
          actual=$(git ls-remote --heads https://github.com/noam0127/beagu-index.git \
            refs/heads/stage38-oidc-atomic-publish-rc-5c95aad | cut -f1)
          test "$actual" = '037a14afa252c52eaa130d7cbe2e08e649adf5bd'
          echo 'PASS: sandbox restored to immutable A and production branch untouched'
