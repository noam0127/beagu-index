name: Stage38 actual pinned RC packaging audit (NO DEPLOY)
on:
  push:
    branches: ['hotfix/v1.1.0-preview-backend-isolation']
    paths:
      - 'scripts/release-manager/worker.py'
      - 'tests/stage38-real-rc-packaging.py'
      - 'tests/stage38-browser-smoke.cjs'
      - 'scripts/release-manager/build-offline-rc-bundle.py'
      - '.github/workflows/stage38-real-rc-package-audit.yml'
  pull_request:
    paths:
      - 'scripts/release-manager/worker.py'
      - 'tests/stage38-real-rc-packaging.py'
      - 'tests/stage38-browser-smoke.cjs'
      - '.github/workflows/stage38-real-rc-package-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-rc-offline:
    # Chromium install currently unsupported on ubuntu-26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm immutable release candidate commit available
        run: |
          git cat-file -t 5c95aadad971901a8222f83c52e93bf901a3aeb7
          test "$(git rev-parse refs/remotes/origin/release/v1.1.0-rc.1)" = "5c95aadad971901a8222f83c52e93bf901a3aeb7"
      - name: Package real RC with staging backend and audit (offline)
        run: python3 tests/stage38-real-rc-packaging.py
      - name: Assemble isolated public review artifact from pinned RC (no deploy)
        run: python3 scripts/release-manager/build-offline-rc-bundle.py
      - name: Install temporary headless browser tooling (CI only)
        run: |
          npm install --prefix .stage38-browser-deps --no-save --no-package-lock playwright@1.56.1
          .stage38-browser-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify rendered RC pages and block any production network requests
        env:
          NODE_PATH: .stage38-browser-deps/node_modules
        run: node tests/stage38-browser-smoke.cjs
      - name: Upload short-lived review artifact (not a site release)
        uses: actions/upload-artifact@v4
        with:
          name: beagu-v1.1.0-rc.1-independent-preview-review
          path: _preview_standalone_site/
          if-no-files-found: error
          # Upload-artifact excludes dotfiles by default; .nojekyll is in the signed manifest.
          include-hidden-files: true
          retention-days: 7
      - name: No publication or release controller action
        run: echo "This test used an isolated synthetic plan in a temp directory and did not deploy."
