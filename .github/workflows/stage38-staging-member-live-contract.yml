      - 'supabase/migrations/20261121093000_referral_funnel_private_v1.sql'
      - 'tests/stage38-staging-telemetry-health-regression.sql'
      - 'supabase/migrations/stage38_staging_admin_telemetry_health_rpc.sql'
      - 'supabase/migrations/20261120_telemetry_gateway_v2.sql'
      - 'supabase/migrations/20261120_telemetry_guard_decision_monitoring.sql'
      - 'tests/stage38-staging-live-presence-regression.sql'
      - 'tests/stage38-staging-admin-live-traffic-regression.sql'
      - 'supabase/migrations/stage38_staging_live_presence_foundation.sql'
      - 'supabase/migrations/stage38_staging_visits_and_admin_live_traffic.sql'
      - 'supabase/migrations/20261120_admin_hourly_live_presence.sql'
      - 'supabase/migrations/20261120_admin_visit_search_exclusion.sql'
      - 'supabase/migrations/20261120_telemetry_visit_presence_guard.sql'
      - 'supabase/migrations/20261120_telemetry_v2_public_rpc_cutover.sql'
      - 'tests/stage38-staging-admin-page-perf-regression.sql'
      - 'supabase/migrations/stage38_staging_admin_page_perf_rpc.sql'
      - 'supabase/migrations/20261120_admin_page_perf_v1.sql'
      - '.github/workflows/stage38-staging-member-live-contract.yml'
  pull_request:
    paths:
      - 'tests/fixtures/stage38-staging-admin-members-live-v2/**'
      - 'tests/stage38-staging-member-live-contract.cjs'
      - 'tests/fixtures/stage38-staging-admin-access-v1/**'
      - 'tests/stage38-staging-admin-access-contract.cjs'
      - 'tests/fixtures/stage38-staging-admin-dashboard-v1/**'
      - 'tests/stage38-staging-admin-dashboard-contract.cjs'
      - 'tests/stage38-page-perf-contract.cjs'
      - 'tests/stage38-staging-live-traffic-contract.cjs'
      - 'tests/stage38-staging-telemetry-health-contract.cjs'
      - 'tests/stage38-staging-referral-funnel-contract.cjs'
      - 'tests/stage38-staging-dashboard-aggregate-contract.cjs'
      - 'tests/stage38-staging-release-readonly-contract.cjs'
      - 'tests/fixtures/stage38-staging-release-manager-readonly-v1/**'
      - 'tests/stage38-staging-dashboard-aggregate-regression.sql'
      - 'tests/fixtures/stage38-staging-dashboard-rpc.sql'
      - 'tests/fixtures/stage38-staging-dashboard-tables.sql'
      - 'supabase/migrations/20261120_admin_dashboard_v1.sql'
      - 'tests/stage38-staging-referral-funnel-regression.sql'
      - 'supabase/migrations/stage38_staging_referral_funnel_rpc.sql'
      - 'supabase/migrations/20261121093000_referral_funnel_private_v1.sql'
      - 'tests/stage38-staging-telemetry-health-regression.sql'
      - 'supabase/migrations/stage38_staging_admin_telemetry_health_rpc.sql'
