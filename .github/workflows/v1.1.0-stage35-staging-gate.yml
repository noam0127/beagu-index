name: v1.1.0 stage35 staging-only anonymous-denial gate
on:
  push:
    branches: ['develop/v1.1.0-lv3']
    paths:
      - 'tests/v1.1.0-stage35-staging-deny.py'
      - '.github/workflows/v1.1.0-stage35-staging-gate.yml'
  pull_request:
    paths:
      - 'tests/v1.1.0-stage35-staging-deny.py'
      - '.github/workflows/v1.1.0-stage35-staging-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-anonymous-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only unauthorized requests to isolated staging only
        run: python3 tests/v1.1.0-stage35-staging-deny.py
      - name: Coverage warning
        if: always()
        run: |
          echo "No production requests, user creation, database writes, or secrets."
          echo "Passing this check is NOT completion of stage 35."

  admin-only-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify real staging admin API denies anonymous call
        run: |
          python3 - <<'PY'
          import runpy
          t=runpy.run_path('tests/v1.1.0-stage35-staging-deny.py',run_name='staging_security_library')
          assert t['probe'](*t['PROBES'][2]), 'Staging admin endpoint must deny unauthenticated request'
          PY
      - name: Security scope notice
        run: echo "Anonymous denial only; never infer valid admin MFA or cross-account permission success."
