name: Admin traffic dashboard validation
on:
  pull_request:
    paths:
      - "admin.html"
      - "js/visit-stats.js"
      - "js/beagu-admin-access-v1.js"
      - "js/beagu-presence-games-v1.js"
      - "supabase/functions/beagu-admin-dashboard-v1/index.ts"
      - "supabase/migrations/20261120_admin_hourly_live_presence.sql"
      - "tests/admin-live-traffic-static.cjs"
      - ".github/workflows/admin-live-traffic-validation.yml"
  push:
    branches: [main]
    paths:
      - "admin.html"
      - "js/visit-stats.js"
      - "js/beagu-admin-access-v1.js"
      - "js/beagu-presence-games-v1.js"
      - "supabase/functions/beagu-admin-dashboard-v1/index.ts"
      - "supabase/migrations/20261120_admin_hourly_live_presence.sql"
      - "tests/admin-live-traffic-static.cjs"
jobs:
  static-traffic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-live-traffic-static.cjs
