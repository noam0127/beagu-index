name: Admin dashboard security gate
on:
  push:
    branches: [main, feature/admin-dashboard-live-20261120]
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'styles/beagu-admin-v1.css'
      - 'supabase/functions/beagu-admin-dashboard-v1/**'
      - 'supabase/migrations/20261120_admin_dashboard_v1.sql'
      - 'supabase/migrations/20261120_admin_mfa_session_collector_guard.sql'
      - 'tests/admin-dashboard-static.cjs'
      - 'tests/admin-dashboard-live.cjs'
      - 'supabase/functions/beagu-admin-access/**'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'tests/admin-auth-authorization-static.cjs'
      - 'tests/admin-auth-authorization-live.cjs'
      - '.github/workflows/admin-dashboard-security.yml'
  pull_request:
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'styles/beagu-admin-v1.css'
      - 'supabase/functions/beagu-admin-dashboard-v1/**'
      - 'supabase/migrations/20261120_admin_dashboard_v1.sql'
      - 'supabase/migrations/20261120_admin_mfa_session_collector_guard.sql'
      - 'tests/admin-dashboard-static.cjs'
      - 'tests/admin-dashboard-live.cjs'
      - 'supabase/functions/beagu-admin-access/**'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'tests/admin-auth-authorization-static.cjs'
      - 'tests/admin-auth-authorization-live.cjs'
      - '.github/workflows/admin-dashboard-security.yml'
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-dashboard-static.cjs
      - run: node tests/admin-dashboard-live.cjs
      - run: node tests/admin-auth-authorization-static.cjs
      - run: node tests/admin-auth-authorization-live.cjs
