name: v1.1.0 stage35 member identity and admin ownership
on:
  push:
    branches: ['develop/v1.1.0-lv3']
    paths:
      - 'tests/v1.1.0-stage35-member-admin-ownership.mjs'
      - '.github/workflows/v1.1.0-stage35-member-admin-ownership.yml'
  pull_request:
    paths:
      - 'supabase/functions/beagu-postit-api-v1/index.ts'
      - 'supabase/functions/beagu-admin-members-v1/index.ts'
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'tests/v1.1.0-stage35-member-admin-ownership.mjs'
      - '.github/workflows/v1.1.0-stage35-member-admin-ownership.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  member-admin-owner-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server identity linkage and administrator MFA gates
        run: node tests/v1.1.0-stage35-member-admin-ownership.mjs
      - name: Coverage notice
        run: |
          echo "Static only: two actual authenticated staging users required for full IDOR proof."
