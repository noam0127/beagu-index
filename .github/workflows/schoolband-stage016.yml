name: Schoolband 016 guided 3-screen mobile UX smoke

on:
  push:
    branches: [schoolband-playtest]
    paths:
      - 'games/nangam-schoolband-v08/index.html'
      - 'scripts/test-schoolband-stage016.cjs'
      - '.github/workflows/schoolband-stage016.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-stepper:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static source and accessible 3-screen contracts
        run: node scripts/test-schoolband-stage016.cjs
      - name: Install actual Chromium for responsive and legacy game tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium --only-shell
      - name: PC 1280 and mobile 320 375 school search, 4 instruments, screenshots and start stop
        run: node scripts/test-schoolband-stage016.cjs --browser
      - name: Preserve generated 20 chart trials on both PC and mobile
        run: node scripts/test-schoolband-stage015.cjs --browser
      - name: Preserve all 20 original N-lane key and touch chart integrations
        run: node scripts/test-schoolband-stage008.cjs --browser
      - name: Preserve clock, judgement and 7th-stage resume contracts
        run: |
          node scripts/test-schoolband-stage005.cjs
          node scripts/test-schoolband-stage007.cjs
      - name: Save responsive screenshots and reproducible test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolband-stage016-ux-screenshots-and-proof
          path: artifacts/schoolband-stage016/
          if-no-files-found: error
