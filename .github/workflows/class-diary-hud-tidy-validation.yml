name: Class Diary compact HUD checks
on:
  pull_request:
    paths:
      - 'teacher-class-diary-play.html'
      - 'styles/class-diary-hud-tidy-v1.css'
      - 'styles/class-diary-subtitle-lite-v1.css'
      - 'tests/arcade-caption-mobile-controls.mjs'
      - 'js/class-diary-hud-tidy-v1.js'
      - 'scripts/test-class-diary-hud-tidy.cjs'
      - '.github/workflows/class-diary-hud-tidy-validation.yml'
  push:
    branches: [main]
    paths:
      - 'teacher-class-diary-play.html'
      - 'styles/class-diary-hud-tidy-v1.css'
      - 'styles/class-diary-subtitle-lite-v1.css'
      - 'tests/arcade-caption-mobile-controls.mjs'
      - 'js/class-diary-hud-tidy-v1.js'
      - 'scripts/test-class-diary-hud-tidy.cjs'
      - '.github/workflows/class-diary-hud-tidy-validation.yml'
permissions:
  contents: read
jobs:
  hud-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-hud-tidy.cjs
      - run: node scripts/test-class-diary-play-page.cjs
      - run: node tests/arcade-caption-mobile-controls.mjs
