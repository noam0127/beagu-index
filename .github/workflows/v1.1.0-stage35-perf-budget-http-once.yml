name: v1.1.0 stage35 one-time public telemetry cap HTTP
on:
  push:
    branches: ['develop/v1.1.0-lv3']
    paths:
      - 'tests/v1.1.0-stage35-perf-budget-http-once.py'
      - '.github/workflows/v1.1.0-stage35-perf-budget-http-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-telemetry-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate atomic global telemetry cap with eight fake anonymous visitors
        run: python3 tests/v1.1.0-stage35-perf-budget-http-once.py
      - name: Scope
        run: |
          echo "Staging only: seed current hour budget=9996 first; cleanup manually afterward."
          echo "No production DB, site, migration or service-role credentials touched."
