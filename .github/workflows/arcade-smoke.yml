name: Arcade games & Top 10 smoke test
on:
  push:
    branches: [main]
    paths:
      - 'teacher-volleyball.html'
      - 'teacher-run.html'
      - 'js/arcade-mystery-items-v1.js'
      - 'js/arcade-bgm-v1.js'
      - 'tests/arcade-bgm-v1.mjs'
      - 'tests/arcade-item-upgrade-v1.mjs'
      - 'index.html'
      - 'js/arcade-leaderboard-v1.js'
      - 'js/arcade-history-v1.js'
      - 'js/level-search.js'
      - 'school-link.html'
      - 'arcade-history.html'
      - 'tests/arcade-school-link.mjs'
      - 'js/arcade-fullscreen-v1.js'
      - 'js/beagu-game-lv1-gate-v1.js'
      - 'styles/arcade-cabinet-v1.css'
      - 'styles/arcade-fullscreen-v1.css'
      - 'supabase/functions/arcade-leaderboard/index.ts'
      - 'tests/arcade-smoke.mjs'
      - '.github/workflows/arcade-smoke.yml'
  pull_request:
    paths:
      - 'tests/arcade-smoke.mjs'
      - 'teacher-volleyball.html'
      - 'teacher-run.html'
      - 'index.html'
      - 'js/arcade-leaderboard-v1.js'
      - '.github/workflows/arcade-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Live arcade and ranking integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify licensed BGM autoplay, pause/mute and mobile fallback
        run: node tests/arcade-bgm-v1.mjs
      - name: Check game HUD and item scoring contract
        run: node tests/arcade-item-upgrade-v1.mjs
      - name: Verify ranking school links and level access
        run: node tests/arcade-school-link.mjs
      - name: Check game scripts and deployed arcade ranking
        run: node tests/arcade-smoke.mjs
