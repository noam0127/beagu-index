name: School loading performance and RLS regression
on:
  pull_request:
    paths:
      - 'js/statistics-directory-v2.js'
      - 'js/statistics-compare.js'
      - 'js/level-search.js'
      - 'js/arcade-school-picker-v1.js'
      - 'supabase/functions/arcade-leaderboard/index.ts'
      - 'supabase/migrations/20261120_class_diary_preview_rls_hardening.sql'
      - 'tests/school-loading-rls-static.cjs'
      - '.github/workflows/school-loading-rls-validation.yml'
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify safe progressive loading and SQL privileges
        run: node tests/school-loading-rls-static.cjs
