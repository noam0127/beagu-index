name: Clean release code-only validation
on:
  pull_request:
    branches:
      - 'release/base-pages-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and simulated DOM
        run: |
          node --check js/beagu-release-info-v1.js
          node tests/clean-release-contract.cjs
          node tests/clean-release-info-runtime.cjs
          node tests/playground-contract.cjs
          node tests/playback-contract.cjs
          node tests/challenge-certificate-privacy-v1.mjs
          node scripts/test-challenge-referral-premium.cjs
          node scripts/test-challenge-lv2-card.cjs
          node tests/milestone-contract.cjs
          node tests/communication-contract.cjs
          node tests/beagu-notice-pages-v1.mjs
          node tests/notice-audience-server.mjs
          python3 -m py_compile scripts/release-manager/stamp_release_info.py
      - name: Verify isolated notice API (read and denied access only)
        run: node tests/notice-audience-live.mjs
      - name: Install pinned Chromium browser test tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            "$browser" --version
            echo "BEAGU_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            timeout 120s npx playwright install chromium --only-shell
          fi
      - name: Verify playground in Chromium (offline intercepted requests)
        run: |
          node tests/playground-browser.cjs
          node tests/playback-browser.cjs
          node tests/milestone-browser.cjs
          node tests/communication-browser.cjs
      - name: Verify selected artifact metadata
        run: |
          python3 - <<'PY'
          import importlib.util, tempfile, pathlib, json, shutil
          p = pathlib.Path('scripts/release-manager/stamp_release_info.py')
          spec = importlib.util.spec_from_file_location('stamp', p)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as directory:
              target = pathlib.Path(directory)
              shutil.copy('release-info.json', target / 'release-info.json')
              assert m.stamp(target, 'a'*40, 'production')
              data = json.loads((target / 'release-info.json').read_text())
              assert data['commit'] == 'a'*40 and data['environment'] == 'production'
              assert data['deployedAt'] is None and data['builtAt']
              try:
                  m.stamp(target, 'invalid', 'production')
              except ValueError:
                  pass
              else:
                  raise AssertionError('invalid SHA accepted')
          PY
