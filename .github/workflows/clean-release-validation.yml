name: Clean release code-only validation
on:
  pull_request:
    branches:
      - 'release/base-pages-*'
  workflow_dispatch:
  push:
    branches: [fix/v1.11.1-light-touch-production-base, fix/v1.11.2-together-production-base, release/v1.11.4-waterway, release/v1.11.3-homecourt-independent, release/v1.11.9-medals, release/v1.11.13-minimal-court, release/v1.11.14-school-glory, release/v1.11.15-fire-court, fix/v1.11.13-admin-2026-compact, fix/v1.11.13.2-admin-draft-input]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify source and simulated DOM
        run: |
          node --check js/beagu-release-info-v1.js
          node tests/homecourt-position-v1.mjs
          node tests/clean-release-contract.cjs
          node tests/v1111-light-touch-contract.cjs
          node --check js/school-search-card-v1.js
          node --check js/school-game-points-v1.js
          node tests/clean-release-info-runtime.cjs
          node tests/playground-contract.cjs
          node tests/playback-contract.cjs
          node tests/arcade-caption-mobile-controls.mjs
          node tests/participation-code-unified.mjs
          node tests/challenge-lv2-account-entry.mjs
          node tests/challenge-certificate-privacy-v1.mjs
          node scripts/test-challenge-referral-premium.cjs
          node scripts/test-challenge-lv2-card.cjs
          node tests/milestone-contract.cjs
          node tests/communication-contract.cjs
          node tests/beagu-notice-pages-v1.mjs
          node tests/notice-audience-server.mjs
          node tests/control-tower-contract.cjs
          node tests/referral-promotion-v1.cjs
          node tests/2026-public-projection-integrity.mjs
          node tests/2026-question-results-pipeline.mjs
          node tests/2026-release-consent-gate.mjs
          node tests/2026-public-revalidation-fail-closed.mjs
          node tests/2026-level-final-approval-ui.cjs
          python3 -m py_compile scripts/release-manager/stamp_release_info.py
      - name: Verify isolated notice API (read and denied access only)
        run: node tests/notice-audience-live.mjs
      - name: Install pinned Chromium browser test tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1 html2canvas@1.4.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            "$browser" --version
            echo "BEAGU_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            timeout 120s npx playwright install chromium --only-shell
          fi
      - name: Verify playground in Chromium (offline intercepted requests)
        run: |
          node tests/playground-browser.cjs
          node tests/v1111-light-touch-browser.cjs
          node tests/playback-browser.cjs
          node tests/milestone-browser.cjs
          node tests/communication-browser.cjs
          node tests/control-tower-browser.cjs
          node tests/admin-2026-compact-browser.cjs
          node tests/admin-release-draft-browser.cjs
      - name: Verify Together actual Chromium downloads and search regression
        run: |
          set -euo pipefail
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/v1112-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8124/challenge.html >/dev/null && break; sleep 1; done
          node tests/v1112-together-offline-browser.cjs
      - name: Retain fixture certificate and screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1112-chromium-fixture-evidence
          path: artifacts/v1112/
          if-no-files-found: ignore
      - name: Verify selected artifact metadata
        run: |
          python3 - <<'PY'
          import importlib.util, tempfile, pathlib, json, shutil
          p = pathlib.Path('scripts/release-manager/stamp_release_info.py')
          spec = importlib.util.spec_from_file_location('stamp', p)
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as directory:
              target = pathlib.Path(directory)
              shutil.copy('release-info.json', target / 'release-info.json')
              assert m.stamp(target, 'a'*40, 'production')
              data = json.loads((target / 'release-info.json').read_text())
              assert data['commit'] == 'a'*40 and data['environment'] == 'production'
              assert data['deployedAt'] is None and data['builtAt']
              try:
                  m.stamp(target, 'invalid', 'production')
              except ValueError:
                  pass
              else:
                  raise AssertionError('invalid SHA accepted')
          PY

      - name: Verify atomic transitions in disposable PostgreSQL
        run: |
          set -euo pipefail
          container="beagu-release-db-${GITHUB_RUN_ID}"
          docker run -d --rm --name "$container" -e POSTGRES_PASSWORD=fixture-only postgres:16
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do
            if docker exec "$container" pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          psql_local() { docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres; }
          printf '%s\n' 'create role anon;' 'create role authenticated;' 'create role service_role bypassrls;' | psql_local
          psql_local < supabase/migrations/20261121_site_release_manager.sql
          psql_local < supabase/migrations/20261121_site_release_directory_overlay.sql
          psql_local < supabase/release-transition-v2.sql
          psql_local <<'SQL'
          do $$
          begin
            if has_function_privilege('anon','public.beagu_release_transition_v2(text,jsonb)','execute')
              or has_function_privilege('authenticated','public.beagu_release_transition_v2(text,jsonb)','execute')
              or not has_function_privilege('service_role','public.beagu_release_transition_v2(text,jsonb)','execute')
            then raise exception 'incorrect RPC grants'; end if;
          end $$;
          set role service_role;
          do $$
          declare a text := repeat('a',40); b text := repeat('b',40); c text := repeat('c',40);
            r jsonb; job uuid; payload jsonb;
          begin
            update public.beagu_site_release_state_v1 set production_sha=a, production_version='v1.6.0' where id=1;
            r:=public.beagu_release_transition_v2('register',jsonb_build_object('base',c,'sha',b,'version','v1.7.0','summary','fixture'));
            if r->>'error' is distinct from 'direct_draft_conflict' then raise exception 'stale register: %',r; end if;
            r:=public.beagu_release_transition_v2('register',jsonb_build_object('base',a,'sha',b,'version','v1.7.0','summary','fixture'));
            if r->>'draft_sha' is distinct from b then raise exception 'register: %',r; end if;
            payload:=jsonb_build_object('action','prod_apply','from_sha',a,'to_sha',b,'version','v1.7.0','summary','fixture');
            r:=public.beagu_release_transition_v2('enqueue',payload || jsonb_build_object('from_sha',c));
            if r->>'error' is distinct from 'direct_confirmation_required' then raise exception 'stale enqueue: %',r; end if;
            r:=public.beagu_release_transition_v2('enqueue',payload);
            job:=(r->>'id')::uuid;
            if job is null then raise exception 'enqueue: %',r; end if;
            r:=public.beagu_release_transition_v2('enqueue',payload);
            if r->>'error' is distinct from 'release_in_progress' then raise exception 'duplicate enqueue: %',r; end if;
            r:=public.beagu_release_transition_v2('reserve_dispatch',jsonb_build_object('job_id',job,'candidate_sha',c));
            if r->>'error' is distinct from 'direct_confirmation_required' then raise exception 'wrong dispatch SHA: %',r; end if;
            r:=public.beagu_release_transition_v2('reserve_dispatch',jsonb_build_object('job_id',job,'candidate_sha',b));
            if r->>'ok' is distinct from 'true' then raise exception 'reserve: %',r; end if;
            r:=public.beagu_release_transition_v2('reserve_dispatch',jsonb_build_object('job_id',job,'candidate_sha',b));
            if r->>'error' is distinct from 'dispatch_rate_limited' then raise exception 'rate limit: %',r; end if;
            r:=public.beagu_release_transition_v2('complete',jsonb_build_object('job_id',job));
            if r->>'error' is distinct from 'job_not_running' then raise exception 'unstarted completion: %',r; end if;
            update public.beagu_site_release_jobs_v1 set status='running' where id=job;
            update public.beagu_site_release_state_v1 set production_sha=c where id=1;
            r:=public.beagu_release_transition_v2('complete',jsonb_build_object('job_id',job));
            if r->>'error' is distinct from 'stale_production_base' then raise exception 'stale complete: %',r; end if;
            if exists(select 1 from public.beagu_site_release_history_v1 where job_id=job) then raise exception 'stale completion created history'; end if;
            update public.beagu_site_release_state_v1 set production_sha=a where id=1;
            r:=public.beagu_release_transition_v2('complete',jsonb_build_object('job_id',job));
            if r->>'ok' is distinct from 'true' then raise exception 'complete: %',r; end if;
            r:=public.beagu_release_transition_v2('complete',jsonb_build_object('job_id',job));
            if r->>'ok' is distinct from 'true' then raise exception 'idempotent complete: %',r; end if;
            if (select count(*) from public.beagu_site_release_history_v1 where job_id=job) <> 1
              or (select production_sha from public.beagu_site_release_state_v1 where id=1) is distinct from b
              or (select status from public.beagu_site_release_jobs_v1 where id=job) is distinct from 'deployed'
            then raise exception 'atomic final state mismatch'; end if;
            r:=public.beagu_release_transition_v2('register',jsonb_build_object('base',b,'expected_draft',b,'sha',c,'version','v1.7.0','summary','fixture'));
            if r->>'error' is distinct from 'version_already_used' then raise exception 'reused version: %',r; end if;
            raise notice 'PASS: RPC grants, stale SHA, duplicate enqueue, dispatch throttling, atomic completion and version reuse';
          end $$;
          SQL
          psql_local < tests/referral-quality-postgres.sql
          psql_local < supabase/migrations/20261121010500_beagu_referral_quality_risk_gate.sql
          psql_local < supabase/migrations/20261121020000_referral_single_quality_gate_restore.sql
          psql_local <<'SQL'
          create schema extensions;
          create extension pgcrypto with schema extensions;
          create table beagu_private.challenge_identity_codes(campaign text, visitor_id uuid, identity_code text);
          SQL
          psql_local < supabase/migrations/20261121_earned_challenge_participation_auth.sql
          psql_local < tests/referral-quality-postgres-assertions.sql

          docker exec "$container" createdb -U postgres beagu_data_fixture
          psql_data() { docker exec -i "$container" psql -X -v ON_ERROR_STOP=1 -U postgres -d beagu_data_fixture; }
          psql_data < tests/2026-reconciliation-postgres.sql
          psql_data < supabase/migrations/20261123180000_2026_level_final_release_controls.sql
          psql_data < supabase/2026-release-reconciliation-v1.sql
          psql_data < tests/2026-reconciliation-postgres-assertions.sql

          node tests/2026-civic-hold-ui.cjs
          psql_data < tests/2026-civic-hold-fixture.sql
          psql_data < supabase/migrations/20261123190000_beagu_2026_civic_feedback.sql
          psql_data < supabase/2026-civic-publication-hold-v1.sql
          psql_data < tests/2026-civic-hold-assertions.sql
