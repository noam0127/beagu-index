name: Locker room v1.11.25 isolated PostgreSQL validation
on:
  push:
    branches: [feature/v1.11.25-locker-room]
  pull_request:
    branches: [feature/v1.11.24-my-account]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: locker_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/locker-school-links-v11125.mjs
      - run: node tests/locker-room-policy-v11125.mjs
      - run: node tests/locker-room-auth-v11125.mjs
      - run: node tests/locker-room-identity-v11125.mjs
      - run: node --experimental-strip-types tests/account-v1-edge.mjs
      - name: Run isolated PostgreSQL fixtures
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d locker_fixture -v ON_ERROR_STOP=1 -f tests/locker-room-postgres-v11125.sql
          psql -h 127.0.0.1 -p 5432 -U postgres -d locker_fixture -v ON_ERROR_STOP=1 -f tests/locker-room-replies-v11125.sql
      - name: Actual anonymous account SQL and ownership regression in second fixture DB
        env:
          PGPASSWORD: fixture-only
          PGHOST: 127.0.0.1
          PGUSER: postgres
        run: |
          set -euo pipefail
          createdb account_fixture
          export PGDATABASE=account_fixture
          psql -X -v ON_ERROR_STOP=1 -f tests/account-v1-postgres-fixture.sql
          for migration in 20261121103000_beagu_postit_member_auth 20261120_beagu_postit_school_conversations 20261120_beagu_postit_session_identity 20261120_beagu_postit_game_subjects 20261120_beagu_postit_comparison_subjects 20261120_beagu_postit_game_school_refs 20261121140000_beagu_postit_atomic_write; do
            psql -X -v ON_ERROR_STOP=1 -f "supabase/migrations/$migration.sql"
          done
          psql -X -v ON_ERROR_STOP=1 -c "INSERT INTO public.beagu_postit_member_accounts(auth_user_id,identity_visitor_id,author_uid) VALUES('00000000-0000-0000-0000-000000000002','10000000-0000-0000-0000-000000000002','60000000-0000-4000-8000-000000000002')"
          psql -X -v ON_ERROR_STOP=1 -f supabase/account-identity-v1.sql
          psql -X -v ON_ERROR_STOP=1 --single-transaction -f supabase/account-provisional-v1.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/v1.11.25-locker-room-schema-preview.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/account-v1-postgres-assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/v1.11.25-locker-replies-preview.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $actor$
          declare a uuid;
          begin
           a:=public.beagu_account_postit_writer_v1(repeat('7',64));
           if a is null or public.beagu_locker_notification_actor_v1(repeat('7',64)) is distinct from a then raise exception 'verified account notification actor mismatch';end if;
           if public.beagu_locker_notification_actor_v1(repeat('z',64)) is not null or public.beagu_locker_notification_actor_v1(repeat('0',64)) is not null then raise exception 'unverified notification actor';end if;
           update beagu_private.beagu_anonymous_accounts_v1 set enabled=false where author_uid=a;
           if public.beagu_locker_notification_actor_v1(repeat('7',64)) is not null then raise exception 'revoked notification access';end if;
           raise notice 'PASS actual account notification identity and revocation';
          end $actor$;
          rollback;
          SQL
