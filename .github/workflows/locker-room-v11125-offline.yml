name: Locker room v1.11.25 isolated PostgreSQL validation
on:
  push:
    branches: [feature/v1.11.25-locker-room]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: locker_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/locker-room-policy-v11125.mjs
      - name: Run isolated PostgreSQL fixtures
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -p 5432 -U postgres -d locker_fixture -v ON_ERROR_STOP=1 -f tests/locker-room-postgres-v11125.sql
