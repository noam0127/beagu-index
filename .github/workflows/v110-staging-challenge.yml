name: v1.1.0 stage challenge device-bound issue security smoke
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-challenge-identity/**'
      - 'scripts/staging/schema-challenge-bound-issuer-qa-only.sql'
      - 'tests/sql/staging-challenge-bound-rollback-20261123.sql'
      - 'tests/staging-challenge-*.test.py'
      - 'js/challenge.js'
      - '.github/workflows/v110-staging-challenge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bound-challenge-no-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Contract and cross-visitor/device ownership checks
        run: python3 tests/staging-challenge-contract.test.py
      - name: Browser client JS syntax
        run: node --check js/challenge.js
      - name: Real negative HTTP without public service keys
        run: python3 tests/staging-challenge-http-negative.test.py
      - name: No writes and no production credentials
        run: |
          echo "Only local-source checks and negative staging HTTP; no database writes."
