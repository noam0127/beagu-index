name: School-first landing offline browser validation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/fonts/pretendard/**'
      - 'scripts/test-school-first-landing.cjs'
      - '.github/workflows/school-first-landing.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Validate local landing only (external network blocked in browser)
        run: |
          python3 -m http.server 8128 --bind 127.0.0.1 >/tmp/landing-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8128/index.html >/dev/null && break; sleep 1; done
          node scripts/test-school-first-landing.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-first-landing-screenshots
          path: artifacts/landing/
          if-no-files-found: ignore
