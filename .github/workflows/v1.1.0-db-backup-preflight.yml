name: v1.1.0 — local encrypted DB backup helper preflight
on:
  push:
    branches:
      - develop/v1.1.0-phase1-20261121
    paths:
      - '.github/workflows/v1.1.0-db-backup-preflight.yml'
      - 'scripts/release-manager/encrypted-db-backup.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-local-backup:
    name: Check fail-closed backup helper without database access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check local helper
        run: python3 -m py_compile scripts/release-manager/encrypted-db-backup.py
      - name: Offline guard tests (no secrets, no DB access)
        run: python3 scripts/release-manager/encrypted-db-backup.py --self-test
