name: staging edited API recovery source gate (READ ONLY)
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-edited-api-v1/**'
      - 'tests/staging-edited-api-contract.test.py'
      - 'tests/staging-edited-api-http-negative.test.py'
      - '.github/workflows/v110-staging-edited-api-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Recovered source static contract
        run: python3 tests/staging-edited-api-contract.test.py
      - name: Real staging HTTP denial probes (no secrets, no user data)
        run: python3 tests/staging-edited-api-http-negative.test.py
      - name: Verify no deploy permissions or production source path
        run: |
          test -f scripts/staging/recovered-beagu-edited-api-v1/index.ts
          test ! -e supabase/functions/beagu-edited-api-v1/index.ts
          echo 'PASS: source recovery only; no secrets, no Supabase writes, no production deploy'
