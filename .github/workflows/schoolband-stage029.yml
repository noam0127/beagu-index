name: Schoolband 029 independent static preview and immutable HTTP verification
on:
  push:
    branches: [schoolband-playtest]
    paths:
      - 'games/nangam-schoolband-v08/index.html'
      - 'games/nangam-schoolband-v08/preview/index.html'
      - 'games/nangam-schoolband-v08/charts/school-homepages.v1.json'
      - 'scripts/test-schoolband-stage029.cjs'
      - 'scripts/test-schoolband-stage029-browser.cjs'
      - '.github/workflows/schoolband-stage029.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: schoolband-stage029-${{ github.ref }}
  cancel-in-progress: true
jobs:
  immutable-static-preview:
    if: github.ref == 'refs/heads/schoolband-playtest'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build allowlisted static preview and verify same-host HTTP
        run: node scripts/test-schoolband-stage029.cjs
      - name: Upload no-CNAME offline test-preview bundle (no private data)
        uses: actions/upload-artifact@v4
        with:
          name: schoolband-029-static-preview-${{ github.sha }}
          path: artifacts/schoolband-stage029/site/
          retention-days: 7
      - name: Verify independent free CDN at exact commit (external HTTP)
        run: node scripts/test-schoolband-stage029.cjs --external
      - name: Install Chromium for NO-AUDIO external page DOM smoke
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium --only-shell
      - name: Open actual immutable preview URL and check PC/mobile controls without music
        run: node scripts/test-schoolband-stage029-browser.cjs
      - name: Save anonymized PC/mobile test screenshots as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schoolband-029-external-browser-${{ github.sha }}
          path: artifacts/schoolband-stage029/browser/
          if-no-files-found: ignore
          retention-days: 7
      - name: Explicitly confirm NO paid deployment or production promotion
        run: |
          test ! -f artifacts/schoolband-stage029/site/CNAME
          echo "Static-only preview; GitHub Pages/Vercel settings and operating domain unchanged."

      - name: Publish exact-preview HTTP verification result to TEST branch commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$VERDICT" = "success" ]; then
            STATE=success
            DESCRIPTION="External HTTP, MIME and SHA256 checks passed for exact commit"
          else
            STATE=failure
            DESCRIPTION="External preview HTTP not verified or other 029 gate failed"
          fi
          export STATE DESCRIPTION
          PAYLOAD="$(node -e 'process.stdout.write(JSON.stringify({
            state:process.env.STATE,
            context:"schoolband/029-static-preview-http",
            description:process.env.DESCRIPTION,
            target_url:"https://github.com/"+process.env.GITHUB_REPOSITORY+
              "/actions/runs/"+process.env.GITHUB_RUN_ID
          }))')"
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
