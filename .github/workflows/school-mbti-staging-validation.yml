name: 2026 School MBTI Staging Validation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/beagu-2026-mbti-review-sync.gs'
      - 'scripts/beagu-2026-noon-sync.gs'
      - 'tests/2026-form-submit-private-sync.mjs'
      - 'tests/2026-automated-qa-ingest.mjs'
      - 'supabase/functions/beagu-2026-private-qa-ingest/index.ts'
      - 'supabase/migrations/20261119_2026_private_automated_review.sql'
      - 'supabase/migrations/20261119_2026_qa_ingest_staging.sql'
      - 'tests/school-mbti-staging.mjs'
      - '.github/workflows/school-mbti-staging-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/school-mbti-staging.mjs
      - run: node tests/2026-form-submit-private-sync.mjs
      - run: node tests/2026-automated-qa-ingest.mjs
