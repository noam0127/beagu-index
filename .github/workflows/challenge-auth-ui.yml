name: Challenge shared Lv1 authentication UI
on:
  push:
    branches: [main]
    paths:
      - challenge.html
      - js/challenge-access-v1.js
      - styles/challenge-access-v1.css
      - styles/beagu-auth-unified-v1.css
      - styles/beagu-auth-journey-v1.css
      - tests/challenge-auth-ui.mjs
      - .github/workflows/challenge-auth-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/challenge-auth-ui.mjs
