name: Challenge shared Lv1 authentication UI
on:
  push:
    branches: [main]
    paths:
      - challenge.html
      - js/challenge-access-v1.js
      - styles/challenge-access-v1.css
      - styles/beagu-auth-unified-v1.css
      - styles/beagu-auth-journey-v1.css
      - tests/challenge-auth-ui.mjs
      - js/challenge-referral-v1.js
      - js/challenge.js
      - styles/challenge-layout-v1.css
      - styles/beagu-participation-auth-v2.css
      - tests/challenge-certificate-privacy-v1.mjs
      - tests/participation-code-unified.mjs
      - tests/challenge-search-telemetry.mjs
      - scripts/test-challenge-referral-premium.cjs
      - scripts/test-challenge-lv2-card.cjs
      - tests/beagu-notice-pages-v1.mjs
      - .github/workflows/challenge-auth-ui.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/challenge-auth-ui.mjs
      - run: node tests/participation-code-unified.mjs
      - run: node scripts/test-challenge-referral-premium.cjs
      - run: node scripts/test-challenge-lv2-card.cjs
      - run: node tests/challenge-certificate-privacy-v1.mjs
      - run: node tests/beagu-notice-pages-v1.mjs
