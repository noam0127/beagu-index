name: Telemetry gateway live cutover readiness
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261120_telemetry_v2_public_rpc_cutover.sql'
      - '.github/workflows/telemetry-v2-cutover-check.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telemetry-v2-cutover-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public assets use gateway, not direct RPC
        run: |
          set -euo pipefail
          for path in js/visit-stats.js js/beagu-presence-games-v1.js; do
            succeeded=0
            for n in 1 2 3 4 5 6; do
              curl --silent --show-error --max-time 15 -L -H 'cache-control: no-cache' \
                "https://baeguindex.com/$path?v=20261120-gateway2&test=$n" -o /tmp/telemetry-live.js
              if grep -Fq "functions.invoke('beagu-telemetry-v2'" /tmp/telemetry-live.js; then
                succeeded=1
                break
              fi
              sleep 5
            done
            test "$succeeded" = "1"
            if grep -Eq "\.rpc\('beagu_(record_visit|presence_ping_v1)'" /tmp/telemetry-live.js; then
              echo "Old RPC call still exposed in $path"; exit 1
            fi
            echo "PASS live: $path"
          done
      - name: Test new HTTP visit, counters and idempotency
        run: |
          set -euo pipefail
          url="https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-telemetry-v2"
          body='{"action":"visit","visitor":"bf6a7ea3-703f-47e5-908d-111111111112","event":"f7c6cc9c-0000-4aa8-81bb-100000000001","page":"index"}'
          for n in 1 2; do
            status="$(curl --silent --show-error --max-time 20 -o /tmp/telemetry-visit.json -w '%{http_code}' \
              -X POST -H 'content-type: application/json' -H 'origin: https://baeguindex.com' \
              --data "$body" "$url")"
            test "$status" = "200"
            node -e 'const fs=require("node:fs"); const d=JSON.parse(fs.readFileSync("/tmp/telemetry-visit.json","utf8")); for(const k of ["today","month","total"]) { if(!Number.isSafeInteger(Number(d[k])) || Number(d[k]) < 0) throw Error("Invalid "+k) }'
          done
          echo "PASS: valid visit request and same-event replay"
