name: BAEGU release controller (admin approval)
# Explicit staging-only request 2026-11-22: wake existing signed OIDC release worker; production SHA remains pinned.
# Emergency fix: verified latest main SHA, admin-recorded production deploy; stale staging cannot replace it.
# Authorized 2026-11-23 hotfix: production job 4dd58c2f-16a4-477c-8944-85277283a358 publishes pinned c2ac5615 after QA.
# Authorized emergency release: 2026-11-23 arcade and VIP, queued job 520b0770-f3d1-40c5-bd82-8488ce16fc1a pinned to 4e9cbd0e.
# Re-run: validate correct Lv2 masked price rendering after independent search UI update.\n# The worker claims only server-authorized jobs; older staging cannot overwrite production.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beagu-release-controller.yml'
      - '.github/workflows/deploy-github-pages-direct.yml'
      - 'scripts/release-manager/worker.py'
      - 'admin-updates.html'
      - 'js/beagu-admin-updates-v1.js'
      - 'data/public-compare-school-directory-v1.json'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-direct
  cancel-in-progress: false
jobs:
  approved-release:
    name: Publish only admin-requested, approved SHA
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Lv2 and 17-region emergency release
        run: node tests/lv2-price-region-20261123.mjs
      - name: Validate arcade item rules and private VIP code card
        run: |
          node tests/arcade-item-upgrade-v1.mjs
          node scripts/test-challenge-referral-premium.cjs
          node tests/challenge-certificate-privacy-v1.mjs
      - name: Claim signed release job (GitHub Actions OIDC)
        id: job
        run: python3 scripts/release-manager/worker.py next
      - name: Build immutable production and optional preview snapshots
        if: steps.job.outputs.has_job == 'true'
        run: |
          python3 scripts/release-manager/worker.py build
          cd _release_site
          test -f index.html
          test -f CNAME
          test "$(cat CNAME)" = "baeguindex.com"
          test -f teacher-class-diary-play.html
          node scripts/test-class-diary-progress.cjs
          node scripts/test-class-diary-play-page.cjs
          node scripts/test-class-diary-semester.cjs
      - uses: actions/configure-pages@v5
        if: steps.job.outputs.has_job == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.job.outputs.has_job == 'true'
        with:
          path: _release_site
      - name: Publish tested release artifact
        if: steps.job.outputs.has_job == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Store successful release and history
        if: success() && steps.job.outputs.has_job == 'true'
        run: python3 scripts/release-manager/worker.py complete
      - name: Record deployment failure
        if: failure() && steps.job.outputs.has_job == 'true'
        run: python3 scripts/release-manager/worker.py fail
