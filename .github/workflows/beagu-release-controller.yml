name: BAEGU release controller (admin approval)
# Explicit staging-only request 2026-11-22: wake existing signed OIDC release worker; production SHA remains pinned.
# Emergency fix: verified latest main SHA, admin-recorded production deploy; stale staging cannot replace it.
# Authorized 2026-11-23 hotfix: production job 4dd58c2f-16a4-477c-8944-85277283a358 publishes pinned c2ac5615 after QA.
# Authorized emergency release: 2026-11-23 arcade and VIP, queued job 520b0770-f3d1-40c5-bd82-8488ce16fc1a pinned to 4e9cbd0e.
# Re-run: validate correct Lv2 masked price rendering after independent search UI update.
# The worker claims only server-authorized jobs; older staging cannot overwrite production.
# Emergency compare fix 2026-11-23: job 786a73d4-b75d-4e21-8a0b-eabb453f49c6 publishes reviewed 241f03e after preflight.
# Emergency owner request 2026-11-23 13:59 KST: wake production job 585ad673-9313-48d4-988b-77a67d4bc376 (pinned df83ae9) without altering release worker safeguards.
# Owner-requested emergency production publish, 2026-11-23: queue 07266cd9-6661-4262-9896-b7701543c207 pinned to SHA 4113e9582698f340281fef61a6b6dfb571e0d04b; keep OIDC worker checks.
# Owner-requested notice wording follow-up, 2026-11-23: signed queue job 1253f097-b0e1-4089-92a2-e10046157b23 publishes immutable 93ebc83afdfa44f1e19296d253906d7e7f5c2398.
# Owner-requested 2026-11-23 challenge UI and 2026-data notice: trigger signed Pages worker for queued c9eae0c2-30e1-49bf-999a-26d8d6e7263f pinned to 0b15df7df31ef1ef7ba99ffbbe0e1e060665d8eb.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beagu-release-controller.yml'
      - '.github/workflows/deploy-github-pages-direct.yml'
      - 'scripts/release-manager/worker.py'
      - 'admin-updates.html'
      - 'js/beagu-admin-updates-v1.js'
      - 'data/public-compare-school-directory-v1.json'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-direct
  cancel-in-progress: false
jobs:
  approved-release:
    name: Publish only admin-requested, approved SHA
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Lv2 and 17-region emergency release
        run: node tests/lv2-price-region-20261123.mjs
      - name: Validate arcade item rules and private VIP code card
        run: |
          node tests/arcade-item-upgrade-v1.mjs
          node scripts/test-challenge-referral-premium.cjs
          node tests/challenge-certificate-privacy-v1.mjs
      - name: Validate Lv2 school comparison and auth upgrade
        run: |
          node tests/statistics-lv2-price-upgrade-v1.mjs
          node tests/search-compare-unity.mjs
      - name: Enforce single publisher invariant (prevent stale snapshots)
        run: node --test tests/site-release-single-publisher.mjs
      - name: Claim signed release job (GitHub Actions OIDC)
        id: job
        run: python3 scripts/release-manager/worker.py next
      - name: Build immutable production and optional preview snapshots
        if: steps.job.outputs.has_job == 'true'
        run: |
          python3 scripts/release-manager/worker.py build
          cd _release_site
          test -f index.html
          test -f CNAME
          test "$(cat CNAME)" = "baeguindex.com"
          test -f teacher-class-diary-play.html
          node scripts/test-class-diary-progress.cjs
          node scripts/test-class-diary-play-page.cjs
          node scripts/test-class-diary-semester.cjs
      - uses: actions/configure-pages@v5
        if: steps.job.outputs.has_job == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.job.outputs.has_job == 'true'
        with:
          path: _release_site
      - name: Publish tested release artifact
        if: steps.job.outputs.has_job == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Store successful release and history
        if: success() && steps.job.outputs.has_job == 'true'
        run: python3 scripts/release-manager/worker.py complete
      - name: Record deployment failure
        if: failure() && steps.job.outputs.has_job == 'true'
        run: python3 scripts/release-manager/worker.py fail
