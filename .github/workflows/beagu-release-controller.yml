on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/beagu-release-controller.yml'
      - '.github/workflows/deploy-github-pages-direct.yml'
      - 'scripts/release-manager/worker.py'
      - 'admin-updates.html'
      - 'js/beagu-admin-updates-v1.js'
      - 'data/public-compare-school-directory-v1.json'
permissions:
  contents: read
  pages: write
  actions: read
  id-token: write
concurrency:
  group: github-pages-direct
  cancel-in-progress: false
jobs:
  approved-release:
    name: Publish only admin-requested, approved SHA
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Lv2 and 17-region emergency release
        run: node tests/lv2-price-region-20261123.mjs
      - name: Validate arcade item rules and private VIP code card
        run: |
          node tests/arcade-item-upgrade-v1.mjs
          node scripts/test-challenge-referral-premium.cjs
          node tests/challenge-certificate-privacy-v1.mjs
      - name: Validate Lv2 school comparison and auth upgrade
        run: |
          node tests/statistics-lv2-price-upgrade-v1.mjs
          node tests/search-compare-unity.mjs
      - name: Validate 2026 Lv2 N=1 school search public status
        run: |
          node tests/2026-lv2-n1-policy-ui.mjs
          node tests/2026-lv2-school-first-v1.mjs
      - name: Enforce single publisher invariant (prevent stale snapshots)
        run: node --test tests/site-release-single-publisher.mjs
      - name: Claim signed release job (GitHub Actions OIDC)
        id: job
        run: python3 scripts/release-manager/worker.py next
      - name: Build immutable production and optional preview snapshots
        if: steps.job.outputs.has_job == 'true'
        run: |
          python3 scripts/release-manager/worker.py build
          cd _release_site
          test -f index.html
          test -f CNAME
          test "$(cat CNAME)" = "baeguindex.com"
          test -f teacher-class-diary-play.html
          node scripts/test-class-diary-progress.cjs
          node scripts/test-class-diary-play-page.cjs
          node scripts/test-class-diary-semester.cjs
      - uses: actions/configure-pages@v5
        if: steps.job.outputs.has_job == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.job.outputs.has_job == 'true'
        with:
          path: _release_site
      - name: Wait for indexed Pages artifact (prevent transient 0-count failures)
        if: steps.job.outputs.has_job == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = "1" ]; then
              echo "Pages artifact visible to deployment API."
              sleep 4
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "Multiple Pages artifacts found in the current run; refusing publication." >&2
              exit 1
            fi
            sleep 4
          done
          echo "Pages artifact not indexed after repeated checks." >&2
          exit 1
      - name: Publish tested release artifact
        if: steps.job.outputs.has_job == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Store successful release and history
        if: success() && steps.job.outputs.has_job == 'true'
        run: python3 scripts/release-manager/worker.py complete
      - name: Record deployment failure
        if: failure() && steps.job.outputs.has_job == 'true'
        run: python3 scripts/release-manager/worker.py fail
