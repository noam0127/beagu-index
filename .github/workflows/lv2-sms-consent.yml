name: Lv2 opt-in SMS contact collection
on:
  pull_request:
    paths:
      - 'challenge.html'
      - 'postit.html'
      - 'js/challenge-member-auth-v1.js'
      - 'js/postit-account-v1.js'
      - 'supabase/migrations/20261121090000_member_sms_opt_in_v1.sql'
      - 'tests/lv2-sms-consent.mjs'
      - 'tests/challenge-lv2-account-entry.mjs'
      - '.github/workflows/lv2-sms-consent.yml'
  push:
    branches: [main]
    paths:
      - 'challenge.html'
      - 'postit.html'
      - 'js/challenge-member-auth-v1.js'
      - 'js/postit-account-v1.js'
      - 'supabase/migrations/20261121090000_member_sms_opt_in_v1.sql'
      - 'tests/lv2-sms-consent.mjs'
      - 'tests/challenge-lv2-account-entry.mjs'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/lv2-sms-consent.mjs
      - run: node tests/challenge-lv2-account-entry.mjs
