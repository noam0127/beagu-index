name: Lv1 Lv2 participation-code validation

on:
  pull_request:
    paths:
      - 'js/beagu-participation-auth-v2.js'
      - 'styles/beagu-participation-auth-v2.css'
      - 'js/beagu-level-state-v1.js'
      - 'js/beagu-level-guide-v1.js'
      - 'js/challenge-access-v1.js'
      - 'js/level-search.js'
      - 'js/statistics-compare.js'
      - 'school-report.html'
      - 'supabase/functions/beagu-level-api/**'
      - 'supabase/functions/beagu-postit-api-v1/**'
      - 'supabase/functions/beagu-referral-link-v1/**'
      - 'supabase/migrations/20261121_earned_challenge_participation_auth.sql'
      - 'tests/participation-code-unified.mjs'
      - 'tests/participation-code-live-smoke.mjs'
      - '.github/workflows/participation-code-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared code integration, authorization, responsive contract
        run: node tests/participation-code-unified.mjs
      - name: Non-writing production authorization smoke
        run: node tests/participation-code-live-smoke.mjs
      - name: JavaScript syntax checks
        run: |
          node --check js/beagu-participation-auth-v2.js
          node --check js/beagu-level-state-v1.js
          node --check js/beagu-level-guide-v1.js
          node --check js/challenge-access-v1.js
          node --check js/level-search.js
          node --check js/statistics-compare.js
      - name: Existing challenge and Post-it behavior
        run: |
          node scripts/test-challenge-referral-premium.cjs
          node tests/postit-static-check.cjs
