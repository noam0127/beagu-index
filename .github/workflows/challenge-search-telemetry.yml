name: 2026 XP & School Interest Telemetry Validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'challenge.html'
      - 'search.html'
      - 'search-lv1.html'
      - 'search-lv2.html'
      - 'school-report.html'
      - 'js/challenge.js'
      - 'js/challenge-progress-v1.js'
      - 'js/search-telemetry-v1.js'
      - 'js/level-search.js'
      - 'js/lv2-edited-search.js'
      - 'supabase/08_xp_search_install.sql'
      - 'tests/challenge-search-telemetry.mjs'
      - '.github/workflows/challenge-search-telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/challenge-search-telemetry.mjs
