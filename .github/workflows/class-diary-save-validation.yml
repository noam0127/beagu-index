name: Class Diary opt-in save checks
on:
  push:
    branches: [main]
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-save-v1.js'
      - 'styles/class-diary-save-v1.css'
      - 'scripts/test-class-diary-save.cjs'
      - 'supabase/functions/class-diary-save-v1/index.ts'
      - '.github/workflows/class-diary-save-validation.yml'
  pull_request:
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-save-v1.js'
      - 'styles/class-diary-save-v1.css'
      - 'scripts/test-class-diary-save.cjs'
      - 'supabase/functions/class-diary-save-v1/index.ts'
      - '.github/workflows/class-diary-save-validation.yml'
permissions:
  contents: read
jobs:
  checkpoint-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-save.cjs
      - run: node scripts/test-class-diary-play-page.cjs
