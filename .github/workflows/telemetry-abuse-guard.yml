name: Visit and presence abuse guard checks
on:
  push:
    branches: [main, fix/telemetry-visit-presence-abuse-20261120]
    paths:
      - 'supabase/migrations/20261120_telemetry_visit_presence_guard.sql'
      - 'tests/telemetry-abuse-guard-static.cjs'
      - '.github/workflows/telemetry-abuse-guard.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20261120_telemetry_visit_presence_guard.sql'
      - 'tests/telemetry-abuse-guard-static.cjs'
      - '.github/workflows/telemetry-abuse-guard.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/telemetry-abuse-guard-static.cjs
      - run: node tests/admin-live-traffic-static.cjs
