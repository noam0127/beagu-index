name: Class diary female semester SD regression

on:
  push:
    paths:
      - 'js/class-diary-female-semester-v1.js'
      - 'js/class-diary-sd-v1.js'
      - 'js/class-diary-semester-v1.js'
      - 'js/class-diary-supporting-cast-v1.js'
      - 'teacher-class-diary-play.html'
      - 'scripts/test-class-diary-sd.cjs'
      - 'scripts/test-class-diary-semester.cjs'
      - '.github/workflows/class-diary-female-semester.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  female-cast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate 36-episode character art and seven-day compatibility
        run: |
          node scripts/test-class-diary-sd.cjs
          node scripts/test-class-diary-semester.cjs
