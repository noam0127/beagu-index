name: Fire Court isolated validation
on:
  pull_request:
    branches: [release/base-pages-v11116-validation]
  push:
    branches: [release/v1.11.15-fire-court, fix/v1115-school-glory-after-fire-court, fix/v11116-court-renewal-ui-only]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Existing offline contracts and new music
        run: |
          node tests/playback-contract.cjs
          node tests/arcade-bgm-v1.mjs
          node tests/arcade-fire-court-v11115.mjs
          node tests/volley-match-bonus-v11115.mjs
          node tests/volley-deuce-v11115.mjs
          node tests/volley-outcome-v11115.mjs
          node tests/run4-inventory-v11115.mjs
          node tests/run4-career-hazards-v11115.mjs
          node tests/run4-boss-combat-v11115.mjs
          node tests/run4-support-v11115.mjs
          node tests/run4-qualification-v11115.mjs
          node tests/arcade-school-recommend-server.mjs
          node tests/arcade-volleyball-touch-jump.mjs
          node tests/arcade-survival-screen-fit.mjs
      - name: Install pinned browser
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then echo "BEAGU_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"; else npx playwright install chromium --only-shell; fi
      - name: Offline Chromium layouts
        run: |
          node tests/arcade-fire-court-browser.cjs
          node tests/volley-outcome-browser.cjs
          node tests/arcade-school-recommend-browser.cjs
          node tests/run4-inventory-browser.cjs
          node tests/run4-boss-render-browser.cjs
          node tests/run4-hazard-replay-browser.cjs
          node tests/playback-browser.cjs
          node tests/v1114-school-glory-browser.cjs

  archive-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Disposable PostgreSQL archive and verified 4.0 adapter
        run: |
          set -euo pipefail
          c="fire-archive-$GITHUB_RUN_ID"
          docker run -d --rm --name "$c" -e POSTGRES_PASSWORD=fixture-only postgres:16
          trap 'docker rm -f "$c" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 40); do docker exec "$c" pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          psql_local() { docker exec -i "$c" psql -X -v ON_ERROR_STOP=1 -U postgres; }
          psql_local < tests/v1114-school-points-fixture.sql
          psql_local < tests/v11115-archive-fixture.sql
          psql_local < scripts/sql/v1.11.14-school-game-points-candidate.sql
          psql_local < scripts/sql/v1.11.15-arcade-archive-candidate.sql
          psql_local < tests/v11115-archive-assertions.sql
          psql_local < scripts/sql/v1.11.15-arcade-archive-candidate.sql
          psql_local < docs/run4-ranking-preflight/schema-draft.sql
          psql_local < docs/run4-ranking-preflight/store-draft.sql
          psql_local < scripts/sql/v1.11.15-run4-archive-adapter-candidate.sql
          psql_local < tests/v11115-run4-archive-assertions.sql
          psql_local < scripts/sql/v1.11.15-run4-archive-adapter-candidate.sql
          printf '%s\n' "select 1/(case when (select count(*) from public.beagu_arcade_archive_v11115 where game='teacher_run_retirement_v4')=2 then 1 else 0 end);" | psql_local
