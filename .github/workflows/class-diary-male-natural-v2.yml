name: Class diary male natural poses v2
on:
  push:
    branches: [main]
    paths:
      - 'js/class-diary-male-natural-v2.js'
      - 'styles/class-diary-male-natural-v2.css'
      - 'scripts/test-class-diary-male-natural-v2.cjs'
      - 'assets/class-diary/characters/*-poses-v2.webp'
      - 'teacher-class-diary-play.html'
      - '.github/workflows/class-diary-male-natural-v2.yml'
  pull_request:
    paths:
      - 'js/class-diary-male-natural-v2.js'
      - 'styles/class-diary-male-natural-v2.css'
      - 'scripts/test-class-diary-male-natural-v2.cjs'
      - 'assets/class-diary/characters/*-poses-v2.webp'
      - 'teacher-class-diary-play.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-male-natural-v2.cjs
      - run: node scripts/test-class-diary-natural-actors.cjs
      - run: node scripts/test-class-diary-semester-male-art.cjs
      - run: node scripts/test-class-diary-new-colleagues.cjs
