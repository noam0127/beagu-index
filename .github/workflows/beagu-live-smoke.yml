name: 배구지수 운영 배포 자동검증

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'release-policy.html'
      - 'search.html'
      - 'statistics.html'
      - 'result.html'
      - 'survey.html'
      - 'styles/**'
      - 'search-lv1.html'
      - 'search-lv2.html'
      - 'js/**'
      - 'data/public-lv0-percentiles-v1.2.json'
      - 'lv2-edited-column-schema.json'
      - 'tests/live-smoke.mjs'
      - '.github/workflows/beagu-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: 운영 페이지·API 미인증 접근 점검
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check deployed site and public API protection
        env:
          BEAGU_ORIGIN: https://baeguindex.com
          SUPABASE_URL: https://snvzwrexuqavnfvzgxqj.supabase.co
          BEAGU_DEPLOY_WAIT_SECONDS: '180'
        run: node tests/live-smoke.mjs
