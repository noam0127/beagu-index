name: Class diary male art regression
on:
  push:
    branches: [main]
    paths:
      - 'js/class-diary-semester-male-art-v1.js'
      - 'teacher-class-diary-play.html'
      - 'assets/class-diary/characters/hyunwoo-six-expressions.webp'
      - 'scripts/test-class-diary-semester-male-art.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-class-diary-semester-male-art.cjs
