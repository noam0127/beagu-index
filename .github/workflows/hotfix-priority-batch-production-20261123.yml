name: Priority batch emergency production publish (retired)
# This one-time recovery publisher used a frozen baseline. Re-running it could
# replace approved new production pages with older HTML and scripts.
# The signed beagu-release-controller.yml is now the sole Pages publisher.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Retired. Use the signed admin release controller."
