name: Class diary one-line-at-a-time reading validation
on:
  push:
    branches: [main]
    paths:
      - 'teacher-class-diary-play.html'
      - 'js/class-diary-literary-v1.js'
      - 'styles/class-diary-literary-v1.css'
      - 'styles/class-diary-viewport-safe-v1.css'
      - 'js/class-diary-mobile-safe-v1.js'
      - 'scripts/test-class-diary-literary.cjs'
      - 'scripts/test-class-diary-literary-browser.cjs'
      - '.github/workflows/class-diary-literary-line-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: class-diary-literary-line-${{ github.ref }}
  cancel-in-progress: true
jobs:
  literary-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete prose and fixed font sizing
        run: node scripts/test-class-diary-literary.cjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium --only-shell
      - name: Verify real touch, Enter, full-width and page turn
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/diary-web.log 2>&1 &
          node scripts/test-class-diary-literary-browser.cjs
