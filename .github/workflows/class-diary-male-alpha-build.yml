name: Build transparent male character poses
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-class-diary-transparent-male.py'
      - '.github/workflows/class-diary-male-alpha-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: male-transparent-characters
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image libraries
        run: python -m pip install --quiet Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Build alpha cutouts and validate
        run: python scripts/build-class-diary-transparent-male.py
      - name: Commit static image assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/class-diary/characters/*-transparent-v2.webp
          if git diff --cached --quiet; then
            echo "Transparent assets already current"
            exit 0
          fi
          git commit -m "assets(class-diary): publish transparent male-character cutouts [skip ci]"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo "Could not publish transparent assets"
          exit 1
