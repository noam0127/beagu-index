name: v1.11.1 isolated light touch verification
on:
  push:
    branches: [fix/v1.11.1-light-touch-production-base]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: node tests/v1111-light-touch-contract.cjs
      - run: node tests/playground-contract.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: |
          if command -v google-chrome >/dev/null; then echo "BEAGU_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - run: node tests/playground-browser.cjs
      - run: node tests/v1111-light-touch-browser.cjs
