name: Post-it stage 4 atomic write & interaction regression
on:
  pull_request:
    paths:
      - 'supabase/functions/beagu-postit-api-v1/index.ts'
      - 'supabase/migrations/20261121140000_beagu_postit_atomic_write.sql'
      - 'js/postit-v1.js'
      - 'postit.html'
      - 'tests/postit-stage4-mutations.mjs'
      - '.github/workflows/postit-stage4.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/beagu-postit-api-v1/index.ts'
      - 'supabase/migrations/20261121140000_beagu_postit_atomic_write.sql'
      - 'js/postit-v1.js'
      - 'postit.html'
      - 'tests/postit-stage4-mutations.mjs'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/postit-stage4-mutations.mjs
      - run: node tests/postit-static-check.cjs
      - run: node tests/postit-member-auth.cjs
      - run: node tests/levelup-provisional-v1.cjs
