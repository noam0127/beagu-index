name: v1.1.0 telemetry isolated staging HTTP and privacy test
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-telemetry-v2/**'
      - 'scripts/staging/schema-telemetry-rpcs-qa-only.sql'
      - 'tests/staging-telemetry-*.test.py'
      - '.github/workflows/v110-staging-telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-telemetry-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate privacy, origin and server RPC source
        run: python3 tests/staging-telemetry-contract.test.py
      - name: Exercise live isolated telemetry HTTP (NO DATA WRITES)
        run: python3 tests/staging-telemetry-http-denials.test.py
      - name: Note safety boundary
        run: |
          echo "This workflow has NO production credentials and NO positive telemetry writes."
          echo "The previously verified positive synthetic test is deliberately not run automatically."
