name: One-time challenge login removal (retired; no production publisher)
# This temporary publisher used an older frozen snapshot and could overwrite
# more recent admin-approved releases. Preserve history but disable execution.
# All production releases must use beagu-release-controller.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Retired. Use the signed admin release controller."
