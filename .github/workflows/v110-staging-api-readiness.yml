name: v1.1.0 staging inventory and fail-closed release gate
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/**'
      - 'tests/staging-edge-inventory.test.py'
      - 'docs/V110_STAGE_DEPENDENCY_GATES_20261123.md'
      - '.github/workflows/v110-staging-api-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-api-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build isolated no-production site
        run: python3 scripts/build-standalone-staging.py
      - name: Verify immutable site and no production credentials
        run: python3 tests/test-standalone-staging.py
      - name: Verify live deployment inventory snapshot structure and expected 8 blockers
        run: python3 tests/staging-edge-inventory.test.py
      - name: Check strict readiness MUST reject unresolved APIs
        run: |
          set +e
          python3 scripts/staging/audit-frontend-edge-functions.py --require-ready
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "FAIL: incomplete staging improperly accepted as ready, or unexpected audit error"
            exit 1
          fi
          echo "PASS: incomplete staging correctly BLOCKED for full E2E and production"
      - name: No staging or production write privileges
        run: |
          echo "PASS: offline artifact/inventory audit only; no remote credentials"
