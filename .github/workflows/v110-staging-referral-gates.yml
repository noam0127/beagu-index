name: v1.1.0 staging referral APIs remain disabled until verified form evidence
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-referral-link-v1/**'
      - 'scripts/staging/recovered-beagu-referral-checkin-v1/**'
      - 'scripts/staging/schema-referral-private-gated-qa-only.sql'
      - 'tests/staging-referral-*.test.py'
      - '.github/workflows/v110-staging-referral-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fail-closed-referrals:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm SQL definer and stage-only restrictions
        run: python3 tests/staging-referral-gates-contract.test.py
      - name: Real staging HTTP must never issue referral while unverified
        run: python3 tests/staging-referral-gates-http.test.py
      - name: No confidential credentials or user data in CI
        run: |
          echo "PASS: no database writes; referral features remain intentionally NO-GO."
