name: Telemetry public gateway uptime
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/telemetry-public-uptime.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 4
    steps:
      - name: Non-writing production uptime probes
        shell: bash
        run: |
          set -euo pipefail
          gateway='https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-telemetry-v2'
          admin='https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-admin-dashboard-v1'
          probe() {
            local expected="$1"; shift
            local status
            status=$(curl --silent --show-error --retry 2 --retry-all-errors \
              --retry-delay 2 --max-time 20 --output /tmp/uptime-response.json \
              --write-out '%{http_code}' "$@")
            if [ "$status" != "$expected" ]; then
              echo "Expected HTTP $expected, got HTTP $status"; exit 1
            fi
          }
          probe 200 "$gateway"
          grep -q '"status":"ready"' /tmp/uptime-response.json
          probe 400 -X POST -H 'content-type: application/json' \
            -H 'origin: https://baeguindex.com' \
            --data '{"action":"visit","visitor":"invalid","page":"index"}' "$gateway"
          grep -q 'INVALID_INPUT' /tmp/uptime-response.json
          probe 401 -X POST -H 'content-type: application/json' \
            -H 'origin: https://baeguindex.com' \
            --data '{"action":"live_traffic","period":"today"}' "$admin"
          grep -q 'authentication_required' /tmp/uptime-response.json
          echo 'PASS: no-write production gateway and admin API uptime'
