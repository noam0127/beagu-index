name: v1.1.0 staging Level and Postit exact Render CORS security smoke
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-level-api-v5/**'
      - 'scripts/staging/recovered-beagu-postit-api-v4/**'
      - 'tests/staging-render-level-postit-*.test.py'
      - 'tests/staging-lv3-active-auth-session.mjs'
      - 'scripts/staging/schema-lv3-revoked-auth-session-qa-only.sql'
      - 'tests/sql/staging-lv3-auth-session-revocation-rollback-20261123.sql'
      - 'tests/sql/staging-lv3-member-suspend-delete-rollback-20261123.sql'
      - '.github/workflows/v110-staging-render-level-postit-cors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-stage-cors-no-writes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact deployed Level and Postit member gate source
        run: python3 tests/staging-render-level-postit-contract.test.py
      - name: Test Auth session JWT claim and server-only RPC contract
        run: node tests/staging-lv3-active-auth-session.mjs
      - name: Exercise real staging OPTIONS GET without any user data
        run: python3 tests/staging-render-level-postit-http.test.py
      - name: Delineate test evidence
        run: |
          echo "Staging API CORS and no-session denials tested; no actual Render deployment or Lv3 signup."
          echo "No stage or production database writes; all 5 rollout locks remain NO-GO."
