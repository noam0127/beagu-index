name: 2026 Question Results Pipeline
on:
  push:
    branches: [main, perf/v1.12.06-2026-batch]
    paths:
      - 'scripts/README-2026-noon-sync.md'
      - 'scripts/beagu-2026-*.gs'
      - 'scripts/beagu-2026-results-*.js'
      - 'scripts/build-2026-results.mjs'
      - 'supabase/functions/_shared/*2026*'
      - 'supabase/functions/beagu-2026-results-ingest/**'
      - 'supabase/migrations/*beagu_2026*.sql'
      - 'scripts/beagu-2026-referral-integration.gs'
      - 'supabase/functions/beagu-referral-ingest-v1/**'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'js/beagu-2026-admin-review.js'
      - 'admin.html'
      - 'js/2026-approved-question-results.js'
      - 'js/level-search.js'
      - 'tests/2026-*.mjs'
      - 'tests/school-question-mode-only-privacy.mjs'
      - 'tests/three-day-release.mjs'
      - 'scripts/test-challenge-referral-stage2.cjs'
      - 'tests/lv1-percentile-chart-parity.mjs'
      - '.github/workflows/2026-question-results.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/beagu-2026-*.gs'
      - 'scripts/beagu-2026-results-*.js'
      - 'scripts/build-2026-results.mjs'
      - 'supabase/functions/_shared/*2026*'
      - 'supabase/functions/beagu-2026-results-ingest/**'
      - 'supabase/migrations/*beagu_2026*.sql'
      - 'scripts/beagu-2026-referral-integration.gs'
      - 'supabase/functions/beagu-referral-ingest-v1/**'
      - 'supabase/functions/beagu-2026-review-admin/**'
      - 'js/beagu-2026-admin-review.js'
      - 'admin.html'
      - 'js/2026-approved-question-results.js'
      - 'js/level-search.js'
      - 'tests/2026-*.mjs'
      - 'tests/school-question-mode-only-privacy.mjs'
      - 'tests/three-day-release.mjs'
      - 'scripts/test-challenge-referral-stage2.cjs'
      - 'tests/lv1-percentile-chart-parity.mjs'
      - '.github/workflows/2026-question-results.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/build-2026-results.mjs
          git diff --exit-code -- scripts/beagu-2026-noon-sync.gs supabase/functions/_shared/questionnaire-2026.mjs
          failures=0
          check() {
            echo "::group::$1"
            if node "$1"; then
              echo "PASS: $1"
            else
              echo "::error file=$1::Regression failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          check tests/2026-question-results-pipeline.mjs
          check tests/2026-form-submit-private-sync.mjs
          check tests/2026-batch-ingest-performance.mjs
          check tests/2026-public-count-safety.mjs
          check tests/2026-approved-search-refresh.mjs
          check tests/2026-public-revalidation-fail-closed.mjs
          check tests/2026-synthetic-school-withdrawal-flow.mjs
          check tests/2026-school-empty-survey-cta.mjs
          check tests/school-question-mode-only-privacy.mjs
          check tests/three-day-release.mjs
          check tests/2026-release-consent-gate.mjs
          check tests/2026-auto-quality-referral-gate.mjs
          check tests/2026-three-stage-review-flow.mjs
          check tests/2026-nonscorable-core-coverage.mjs
          check tests/2026-qa-read-only-preflight.mjs
          check tests/2026-staging-sandbox-static.mjs
          check tests/2026-one-response-publication-review.mjs
          check scripts/test-challenge-referral-stage2.cjs
          check tests/lv1-percentile-chart-parity.mjs
          echo "Failed regression files: $failures"
          test "$failures" -eq 0
