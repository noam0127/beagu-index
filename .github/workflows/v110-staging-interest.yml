name: v1.1.0 school interest staging auth and data API smoke
on:
  push:
    branches:
      - fix/v110-staging-edited-api-recovery-20261123
    paths:
      - 'scripts/staging/recovered-beagu-school-interest-v1/**'
      - 'scripts/staging/schema-school-interest-qa-only.sql'
      - 'tests/staging-interest-*.test.py'
      - '.github/workflows/v110-staging-interest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interest-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check SQL and source privacy contract
        run: python3 tests/staging-interest-contract.test.py
      - name: Verify actual staging HTTP/CORS and fake token denial
        run: python3 tests/staging-interest-http.test.py
      - name: No writes to production or test DB
        run: |
          echo "HTTP non-user test completed; no SQL mutations or deploy credentials in CI"
