name: Statistics & Legacy Route Hygiene
on:
  push:
    branches: [main]
    paths:
      - 'statistics.html'
      - 'result.html'
      - 'survey.html'
      - 'js/challenge.html'
      - 'js/statistics-table.js'
      - 'styles/statistics.css'
      - 'tests/site-route-hygiene.mjs'
      - 'tests/brand-ui-consistency.mjs'
      - 'tests/rolling-volleyball-loading.mjs'
      - 'tests/ui-refresh-v2.mjs'
      - 'styles/beagu-ui-refresh-v2.css'
      - 'styles/beagu-loading-v1.css'
      - 'js/beagu-loading-v1.js'
      - 'styles/beagu-design-system-v1.css'
      - 'index.html'
      - 'search.html'
      - 'search-lv1.html'
      - 'school-report.html'
      - 'challenge.html'
      - 'release-policy.html'
      - 'teacher-volleyball.html'
      - 'teacher-run.html'
      - '.github/workflows/site-route-hygiene.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/site-route-hygiene.mjs
      - run: node tests/brand-ui-consistency.mjs
      - run: node tests/rolling-volleyball-loading.mjs
      - run: node tests/ui-refresh-v2.mjs
