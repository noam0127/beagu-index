name: Class diary world validation
on:
  push:
    paths:
      - 'js/class-diary-world-v1.js'
      - 'scripts/test-class-diary-world.cjs'
      - 'js/class-diary-narrative-v1.js'
      - 'scripts/test-class-diary-narrative.cjs'
      - 'js/class-diary-play-v1.js'
      - 'js/class-diary-semester-v1.js'
      - 'js/class-diary-semester-ui-v1.js'
      - 'js/class-diary-ui-v2.js'
      - 'styles/class-diary-semester-ui-v1.css'
      - 'scripts/test-class-diary-semester-ui.cjs'
      - 'scripts/test-class-diary-semester.cjs'
      - 'js/class-diary-director-v1.js'
      - 'js/class-diary-character-routes-v1.js'
      - 'js/class-diary-context-v1.js'
      - 'js/class-diary-demo-v1.js'
      - 'js/class-diary-scenario-v1.js'
      - 'js/class-diary-incidents-v1.js'
      - 'js/class-diary-sound-v1.js'
      - 'js/class-diary-visual-v1.js'
      - 'js/class-diary-sd-v1.js'
      - 'scripts/test-class-diary-sd.cjs'
      - 'scripts/test-class-diary-sound.cjs'
      - 'scripts/test-class-diary-visual.cjs'
      - 'scripts/test-class-diary-play.cjs'
      - 'scripts/test-class-diary-director.cjs'
      - 'scripts/test-class-diary-character-routes.cjs'
      - 'scripts/test-class-diary-context.cjs'
      - 'scripts/test-class-diary-demo.cjs'
      - 'scripts/test-class-diary-scenario.cjs'
      - 'scripts/test-class-diary-incidents.cjs'
      - 'scripts/test-class-diary-play-page.cjs'
      - 'teacher-class-diary.html'
      - 'teacher-class-diary-play.html'
      - 'data/public-statistics-question-catalog-v1.json'
      - 'js/2026-questionnaire-options-v1.2.js'
      - 'supabase/functions/class-diary-story-signals-v1/index.ts'
      - '.github/workflows/class-diary-world-validation.yml'
  pull_request:
    paths:
      - 'js/class-diary-world-v1.js'
      - 'scripts/test-class-diary-world.cjs'
      - 'js/class-diary-semester-v1.js'
      - 'js/class-diary-literary-v1.js'
      - 'styles/class-diary-literary-v1.css'
      - 'scripts/test-class-diary-semester.cjs'
      - 'teacher-class-diary-play.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  world-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test school world inputs and privacy gates
        run: |
          node scripts/test-class-diary-world.cjs
          node scripts/test-class-diary-narrative.cjs
          node scripts/test-class-diary-play.cjs
          node scripts/test-class-diary-semester.cjs
          node scripts/test-class-diary-semester-ui.cjs
          node scripts/test-class-diary-director.cjs
          node scripts/test-class-diary-character-routes.cjs
          node scripts/test-class-diary-context.cjs
          node scripts/test-class-diary-demo.cjs
          node scripts/test-class-diary-scenario.cjs
          node scripts/test-class-diary-incidents.cjs
          node scripts/test-class-diary-play-page.cjs
          node scripts/test-class-diary-sound.cjs
          node scripts/test-class-diary-visual.cjs
          node scripts/test-class-diary-sd.cjs
      - name: Confirm the live API rejects missing Lv2 session
        run: |
          code=$(curl --retry 2 --max-time 15 --silent --show-error \
            --output /tmp/class-diary-no-auth.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"schoolId":"7972013"}' \
            'https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/class-diary-world-v1')
          test "$code" = '401'
          grep -q 'LEVEL2_REQUIRED' /tmp/class-diary-no-auth.json
      - name: Confirm story signal API rejects missing Lv2 session
        run: |
          code=$(curl --retry 2 --max-time 15 --silent --show-error \
            --output /tmp/class-diary-story-no-auth.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"schoolId":"7972013"}' \
            'https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/class-diary-story-signals-v1')
          test "$code" = '401'
          grep -q 'LEVEL2_REQUIRED' /tmp/class-diary-story-no-auth.json
