name: Admin page performance regression
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'js/beagu-page-performance-v1.js'
      - 'js/arcade-school-picker-v1.js'
      - 'js/statistics-directory-v2.js'
      - 'js/level-search.js'
      - 'search.html'
      - 'search-lv1.html'
      - 'supabase/functions/beagu-admin-dashboard-v1/index.ts'
      - 'supabase/migrations/20261120_admin_page_perf_v1.sql'
      - 'tests/admin-page-performance-static.cjs'
      - '.github/workflows/admin-page-performance-validation.yml'
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-page-performance-static.cjs
