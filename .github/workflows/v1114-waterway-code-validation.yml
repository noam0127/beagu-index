name: Waterway private pipeline code validation
on:
  push:
    branches: [release/v1.11.4-waterway]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate generated source and private pipeline (offline fixtures only)
        run: |
          node scripts/build-2026-results.mjs
          git diff --exit-code -- scripts/beagu-2026-noon-sync.gs supabase/functions/_shared/questionnaire-2026.mjs
          node tests/2026-form-submit-private-sync.mjs
          node tests/2026-question-results-pipeline.mjs
          node tests/2026-release-consent-gate.mjs
          node tests/2026-public-revalidation-fail-closed.mjs
          node tests/2026-three-stage-review-flow.mjs
          node tests/2026-one-response-publication-review.mjs
          node tests/2026-public-projection-integrity.mjs
          node tests/2026-level-final-approval-ui.cjs
          node tests/v1114-waterway-admin-status.cjs
          node tests/v1114-waterway-run.mjs
          node tests/search-compare-unity.mjs
          node tests/2026-approved-search-refresh.mjs
      - name: Install pinned Chromium fixture tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --fetch-retries=1 --fetch-timeout=30000 playwright@1.56.1 html2canvas@1.4.1
          browser=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser" ]; then
            "$browser" --version
            echo "BEAGU_CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            timeout 120s npx playwright install chromium --only-shell
          fi
      - name: Chromium search and compare offline regression
        run: |
          set -euo pipefail
          node tests/v1111-light-touch-browser.cjs
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/waterway-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8124/challenge.html >/dev/null && break; sleep 1; done
          node tests/v1112-together-offline-browser.cjs
