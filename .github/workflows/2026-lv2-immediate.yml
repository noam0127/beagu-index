name: Lv2 approved 2026 immediate release
on:
  pull_request:
    paths:
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'supabase/functions/_shared/release-policy.mjs'
      - 'supabase/migrations/20261121100000_beagu_2026_lv2_immediate_approved.sql'
      - 'tests/2026-lv2-immediate.mjs'
      - '.github/workflows/2026-lv2-immediate.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/beagu-level-api/index.ts'
      - 'supabase/functions/_shared/release-policy.mjs'
      - 'supabase/migrations/20261121100000_beagu_2026_lv2_immediate_approved.sql'
      - 'tests/2026-lv2-immediate.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/2026-lv2-immediate.mjs
