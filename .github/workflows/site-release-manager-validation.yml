name: Site release manager checks
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-updates.html'
      - 'styles/beagu-admin-updates-v1.css'
      - 'js/beagu-admin-updates-v1.js'
      - '.github/workflows/beagu-release-controller.yml'
      - '.github/workflows/deploy-github-pages-direct.yml'
      - 'scripts/release-manager/**'
      - 'supabase/migrations/20261121_site_release_manager.sql'
      - 'supabase/migrations/20261121_site_release_version_catalog.sql'
      - 'supabase/functions/beagu-release-manager-v1/**'
      - 'tests/site-release-center.mjs'
      - 'tests/release-github-work-inbox.mjs'
      - 'tests/release-work-dependencies.mjs'
      - 'tests/release-impact-evidence.mjs'
      - 'tests/release-conflict-preflight.mjs'
      - 'tests/release-step9-merge-tree.mjs'
      - 'tests/release-step10-security-invariants.mjs'
      - 'tests/release-step11-offline-integration.py'
      - 'tests/staging-http-smoke.py'
      - 'docs/releases/v2-step9-integration-manifest.json'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check integrated Edge API and dependency graph
        run: deno check supabase/functions/beagu-release-manager-v1/index.ts
      - name: Syntax validation
        run: |
          node --check js/beagu-admin-updates-v1.js
          python3 -m py_compile scripts/release-manager/worker.py tests/staging-http-smoke.py
      - name: Test approval and security invariants
        run: |
          node --test tests/site-release-center.mjs
          node --test tests/release-github-work-inbox.mjs
          node --test tests/release-work-dependencies.mjs
          node --test tests/release-impact-evidence.mjs
          node --test tests/release-conflict-preflight.mjs
          node --test tests/release-step9-merge-tree.mjs
          node --test tests/release-step10-security-invariants.mjs
          python3 tests/site-release-packaging.py
          python3 tests/release-step11-offline-integration.py
