name: Site release manager checks
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-updates.html'
      - 'styles/beagu-admin-updates-v1.css'
      - 'js/beagu-admin-updates-v1.js'
      - '.github/workflows/beagu-release-controller.yml'
      - '.github/workflows/deploy-github-pages-direct.yml'
      - 'scripts/release-manager/**'
      - 'supabase/migrations/20261121_site_release_manager.sql'
      - 'supabase/functions/beagu-release-manager-v1/**'
      - 'tests/site-release-center.mjs'
      - 'tests/site-release-two-sha-isolation.py'
      - 'tests/stage38-preview-origin-gate.mjs'
      - 'tests/stage38-published-http-check.mjs'
      - 'tests/stage38-manual-vercel-gate.mjs'
      - 'tests/stage38-staging-db-contract.sql'
      - 'tests/stage38-staging-db-contract.mjs'
      - 'tests/stage38-staging-rpc-parity.sql'
      - 'tests/stage38-staging-rpc-parity.mjs'
      - 'tests/stage38-staging-critical-paths.sql'
      - 'tests/stage38-staging-critical-paths.mjs'
      - 'tests/stage38-staging-column-parity.sql'
      - 'tests/stage38-staging-column-parity.mjs'
      - 'docs/releases/templates/stage38-staging-login-foundation.sql'
      - 'tests/stage38-staging-login-foundation.mjs'
      - 'tests/stage38-staging-login-foundation-smoke.sh'
      - 'tests/stage38-staging-synthetic-login-cases.sql'
      - 'docs/releases/templates/stage38-approved-vercel-preview.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          node --check js/beagu-admin-updates-v1.js
          python3 -m py_compile scripts/release-manager/worker.py
      - name: Test approval and security invariants
        run: |
          node --test tests/site-release-center.mjs
          node tests/stage38-preview-origin-gate.mjs
          node tests/stage38-published-http-check.mjs
          node tests/stage38-manual-vercel-gate.mjs
          node tests/stage38-staging-db-contract.mjs
          node tests/stage38-staging-rpc-parity.mjs
          node tests/stage38-staging-critical-paths.mjs
          node tests/stage38-staging-column-parity.mjs
          node tests/stage38-staging-login-foundation.mjs
          ruby -ryaml -e 'YAML.parse_file(ARGV.fetch(0))' docs/releases/templates/stage38-approved-vercel-preview.yml
          python3 tests/site-release-packaging.py
          python3 tests/site-release-two-sha-isolation.py

  stage38-login-fixture:
    name: Stage38 isolated PostgreSQL login DDL smoke (NO SUPABASE ACCESS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify local PostgreSQL client
        run: psql --version
      - name: Test template guard, RLS and 60/minute budget on disposable DB
        env:
          STAGE38_PG_FIXTURE_ONLY: ephemeral-ci
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: fixture-only
        run: bash tests/stage38-staging-login-foundation-smoke.sh
