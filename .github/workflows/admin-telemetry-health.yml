name: Telemetry security health monitoring
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261120_telemetry_guard_decision_monitoring.sql'
      - 'supabase/migrations/20261121_telemetry_hourly_monitor.sql'
      - 'supabase/functions/beagu-admin-dashboard-v1/**'
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'tests/admin-telemetry-health-static.cjs'
      - '.github/workflows/admin-telemetry-health.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261120_telemetry_guard_decision_monitoring.sql'
      - 'supabase/functions/beagu-admin-dashboard-v1/**'
      - 'admin.html'
      - 'js/beagu-admin-access-v1.js'
      - 'tests/admin-telemetry-health-static.cjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-telemetry-health-static.cjs
      - run: node tests/admin-live-traffic-static.cjs
      - run: node tests/admin-page-performance-static.cjs
      - run: node tests/admin-dashboard-static.cjs
      - name: Verify deployed admin endpoint still blocks unauthorized requests
        run: |
          set -euo pipefail
          endpoint='https://snvzwrexuqavnfvzgxqj.supabase.co/functions/v1/beagu-admin-dashboard-v1'
          code="$(curl --silent --show-error --max-time 20 --output /tmp/telemetry-admin-denial.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H 'origin: https://baeguindex.com' --data '{"action":"live_traffic","period":"today"}' "$endpoint")"
          test "$code" = "401"
          grep -q 'authentication_required' /tmp/telemetry-admin-denial.json
          code="$(curl --silent --show-error --max-time 20 --output /tmp/telemetry-admin-origin.json --write-out '%{http_code}' -X POST -H 'content-type: application/json' -H 'origin: https://untrusted.example' --data '{"action":"live_traffic","period":"today"}' "$endpoint")"
          test "$code" = "403"
          grep -q 'origin_not_allowed' /tmp/telemetry-admin-origin.json
