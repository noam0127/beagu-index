name: Class diary semester audio validation
on:
  push:
    branches: [main, class-diary-semester-audio-20261120]
    paths:
      - 'js/class-diary-sound-v1.js'
      - 'js/class-diary-semester-v1.js'
      - 'scripts/test-class-diary-sound.cjs'
      - 'teacher-class-diary-play.html'
      - '.github/workflows/class-diary-semester-audio-validation.yml'
  pull_request:
    paths:
      - 'js/class-diary-sound-v1.js'
      - 'js/class-diary-semester-v1.js'
      - 'scripts/test-class-diary-sound.cjs'
      - 'teacher-class-diary-play.html'
      - '.github/workflows/class-diary-semester-audio-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check audio and 36-episode modules
        run: |
          node --check js/class-diary-sound-v1.js
          node --check js/class-diary-semester-v1.js
          node scripts/test-class-diary-sound.cjs
          node scripts/test-class-diary-semester.cjs
