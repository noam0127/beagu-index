name: v1.1.0 stage35 one-time Lv1 school sort denial
on:
  push:
    branches: ['develop/v1.1.0-lv3']
    paths:
      - 'tests/v1.1.0-stage35-ranked-sort-http-once.py'
      - '.github/workflows/v1.1.0-stage35-ranked-sort-http-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-lv1-denied:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test forbidden sort against isolated staging only
        run: python3 tests/v1.1.0-stage35-ranked-sort-http-once.py
      - name: Cleanup notice
        if: always()
        run: echo "Revoke temporary Lv1 staging session immediately. No production data or deploy."
