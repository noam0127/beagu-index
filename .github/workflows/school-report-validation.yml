name: School Report UI Validation
on:
  push:
    branches: [main]
    paths:
      - school-report.html
      - tests/school-report-validation.mjs
      - .github/workflows/school-report-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate report UI code
        run: node tests/school-report-validation.mjs
