name: Emergency isolated school discovery site deploy
on:
  push:
    branches:
      - 'hotfix/school-discovery-only-20261124'
    paths:
      - '.github/workflows/emergency-school-discovery-only-20261124.yml'
permissions:
  contents: read
  pages: write
  actions: read
  id-token: write
concurrency:
  group: github-pages-direct
  cancel-in-progress: false
jobs:
  isolated-hotfix:
    name: Publish pinned, isolated hotfix
    runs-on: ubuntu-latest
    timeout-minutes: 14
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable hotfix and exact changed-file scope
        shell: bash
        run: |
          set -euo pipefail
          HOTFIX='ff6d4ec2d59f0a4aa0f84531be633896d321943b'
          BASE='36c68c8394a77a94541a2ad04a83db7242639c0c'
          git cat-file -e "${HOTFIX}^{commit}"
          node --check <(git show "${HOTFIX}:js/beagu-home-schools-v1.js") || true
          git diff --name-only "${BASE}" "${HOTFIX}" > /tmp/scope.txt
          cat > /tmp/expected.txt <<'FILES'
          index.html
          js/beagu-home-schools-v1.js
          js/beagu-participation-auth-v2.js
          js/beagu-school-interest-v1.js
          release-candidate.json
          search-lv1.html
          search.html
          styles/beagu-home-schools-v1.css
          styles/beagu-school-interest-v1.css
          FILES
          diff -u /tmp/expected.txt /tmp/scope.txt
          test "$(git show "${HOTFIX}:CNAME")" = 'baeguindex.com'
      - name: Build site from immutable approved scope only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release_site
          git archive --format=tar 'ff6d4ec2d59f0a4aa0f84531be633896d321943b' | tar -xf - -C _release_site
          test -f _release_site/index.html
          test -f _release_site/search.html
          test -f _release_site/js/beagu-home-schools-v1.js
          test -f _release_site/data/public-lv0-percentiles-v1.2.json
          test "$(cat _release_site/CNAME)" = 'baeguindex.com'
          node --check _release_site/js/beagu-home-schools-v1.js
          node --check _release_site/js/beagu-school-interest-v1.js
          node --check _release_site/js/beagu-participation-auth-v2.js
          touch _release_site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _release_site
      - name: Wait for GitHub Pages artifact index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" = '1' ]; then
              sleep 4
              exit 0
            fi
            sleep 5
          done
          echo 'GitHub Pages artifact not indexed'
          exit 1
      - name: Deploy exact isolated snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
