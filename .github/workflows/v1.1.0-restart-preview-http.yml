name: v1.1.0 restart — preview HTTPS and asset smoke
on:
  push:
    branches:
      - develop/v1.1.0-restart-20261121
    paths:
      - '.github/workflows/v1.1.0-restart-preview-http.yml'
      - 'tests/staging-http-smoke.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-http:
    name: Production and preview HTTP access (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production and preview HTTP 200, HTML, and local assets
        env:
          BEAGU_SITE_ORIGIN: https://baeguindex.com
          BEAGU_SMOKE_ATTEMPTS: '3'
          BEAGU_SMOKE_TIMEOUT: '12'
          BEAGU_SMOKE_RETRY_SECONDS: '2'
        run: python3 tests/staging-http-smoke.py
