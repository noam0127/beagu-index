name: v1.12.05 administrator registration validation
on:
  push:
    branches: ['fix/v11205-court-integrated']
permissions:
  contents: read
jobs:
  registration-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact production ancestry and candidate metadata
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 5d41af9bfc8d6036ec2ef6fc783f677473b85b10)" = "5d41af9bfc8d6036ec2ef6fc783f677473b85b10"
          test "$(git rev-parse HEAD)" != "5d41af9bfc8d6036ec2ef6fc783f677473b85b10"
          count=$(git diff --name-only 5d41af9bfc8d6036ec2ef6fc783f677473b85b10 HEAD | wc -l)
          test "$count" -gt 0 && test "$count" -lt 300
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('release-candidate.json','utf8'));
          const info=JSON.parse(fs.readFileSync('release-info.json','utf8'));
          assert.equal(manifest.version,'v1.12.05');
          assert.equal(info.version,manifest.version);
          assert.equal(info.name,'코트 정돈');
          assert.equal(info.environment,'candidate');
          assert.equal(info.deployedAt,null);
          assert.ok(manifest.summary.trim().length>=3&&manifest.summary.trim().length<=500);
          JS
      - name: Mocked administrator register guard only
        run: node tests/direct-pages-release-contract.cjs
      - name: Verify closed-choice projection
        run: node tests/closed-choice-privacy-v1.mjs
